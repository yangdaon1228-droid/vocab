<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="삼국지">
<title>삼국지 40화 — 한일 학습</title>
<style>
:root{--bg:#fafaf8;--card:#ffffff;--soft:#f1f0ec;--line:#e6e4de;--line2:#d4d2cb;--tx:#191918;--sub:#6e6d68;--gray:#9b9a94;--blue:#2F74E8;--green:#0E9A72;--pink:#E0418A;--hl:#FDE4EF}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--card:#1b1b1a;--soft:#232321;--line:#2b2b29;--line2:#3a3a37;--tx:#f1f0ec;--sub:#a4a39d;--gray:#85847f;--blue:#5B97F5;--green:#2BB88E;--pink:#F0609F;--hl:rgba(240,96,159,.24)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);overflow-x:hidden;width:100%;-webkit-text-size-adjust:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:620px;margin:0 auto;padding:0 18px 120px;overflow-x:hidden}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line2);border-radius:5px;padding:0 12px;height:38px;font-size:14px;cursor:pointer}
button:disabled{opacity:.4}
.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 0 12px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:6px}
.ico{width:38px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.ico svg{width:18px;height:18px}
.epbtn{font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px}
.pill svg{width:16px;height:16px}
.cnt{font-size:12px;color:var(--sub)}
.seg{display:grid;grid-template-columns:1fr 1fr;margin-top:10px}
.seg button{height:34px;font-size:13px;border-radius:0;color:var(--sub)}
.seg button:first-child{border-radius:5px 0 0 5px}.seg button:last-child{border-radius:0 5px 5px 0;border-left:none}
.seg button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.panel{display:none;margin-top:10px;border:1px solid var(--line2);border-radius:6px;background:var(--card);max-height:62vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.panel.show{display:block}
.ph{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px;font-weight:700;position:sticky;top:0;background:var(--card);z-index:1}
.pb{padding:12px 14px}
.empty{color:var(--sub);font-size:14px;line-height:1.7}
.eplist{max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.eprow{display:flex;gap:10px;align-items:baseline;width:100%;height:auto;min-height:46px;text-align:left;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:10px 14px;background:var(--card)}
.eprow b{flex:none;width:42px;font-size:13px;color:var(--sub)}
.eprow span{flex:1;min-width:0;font-size:14px;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}
.eprow.on{background:var(--soft)}.eprow.on b{color:var(--pink)}
.bm{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.bm:last-child{border-bottom:none}
.bm a{flex:1;min-width:0;color:var(--tx);text-decoration:none;font-size:14px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.bm small{display:block;color:var(--sub);font-size:12px}
.x{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none;border-color:var(--line)}
.x svg{width:14px;height:14px}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:12px}
.chips button{height:32px;font-size:13px;padding:0}
.chips button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.vc{position:relative;border:1px solid var(--line);border-left:4px solid var(--c);background:var(--card);padding:14px 44px 14px 16px;margin:0 0 10px}
.vc .x{position:absolute;top:10px;right:10px}
.vc .b{font-size:22px;font-weight:700;color:var(--c);margin:0;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.vc .m{font-size:16px;font-weight:700;margin:2px 0 10px}
.vc .rows{border-top:1px solid var(--line);padding-top:8px}
.vc .r{display:flex;gap:10px;font-size:14px;line-height:1.75}
.vc .r span:first-child{width:30px;flex:none;color:var(--sub);font-size:12px;padding-top:2px}
.vc .r em{font-style:normal;color:var(--sub)}
.meta{font-size:13px;color:var(--sub);margin:28px 0 6px;letter-spacing:.2px}
h1{font-size:24px;line-height:1.4;margin:0 0 16px;word-break:keep-all;overflow-wrap:anywhere}
.prev{font-size:15px;color:var(--sub);line-height:1.7;margin:0 0 14px;padding:12px 14px;background:var(--soft);border-radius:5px;word-break:keep-all}
.prev b{color:var(--tx);font-size:13px;display:block;margin-bottom:2px}
.legend{font-size:12px;color:var(--sub);margin:0 0 30px;line-height:1.9}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 46px 18px 18px;margin:0 0 30px}
.k{font-size:19px;font-weight:700;line-height:1.55;margin:0;word-break:keep-all;overflow-wrap:anywhere}
.j{font-size:17px;line-height:1.6;margin:10px 0 0;padding-top:10px;border-top:1px solid var(--line);word-break:keep-all;overflow-wrap:anywhere}
.ko .j{display:none}
.p{color:var(--gray)}.n{color:var(--pink)}.v{color:var(--blue)}.a{color:var(--green)}
.ko .p,.ko .n,.ko .v,.ko .a{color:var(--tx)}.ko .legend{display:none}
.j [data-w]{cursor:pointer;border-radius:3px;padding:1px 1px;margin:0 -1px;transition:background .15s}
.j [data-w].hl{background:var(--hl)}
.mark{position:absolute;top:12px;right:10px;border:none;background:none;padding:0;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--line2)}
.mark.on{color:var(--pink)}
.mark svg{width:19px;height:19px}
.card.hit{border-color:var(--pink)}
.sec{display:flex;align-items:center;gap:10px;margin:52px 0 18px;font-size:14px;font-weight:700;color:var(--sub)}
.sec:after{content:"";flex:1;height:1px;background:var(--line)}
.chart{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:0 0 8px;font-size:15px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
.chart b{display:block;font-size:15px;margin-bottom:2px}
.memo{font-size:15px;line-height:1.8;color:var(--sub);margin:0 0 10px;padding-left:12px;border-left:2px solid var(--line2);word-break:keep-all;overflow-wrap:anywhere}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:44px}
.nav button{height:48px;font-size:15px}
.bk{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bk button{font-size:13px;padding:0 6px}
textarea{width:100%;font:inherit;font-size:13px;color:var(--tx);background:var(--bg);border:1px solid var(--line2);border-radius:5px;padding:8px;resize:vertical}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);font-size:14px;padding:10px 16px;border-radius:5px;opacity:0;pointer-events:none;transition:all .2s;max-width:86vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="top">
    <div class="bar">
      <button class="ico" id="pvT" type="button" aria-label="이전 화"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="epbtn" id="epBtn" type="button"><span id="epLbl">제1화</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="sp"></div>
      <button class="ico" id="bkBtn" type="button" aria-label="백업"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
      <button class="pill" id="bmBtn" type="button" aria-label="책갈피"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span class="cnt" id="bmCnt">0</span></button>
      <button class="pill" id="vbBtn" type="button" aria-label="단어장"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="14" rx="1"/><path d="M8 10h8M8 14h5"/></svg><span class="cnt" id="vbCnt">0</span></button>
    </div>
    <div class="seg"><button id="m0" type="button" class="on">한일 학습</button><button id="m1" type="button">한국어 몰입</button></div>
    <div class="panel" id="epPanel" style="overflow:hidden"><div class="ph">회차 선택<span class="cnt">위아래로 스크롤</span></div><div class="eplist" id="epGrid"></div></div>
    <div class="panel" id="bmPanel"><div class="ph">책갈피</div><div class="pb" id="bmList"></div></div>
    <div class="panel" id="bkPanel"><div class="ph">백업·복원</div><div class="pb">
      <p class="empty" style="margin:0 0 12px">단어장·책갈피·진도는 이 기기 브라우저에 자동 저장돼요. 기기를 바꾸거나 날아갈 때를 대비해 가끔 백업해 두세요.</p>
      <div class="bk"><button type="button" id="bkDown">백업 파일 저장</button><button type="button" id="bkUp">백업 파일 불러오기</button><button type="button" id="bkCopy">백업 내용 복사</button><button type="button" id="bkPasteBtn">붙여넣어 복원</button></div>
      <input type="file" id="bkFile" accept=".json,application/json,text/plain" style="display:none">
      <div id="bkPasteBox" style="display:none;margin-top:10px"><textarea id="bkText" rows="4" placeholder="복사해 둔 백업 내용을 여기에 붙여넣으세요"></textarea><button type="button" id="bkApply" style="width:100%;margin-top:6px">이 내용으로 복원</button></div>
      <p class="empty" id="bkMsg" style="margin:10px 0 0;font-size:13px"></p>
    </div></div>
    <div class="panel" id="vbPanel"><div class="ph">단어장<span class="cnt" id="vbInfo"></span></div><div class="pb"><div class="chips" id="vbChips"></div><div id="vbList"></div></div></div>
  </div>
  <div id="ep"></div>
</div>
<div class="toast" id="toast"></div>
<script>

const E=[
{t:`짚신 팔던 놈이 황실 족보를 꺼냄`,y:`서기 184년`,prev:``,
s:[
[`서기 184년, 4백 년 가까이 이어진 @한나라@에서 수십만 *사람*이 머리에 노란 *천*을 ^두르고^ 들고일어남.`,`세이레키 햐쿠하치쥬-요넨, 욘햐쿠넨 치카쿠 츠즈이타 @칸@데 스-쥬-만노 *히토*가 아타마니 키이로이 *누노*오 ^마이테^ 타치아가리마시타.`],
[`이들의 *구호*는 "푸른 *하늘*은 이미 ^죽었다^"였음.`,`카레라노 *스로-간*와 "아오이 *소라*와 스데니 ^신다^" 데시타.`],
[`우두머리 @장각@은 원래 *병*을 고쳐주며 *신자*를 모으던 종교 지도자였음.`,`리-다-노 @쵸-카쿠@와 모토모토 *뵤-키*오 나오시테 *신자*오 아츠메테 이타 슈-쿄-노 시도-샤데시타.`],
[`그런데 왜 그렇게 많은 *사람*이 이 *남자*를 ^따랐을까^?`,`데와 나제 손나니 오-쿠노 *히토*가 코노 *오토코*니 ^츠이테 잇타^노데쇼-카?`],
[`*이유*는 간단한데, *나라*가 이미 +망가져+ 있었음.`,`*리유-*와 칸탄데, *쿠니*가 스데니 +코와레테+ 이마시타.`],
[`조정에선 @환관@들이 *권력*을 쥐었고, *돈*을 받고 관직까지 ^팔았음^.`,`쵸-테이데와 @칸간@타치가 *켄료쿠*오 니기리, *오카네*오 우케톳테 칸쇼쿠마데 ^웃테 이마시타^.`],
[`관직을 산 *사람*들은 본전을 뽑으려고 백성의 *지갑*을 ^쥐어짰음^.`,`칸쇼쿠오 캇타 *히토*타치와 모토오 토루 타메니 민슈-노 *사이후*오 ^시보리토리마시타^.`],
[`역병까지 도는 *상황*에서 *희망*을 주는 쪽에 붙는 건 +자연스러운+ 선택이었음.`,`에키뵤-마데 하야루 *죠-쿄-*데, *키보-*오 쿠레루 호-니 츠쿠 노와 +시젠나+ 센타쿠데시타.`],
[`반란이 커지자 @유주@의 *관청*은 의병 모집 *공고*를 ^붙임^.`,`한란가 오-키쿠 나루토, @유-슈-@노 *야쿠쇼*와 기헤이 보슈-노 *하리가미*오 ^다시마시타^.`],
[`그 공고 *앞*에서 한 *남자*가 한참 서 있다가 길게 *한숨*을 ^쉼^.`,`소노 하리가미노 *마에*데 히토리노 *오토코*가 시바라쿠 탓테 이테, 나가이 *타메이키*오 ^츠키마시타^.`],
[`이 남자가 @유비@, 스물넷쯤 된 *나이*에 *엄마*랑 짚신을 ^팔아^ 먹고사는 청년이었음.`,`코노 오토코가 @류-비@데, 니쥬-욘사이 쿠라이노 *토시*데 *하하*토 와라지오 ^웃테^ 쿠라스 세이넨데시타.`],
[`근데 이 남자, *지갑*은 +가난한데+ *집안*은 화려함.`,`데모 코노 오토코, *사이후*와 +마즈시이+ 노니 *이에가라*와 하나야카데스.`],
[`한나라 @황실@의 먼 *친척*, @중산정왕@의 *후손*이라고 ^주장했음^.`,`칸노 @코-시츠@노 토-이 *신세키*, @츄-잔세이오-@노 *시손*다토 ^슈쵸-시테 이마시타^.`],
[`*문제*는 그 족보로 *밥* 한 그릇도 ^못 산다^는 거였음.`,`*몬다이*와 소노 케이즈데 *고항* 잇파이모 ^카에나이^ 코토데시타.`],
[`그때 뒤에서 한 *남자*가 ^소리침^ — "사내가 *나라*를 위해 힘을 안 쓰고 왜 한숨만 쉬쇼?"`,`소노 토키 우시로카라 히토리노 *오토코*가 ^사케비마시타^ — "오토코가 *쿠니*노 타메니 치카라오 츠쿠사즈, 나제 타메이키바카리 츠쿠노다?"`],
[`돌아보니 호랑이 수염을 한 *덩치*가 서 있었는데, *이름*은 @장비@.`,`후리무쿠토 토라노요-나 히게노 *오-오토코*가 탓테 이테, *나마에*와 @쵸-히@데시타.`],
[`@장비@는 이 *동네*에서 술 팔고 돼지 잡으며 *재산*을 꽤 ^모아둔^ 사람이었음.`,`@쵸-히@와 코노 *마치*데 사케오 우리 부타오 사바이테, *자이산*오 카나리 ^타쿠와에테 이타^ 히토데시타.`],
[`@유비@가 솔직하게 ^털어놓음^ — "도적을 막고 싶은 *마음*은 있는데, *힘*이 없소."`,`@류-비@와 쇼-지키니 ^우치아케마시타^ — "조쿠오 후세기타이 *키모치*와 아루노데스가, *치카라*가 나이노데스."`],
[`그러자 @장비@가 ^제안함^ — "내 *돈* 다 털어서 *사람* 모읍시다."`,`스루토 @쵸-히@가 ^테-안시마시타^ — "와타시노 *오카네*오 젠부 다시테 *히토*오 아츠메마쇼-."`],
[`첫 만남에 전 재산 베팅, 요즘으로 치면 *투자자*가 *계획서*도 안 보고 ^도장 찍은^ 거임ㅋㅋ`,`하츠타이멘데 젠자이산오 카케루, 이마데 이에바 *토-시카*가 *케이카쿠쇼*모 미즈니 ^항코오 오시타^ 요-나 모노데스.`],
[`둘이 *가게*에서 *계획*을 짜는데, 수레를 끄는 거구가 하나 ^들어옴^.`,`후타리가 *미세*데 *케이카쿠*오 네테 이루토, 쿠루마오 히쿠 오-오토코가 히토리 ^하잇테 키마시타^.`],
[`*얼굴*은 대추처럼 +붉고+, *수염*은 가슴까지 늘어진 남자, @관우@였음.`,`*카오*와 나츠메노 요-니 +아카쿠+, *히게*와 무네마데 타레타 오토코, @칸우@데시타.`],
[`고향에서 *권력* 믿고 사람 괴롭히던 토호를 ^죽인^ *뒤*, 5~6년째 *도망* 중이었음.`,`코쿄-데 *켄료쿠*오 카사니 히토오 이지메테 이타 유-료쿠샤오 ^코로시타^ *아토*, 고, 로쿠넨 *토-보-*츄-데시타.`],
[`세 *사람*은 그날 *밤* 서로의 *꿈*이 같다는 걸 ^확인함^.`,`*산닌*와 소노 *요루*, 오타가이노 *유메*가 오나지다토 ^카쿠닌시마시타^.`],
[`다음 날, @장비@네 *집* 뒤 복숭아밭에서 셋은 하늘에 *약속*을 ^올림^.`,`요쿠지츠, @쵸-히@노 *이에*노 우라노 모모바타케데 산닌와 텐니 *야쿠소쿠*오 ^사사게마시타^.`],
[`"같은 *날* 태어나진 못했지만, 같은 *날* ^죽기를^ 원한다."`,`"오나지 *히*니 우마레루 코토와 데키마센데시타가, 오나지 *히*니 ^시누^ 코토오 네가이마스."`],
[`이게 @도원결의@, @유비@가 첫째 *형*, @관우@가 둘째, @장비@가 *막내*가 ^됨^.`,`코레가 @토-엔노 치카이@데, @류-비@가 쵸-난노 *아니*, @칸우@가 지난, @쵸-히@가 *스엣코*니 ^나리마시타^.`],
[`@장비@의 *돈*으로 모은 동네 *청년* 5백 명, 이게 @유비@ 인생의 첫 *자본*이었음.`,`@쵸-히@노 *오카네*데 아츠메타 마치노 *와카모노* 고햐쿠닌, 코레가 @류-비@노 진세이데 사이쇼노 *시혼*데시타.`],
[`지나가던 말 *장사꾼* 둘도 셋을 보고 *돈*을 ^대줬음^.`,`토-리가캇타 우마노 *쇼-닌* 후타리모 산닌오 미테 *오카네*오 ^다시테 쿠레마시타^.`],
[`사람 보는 *눈*이 곧 *투자*였던 거임.`,`히토오 미루 *메*가 소노 마마 *토-시*닷타노데스.`],
[`*대장간*에 *무기*도 ^맞춤^ — @관우@는 82근짜리 @청룡언월도@, @장비@는 @장팔사모@.`,`*카지야*니 *부키*모 ^츄-몬시마시타^ — @칸우@와 하치쥬-니킨노 @세-류-엔게츠토-@, @쵸-히@와 @쟈-하치다보-@.`],
[`그렇게 짚신 팔던 *청년*이 *리더*가 되어 첫 전쟁터로 ^출발함^.`,`코-시테 와라지오 웃테 이타 *세이넨*가 *리-다-*니 낫테, 하지메테노 센죠-에 ^슛파츠시마시타^.`]
],
an:`유비`,a:[
[`@유비@한테는 *돈*도 *군대*도 없었지만, *사람*이 ^따라오는^ 힘이 있었음.`,`@류-비@니와 *오카네*모 *군타이*모 아리마센데시타가, *히토*가 ^츠이테 쿠루^ 치카라가 아리마시타.`],
[`어린 시절 집 앞 뽕나무를 보고 "언젠가 이런 황제 *수레*를 탈 거야"라고 했다는 *기록*이 정사에 있음.`,`코도모노 코로 이에노 마에노 쿠와노 키오 미테 "이츠카 코-유- 코-테이노 *쿠루마*니 노루" 토 잇타토 이우 *키로쿠*가 세이시니 아리마스.`],
[`다만 이날 @유비@는 남의 *돈*, 남의 *힘*에 +완전히+ 기대고 있었음.`,`타다 코노 히 @류-비@와 타닌노 *오카네*, 타닌노 *치카라*니 +칸젠니+ 타욧테 이마시타.`],
[`남에게 ^기대는^ 이 *습관*이 앞으로 @유비@를 몇 번이나 살리고, 몇 번이나 곤란한 *처지*로 몰아넣음.`,`히토니 ^타요루^ 코노 *슈-칸*가 코레카라 @류-비@오 난도모 스쿠이, 난도모 쿠루시이 *타치바*니 오이코미마스.`]
],
w:[
[`가진 게 없을 땐 *자원*보다 *이유*를 먼저 ^보여줘야^ 함.`,`나니모 나이 토키와 *시겐*요리 *리유-*오 사키니 ^미세루^ 히츠요-가 아리마스.`],
[`@유비@가 솔직하게 *속마음*을 ^말하자^, @장비@가 *지갑*을 열었음.`,`@류-비@가 쇼-지키니 *혼네*오 ^하나스토^, @쵸-히@가 *사이후*오 히라키마시타.`],
[`*회의*에서도 +절실한+ *이유*를 먼저 말하는 사람한테 예산이 붙음.`,`*카이기*데모 +세츠지츠나+ *리유-*오 사키니 하나스 히토니 요산가 츠키마스.`]
],
m:[`도원결의는 소설 《삼국지연의》의 창작임. 진수의 정사 《삼국지》 관우전에는 셋이 "잘 때 한 침상을 쓰고 형제 같은 정을 나눴다" 정도만 나옴.`,`관우의 토호 살해, 청룡언월도·장팔사모, 82근 설정도 연의 쪽 이야기임.`,`유비의 중산정왕 후손 주장, 짚신·돗자리 장사, 뽕나무 일화, 말 장수 장세평·소쌍의 후원은 정사에도 기록돼 있음. "창천이사" 구호는 《후한서》에 나옴.`],
nx:[`첫 *전투*에서 목숨 걸고 구해준 *상대*가 고맙단 말 대신 "너 관직 뭔데?"를 ^물어봄^.`,`하지메테노 *타타카이*데 이노치가케데 타스케타 *아이테*가 오레이노 카와리니 "오마에노 칸쇼쿠와 난다?" 토 ^키이테 키마스^.`]
},
{t:`목숨 구해줬더니 "너 직급 뭔데?"`,y:`서기 184~189년`,prev:`짚신 장수 유비가 장비·관우와 의형제를 맺고, 의병 5백 명을 이끌고 출발함.`,
s:[
[`첫 *전투*에서 @유비@ 삼형제는 @황건적@을 박살 내고 *이름*을 ^알림^.`,`하지메테노 *타타카이*데 @류-비@ 산쿄-다이와 @코-킨조쿠@오 우치야부리, *나마에*오 ^시라시메마시타^.`],
[`기세를 탄 셋은 적에게 쫓기던 관군 *부대*를 *위기*에서 ^구해줌^.`,`이키오이니 놋타 산닌와 테키니 오와레테 이타 칸군노 *부타이*오 *키키*카라 ^스쿠이마시타^.`],
[`그 부대 *대장*은 @동탁@, 서쪽 변방 @서량@에서 거칠게 커온 *군벌*이었음.`,`소노 부타이노 *타이쇼-*와 @토-타쿠@데, 니시노 헨쿄- @세이료-@데 아라아라시쿠 소닷타 *군바츠*데시타.`],
[`근데 @동탁@이 *감사* 인사 대신 처음 ^물어본^ 게 "너희 *직급* 뭐냐?"였음.`,`데모 @토-타쿠@가 *칸샤*노 아이사츠노 카와리니 사이쇼니 ^키이타^ 노와 "오마에타치노 *야쿠쇼쿠*와 난다?" 데시타.`],
[`"없습니다"라는 *대답*에 @동탁@의 *태도*가 싹 +차가워짐+.`,`"아리마센" 토 이우 *헨지*니 @토-타쿠@노 *타이도*가 가라리토 +츠메타쿠 나리마시타+.`],
[`목숨 구해준 *사람*을 *명함* 없다고 ^무시한^ 거임.`,`이노치노 온진데 아루 *히토*오 *메이시*가 나이 카라토 ^무시시타^ 노데스.`],
[`@장비@가 *칼*을 뽑아 ^달려들자^, 두 *형*이 겨우 말림.`,`@쵸-히@가 *카타나*오 누이테 ^토비카카루토^, 후타리노 *아니*가 얏토 토메마시타.`],
[`이 무례한 *남자*가 5년 뒤 *나라* 전체를 ^집어삼킬^ 줄은 아무도 몰랐음.`,`코노 부레이나 *오토코*가 고넨고니 *쿠니*젠타이오 ^노미코무^ 토와 다레모 오모이마센데시타.`],
[`난이 끝나고 @유비@는 *공*을 인정받아 작은 *마을*의 치안 *책임자*가 ^됨^.`,`란가 오와리, @류-비@와 *테가라*오 미토메라레, 치이사나 *무라*노 치안 *세키닌샤*니 ^나리마시타^.`],
[`짚신 팔던 *청년*으로선 +대단한+ *출세*였음.`,`와라지오 웃테 이타 *세이넨*니 톳테와 +타이시타+ *슛세*데시타.`],
[`그런데 몇 *달* 뒤, 위에서 내려온 감찰관 @독우@가 *뇌물*을 ^요구함^.`,`토코로가 스-*카게츠*고, 우에카라 키타 칸사츠칸노 @토쿠유-@가 *와이로*오 ^요-큐-시마시타^.`],
[`*돈* 안 내면 *자리*에서 ^잘라버리겠다^는 협박이었음.`,`*오카네*오 다사나케레바 *포스토*카라 ^하즈스^ 토 이우 오도시데시타.`],
[`소설에선 빡친 @장비@가 @독우@를 *나무*에 묶고 *가지*로 ^두들겨 팸^.`,`쇼-세츠데와 오콧타 @쵸-히@가 @토쿠유-@오 *키*니 시바리, *에다*데 ^멧타우치니 시마시타^.`],
[`결국 @유비@는 *관인*을 내려놓고, 셋은 다시 *떠돌이*가 ^됨^.`,`켓쿄쿠 @류-비@와 *칸인*오 오키, 산닌와 마타 *루로-노 미*니 ^나리마시타^.`],
[`그 *사이* 수도 @낙양@의 *궁궐*에선 훨씬 +큰+ 판이 벌어지고 있었음.`,`소노 *아이다*, 미야코 @라쿠요-@노 *큐-덴*데와 즛토 +오-키나+ 쇼-부가 하지맛테 이마시타.`],
[`189년, @영제@가 죽고 열네 *살*쯤 된 *아들*이 @황제@가 ^됨^.`,`햐쿠하치쥬-큐-넨, @레-테이@가 나쿠나리, 쥬-욘*사이* 호도노 *무스코*가 @코-테이@니 ^나리마시타^.`],
[`새 황제의 *외삼촌*이 @대장군@ @하진@, *여동생*이 황후가 되면서 ^벼락출세한^ 사람임.`,`아타라시이 코-테이노 *오지*가 @다이쇼-군@노 @카신@데, *이모-토*가 코-고-니 낫테 ^이치야쿠 슛세시타^ 히토데스.`],
[`@하진@은 *권력* 다툼 끝에 @환관@들을 싹 ^제거하기로^ *결정*함.`,`@카신@와 *켄료쿠* 아라소이노 스에, @칸간@타치오 미나 ^하이죠스루^ 코토니 *케테이*시마시타.`],
[`이때 4대째 최고 관직을 낸 *집안*의 *엘리트* @원소@가 ^제안함^ — "지방 장군들을 불러서 압박합시다."`,`코노 토키, 욘다이 츠즈케테 사이코-노 칸쇼쿠오 다시타 *이에*노 *에리-토* @엔쇼-@가 ^테-안시마시타^ — "치호-노 쇼-군타치오 욘데 앗파쿠 시마쇼-."`],
[`그렇게 불려온 장군 *명단*에 @동탁@의 *이름*이 ^들어 있었음^.`,`소-시테 요바레타 쇼-군노 *리스토*니 @토-타쿠@노 *나마에*가 ^하잇테 이마시타^.`],
[`*회의*에서 한 젊은 장교가 웃으며 ^반대함^ — "환관 몇 명 잡는 데 무슨 *군대*를 부릅니까."`,`*카이기*데 히토리노 와카이 쇼-코-가 와라이나가라 ^한타이시마시타^ — "칸간 스-닌오 츠카마에루 노니 나제 *군타이*오 요부노데스카."`],
[`그 사람이 @조조@, @환관@ *할아버지*를 둔 *집안* 출신이라는 꼬리표를 단 +야심 찬+ 남자였음.`,`소노 히토가 @소-소-@데, @칸간@노 *소후*오 모츠 *이에*노 데다토 이우 레테루오 하라레타 +야신테키나+ 오토코데시타.`],
[`하지만 @하진@은 그 *의견*을 ^무시했고^, 이 *선택*이 모든 걸 바꿔버림.`,`데스가 @카신@와 소노 *이켄*오 ^무시시^, 코노 *센타쿠*가 스베테오 카에테 시마이마시타.`]
],
an:`하진`,a:[
[`@하진@은 *계획*을 세워놓고도 몇 *달*을 ^망설였음^.`,`@카신@와 *케이카쿠*오 탓테테모 난*카게츠*모 ^타메라이마시타^.`],
[`그 *사이* *정보*는 사방으로 ^새어 나갔음^.`,`소노 *아이다*니 *죠-호-*와 아치코치니 ^모레마시타^.`],
[`남의 *힘*으로 *문제*를 ^해결하려는^ 사람은 결국 그 힘에 휘둘림.`,`타닌노 *치카라*데 *몬다이*오 ^카이케츠시요-토 스루^ 히토와 켓쿄쿠 소노 치카라니 후리마와사레마스.`]
],
w:[
[`작은 *문제*를 풀려고 더 +큰+ *문제*를 불러들이면 안 됨.`,`치이사나 *몬다이*오 토쿠 타메니 요리 +오-키나+ *몬다이*오 마네키이레테와 이케마센.`],
[`*회사* 안 갈등을 외부 *세력*에 맡겼다가 회사가 통째로 ^넘어가는^ 거랑 같음.`,`*카이샤*노 나카노 아츠레키오 가이부노 *세료쿠*니 마카세테, 카이샤고토 ^놋토라레루^ 노토 오나지데스.`]
],
m:[`동탁을 구해줬다가 무시당하는 장면은 연의의 창작임.`,`유비가 얻은 자리는 정사 기준 안희현의 현위(치안 담당)임. 독우를 때린 건 정사에선 장비가 아니라 유비 본인임. 묶어놓고 곤장 2백 대를 친 뒤 관인을 목에 걸어두고 떠났다고 나옴. 연의가 이 장면을 장비 몫으로 옮김.`,`조조가 지방군을 부르는 데 반대했다는 이야기는 정사 주석(《위서》)에 나옴.`],
nx:[`@하진@이 혼자 *궁*에 들어간 그 *날*, 담장 밖으로 머리 하나가 ^던져짐^.`,`@카신@가 히토리데 *큐-덴*니 하잇타 소노 *히*, 헤이노 소토에 쿠비가 히토츠 ^나게다사레마스^.`]
},
{t:`황제 구하러 온 놈이 황제를 갈아치움ㅋㅋ`,y:`서기 189년`,prev:`하진이 환관을 치려고 지방 군벌 동탁을 수도로 부름. 조조의 반대는 무시당함.`,
s:[
[`189년 8월, @하진@은 @태후@를 만나러 *궁*에 혼자 갔다가 @환관@들의 *칼*에 ^살해당함^.`,`햐쿠하치쥬-큐-넨 하치가츠, @카신@와 @타이코-@니 아우 타메 히토리데 *큐-덴*니 이키, @칸간@타치노 *카타나*데 ^코로사레마시타^.`],
[`먼저 칠 *계획*을 세운 *쪽*이 먼저 ^당한^ 거임.`,`사키니 우츠 *케이카쿠*오 탓테타 *호-*가 사키니 ^야라레타^ 노데스.`],
[`*소식*을 들은 @원소@는 *군사*를 이끌고 궁궐로 ^쳐들어감^.`,`*시라세*오 키이타 @엔쇼-@와 *헤이*오 히키이테 큐-덴니 ^세메코미마시타^.`],
[`*수염* 없는 *남자*는 환관인 줄 알고 다 ^죽였는데^, 죽은 사람이 2천 명이 넘었다고 기록됨.`,`*히게*노 나이 *오토코*와 칸간다토 오못테 미나 ^코로시^, 신다 히토와 니센닌오 코에타토 키로쿠사레테 이마스.`],
[`살아남은 환관 @장양@은 어린 @황제@와 그 *동생* @진류왕@을 끌고 *밤길*로 ^도망침^.`,`이키노콧타 칸간 @쵸-죠-@와 오사나이 @코-테이@토 소노 *오토-토* @친류-오-@오 츠레테 *요미치*오 ^니게마시타^.`],
[`*추격대*에 몰린 @장양@은 결국 *강*에 ^몸을 던짐^.`,`*츠이게키타이*니 오이츠메라레타 @쵸-죠-@와 켓쿄쿠 *카와*니 ^미오 나게마시타^.`],
[`밤새 헤매던 두 *형제* 앞에 대군이 ^나타났는데^, 그 맨 *앞*에 @동탁@이 있었음.`,`히토반쥬- 사마욧테 이타 *쿄-다이*노 마에니 다이군가 ^아라와레^, 소노 *센토-*니 @토-타쿠@가 이마시타.`],
[`겁먹은 @황제@는 *말*도 제대로 못 했는데, 아홉 살 동생 @진류왕@은 *상황*을 +또박또박+ 설명함.`,`오비에타 @코-테이@와 *코토바*모 데마센데시타가, 큐-사이노 오토-토 @친류-오-@와 *죠-쿄-*오 +하키하키토+ 세츠메이시마시타.`],
[`*기록*에 따르면 @동탁@은 이때부터 *형*보다 동생을 더 ^마음에 들어 했음^.`,`*키로쿠*니 요루토 @토-타쿠@와 코노 토키카라 *아니*요리 오토-토오 ^키니 이리마시타^.`],
[`근데 @낙양@에 들어온 @동탁@의 *군사*는 사실 3천 명 *규모*밖에 ^안 됐음^.`,`데모 @라쿠요-@니 하잇타 @토-타쿠@노 *헤이*와 지츠와 산젠닌 *키보*니 ^스기마센데시타^.`],
[`그래서 *밤*마다 몰래 군사를 내보냈다가 *낮*에 다시 ^행진시켜^ 들어오게 함.`,`소코데 *요루*고토니 콧소리 헤이오 다시, *히루*니 마타 ^코-신사세테^ 하이라세마시타.`],
[`*사람*들은 @동탁@의 병력이 끝없다고 ^착각함^ — 이게 *허세*의 힘임ㅋㅋ`,`*히토*비토와 @토-타쿠@노 헤이료쿠가 카기리나이토 ^칸치가이시마시타^ — 코레가 *핫타리*노 치카라데스.`],
[`다음 *목표*는 수도 *경비*를 맡은 @정원@의 군대였음.`,`츠기노 *모쿠효-*와 미야코노 *케이비*오 탄토-스루 @테이겐@노 군타이데시타.`],
[`@정원@ 밑에는 *활*과 *말* 실력으로 유명한 부하 @여포@가 있었음.`,`@테이겐@노 모토니와 *유미*토 *우마*노 우데데 유-메이나 부카, @료후@가 이마시타.`],
[`@동탁@은 @여포@에게 *스카우트* *제안*을 넣었고, 소설에선 명마 @적토마@까지 ^얹어줌^.`,`@토-타쿠@와 @료후@니 *스카우토*노 *테-안*오 시, 쇼-세츠데와 메이바 @세키토바@마데 ^츠케마시타^.`],
[`그러자 @여포@는 자기 *상사* @정원@을 죽이고 그 *부대*를 데리고 @동탁@에게 ^갈아탐^.`,`스루토 @료후@와 지분노 *죠-시* @테이겐@오 코로시, 소노 *부타이*오 츠레테 @토-타쿠@노 모토에 ^노리카에마시타^.`],
[`*연봉* 협상 한 번에 전 *직장* 사장을 ^처리하고^ 이직한 셈임.`,`*넨포-* 코-쇼- 이치도데 마에노 *쇼쿠바*노 샤쵸-오 ^쇼리시테^ 텐쇼쿠시타 요-나 모노데스.`],
[`이제 @낙양@에서 @동탁@을 막을 *세력*도, *사람*도 ^사라짐^.`,`코레데 @라쿠요-@니 @토-타쿠@오 토메라레루 *세료쿠*모 *히토*모 ^이나쿠 나리마시타^.`],
[`9월, @동탁@은 *신하*들을 모아놓고 @황제@를 바꾸겠다는 *결정*을 ^발표함^.`,`쿠가츠, @토-타쿠@와 *카신*타치오 아츠메, @코-테이@오 카에루토 이우 *케테이*오 ^핫표-시마시타^.`],
[`다들 *숨*죽이는 *분위기*에서 @원소@만 ^대들었다가^ 동쪽으로 도망침.`,`민나가 *이키*오 히소메루 *훈이키*노 나카, @엔쇼-@다케가 ^탓테츠키^, 히가시에 니게마시타.`],
[`그렇게 열네 살 @황제@는 *자리*에서 끌려 내려오고, 아홉 살 *동생*이 새 황제 @헌제@가 ^됨^.`,`코-시테 쥬-욘사이노 @코-테이@와 *쿠라이*카라 히키즈리오로사레, 큐-사이노 *오토-토*가 아타라시이 코-테이 @켄테이@니 ^나리마시타^.`],
[`쫓겨난 *형*은 이듬해 @동탁@이 보낸 *독*을 받고 ^죽음^.`,`오이다사레타 *아니*와 요쿠넨, @토-타쿠@가 오쿳타 *도쿠*데 ^나쿠나리마시타^.`],
[`황제 구하러 온 *놈*이 황제를 ^갈아치우고^, 결국 *나라*의 주인이 됨.`,`코-테이오 스쿠이니 키타 *오토코*가 코-테이오 ^스게카에^, 켓쿄쿠 *쿠니*노 아루지니 나리마시타.`],
[`이때 *겉*으로는 @동탁@에게 ^고개 숙이고^ 남은 *남자* @조조@가 있었음.`,`코노 토키, *오모테*데와 @토-타쿠@니 ^아타마오 사게테^ 노콧타 *오토코*, @소-소-@가 이마시타.`]
],
an:`여포`,a:[
[`@여포@는 *실력*은 당대 최고급이었는데, 자기를 쓰던 *상사*를 ^죽이고^ 옮김.`,`@료후@와 *지츠료쿠*와 토-지 사이코-큐-데시타가, 지분오 츠캇테 이타 *죠-시*오 ^코로시테^ 우츠리마시타.`],
[`당장은 +똑똑한+ *이직* 같아도, 이후 아무도 그를 완전히 믿지 못하는 *결과*가 됨.`,`스구니와 +카시코이+ *텐쇼쿠*니 미에테모, 소노 아토 다레모 카레오 칸젠니와 신지라레나이 *켓카*니 나리마시타.`],
[`*신뢰*는 한 번 팔면 다시는 ^못 사는^ *물건*임.`,`*신라이*와 이치도 우루토 니도토 ^카에나이^ *모노*데스.`]
],
w:[
[`*숫자*가 부족할 땐 사람들이 ^보는^ *장면*부터 장악해야 함.`,`*카즈*가 타리나이 토키와 히토비토가 ^미루^ *바멘*카라 오사에루 히츠요-가 아리마스.`],
[`근데 허세로 얻은 *권력*은 그만큼 +빠르게+ *적*을 만듦.`,`데모 핫타리데 에타 *켄료쿠*와 소노 붕 +하야쿠+ *테키*오 츠쿠리마스.`]
],
m:[`하진의 머리를 담장 밖으로 던지는 장면은 연의 각색임.`,`여포가 정원을 죽이고 동탁에게 간 건 정사에 있음. 적토마를 선물로 주며 꼬드기는 장면은 연의 각색임.`,`밤에 군사를 빼냈다가 낮에 다시 들이는 허세 작전, 진류왕이 또박또박 답한 일화는 정사 주석에 전함.`,`조조는 정사에선 동탁의 관직 제의를 거절하고 곧 도망침. 동탁 밑에 남는 건 연의 설정임.`],
nx:[`칼을 품고 @동탁@의 *침실*에 들어간 @조조@, 근데 *거울*에 그 모습이 ^비쳐버림^.`,`카타나오 후토코로니 @토-타쿠@노 *신시츠*니 하잇타 @소-소-@데스가, *카가미*니 소노 스가타가 ^우츳테 시마이마스^.`]
},
{t:`"내가 남을 배신할지언정" — 조조 흑화의 밤`,y:`서기 189~190년`,prev:`동탁이 여포를 빼 오고 황제까지 갈아치우며 낙양을 장악함.`,
s:[
[`소설에서 @조조@는 @동탁@을 죽이려고 보검 하나를 *품*에 숨기고 그의 *방*으로 ^찾아감^.`,`쇼-세츠데와 @소-소-@와 @토-타쿠@오 코로소-토 메-켄오 *후토코로*니 카쿠시, 카레노 *헤야*에 ^타즈네마시타^.`],
[`@동탁@이 *침대*에 누워 *등*을 돌린 순간, @조조@가 칼을 ^뽑음^.`,`@토-타쿠@가 *신다이*니 요코니 낫테 *세나카*오 무케타 슌칸, @소-소-@와 카타나오 ^누키마시타^.`],
[`근데 *벽*에 걸린 *거울*에 그 모습이 다 ^비쳐버림^.`,`데모 *카베*노 *카가미*니 소노 스가타가 젠부 ^우츳테 시마이마시타^.`],
[`@동탁@이 "뭐 하냐?" 하고 돌아보자, @조조@는 무릎 꿇고 "*선물*로 이 *칼*을 바치러 왔습니다"라고 ^둘러댐^.`,`@토-타쿠@가 "나니오 시테 이루?" 토 후리무쿠토, @소-소-@와 히자마즈이테 "*오쿠리모노*니 코노 *카타나*오 켄죠- 시니 마이리마시타" 토 ^고마카시마시타^.`],
[`0.5초 만에 *암살*을 *선물*로 바꾼 +미친+ 순발력임ㅋㅋ`,`레-텐고뵤-데 *안사츠*오 *오쿠리모노*니 카에타, +토테츠모나이+ 슌파츠료쿠데스.`],
[`그 *길*로 @조조@는 *말*을 빌려 타고 수도를 ^탈출함^.`,`소노 *아시*데 @소-소-@와 *우마*오 카리테 미야코오 ^닷슈츠시마시타^.`],
[`곧 *전국*에 @조조@ 체포 *명령*이 ^떨어짐^.`,`스구니 *젠코쿠*니 @소-소-@노 타이호 *메-레-*가 ^쿠다리마시타^.`],
[`도망치던 @조조@는 한 시골 *관문*에서 결국 *경비병*한테 ^붙잡힘^.`,`니게테 이타 @소-소-@와 아루 이나카노 *세키쇼*데 켓쿄쿠 *케이비헤이*니 ^츠카마리마시타^.`],
[`그런데 그 고을 *책임자* @진궁@이 *밤*에 몰래 찾아와 ^물어봄^ — "왜 @동탁@을 죽이려 했소?"`,`토코로가 소노 마치노 *세키닌샤* @친큐-@가 *요루* 콧소리 얏테 키테 ^타즈네마시타^ — "나제 @토-타쿠@오 코로소-토 시타노데스카?"`],
[`@조조@가 *나라*를 구하겠다는 *뜻*을 ^털어놓자^, @진궁@은 감동해서 관직을 버리고 따라나섬.`,`@소-소-@가 *쿠니*오 스쿠우토 이우 *코코로자시*오 ^우치아케루토^, @친큐-@와 칸도-시테 칸쇼쿠오 스테, 츠이테 이키마시타.`],
[`둘은 *도망* 중에 @조조@ *아버지*의 오랜 *친구* @여백사@의 집에 ^묵게 됨^.`,`후타리와 *토-보-*츄-, @소-소-@노 *치치*노 후루이 *토모* @료하쿠샤@노 이에니 ^토마루 코토니 나리마시타^.`],
[`@여백사@는 *술*을 사 오겠다며 나갔고, 집 안쪽에서 *칼* 가는 *소리*가 ^들려옴^.`,`@료하쿠샤@와 *사케*오 카이니 이쿠토 잇테 데카케, 이에노 오쿠카라 *하모노*오 토구 *오토*가 ^키코에테 키마시타^.`],
[`"묶어서 죽이자"라는 *말*까지 들리자, @조조@는 자기 *목숨*을 노린다고 ^확신함^.`,`"시밧테 코로소-" 토 이우 *코에*마데 키코에, @소-소-@와 지분노 *이노치*가 네라와레테 이루토 ^카쿠신시마시타^.`],
[`@조조@는 칼을 뽑아 *집안* *사람*들을 모조리 ^베어버림^.`,`@소-소-@와 카타나오 누키, *이에*노 *히토*비토오 노코라즈 ^키리스테마시타^.`],
[`그런데 *부엌*에 가보니, 묶여 있던 건 *손님* 대접하려던 *돼지*였음.`,`토코로가 *다이도코로*니 이쿠토, 시바라레테 이타노와 *오캬쿠*오 모테나스 타메노 *부타*데시타.`],
[`단순한 *착각*이 +끔찍한+ *결과*를 낳은 거임.`,`탄준나 *칸치가이*가 +오소로시이+ *켓카*오 운다노데스.`],
[`둘은 서둘러 도망치다가, *술*을 들고 돌아오던 @여백사@와 *길*에서 ^마주침^.`,`후타리와 이소이데 니게루 토츄-, *사케*오 못테 카엣테 쿠루 @료하쿠샤@토 *미치*데 ^뎃쿠와시마시타^.`],
[`@조조@는 잠깐 ^망설이더니^, 뒷*일*이 *걱정*돼서 @여백사@까지 벰.`,`@소-소-@와 스코시 ^타메랏타^ 아토, 아토노 *코토*가 *심파이*데 @료하쿠샤@마데 키리마시타.`],
[`기겁한 @진궁@이 *이유*를 따지자 @조조@가 ^대답함^ — "내가 *남*을 배신할지언정, 남이 나를 배신하게 두진 않겠다."`,`교-텐시타 @친큐-@가 *리유-*오 토-토 @소-소-@와 ^코타에마시타^ — "와타시가 *히토*오 우라깃테모, 히토니 와타시오 우라기라세와 시나이."`],
[`그날 *밤* @진궁@은 *마음*을 접고, 잠든 @조조@를 두고 +조용히+ 떠남.`,`소노 *요루* @친큐-@와 *키모치*가 사메, 네뭇타 @소-소-@오 오이테 +시즈카니+ 사리마시타.`],
[`*고향* 쪽으로 돌아간 @조조@는 *부자*의 *후원*을 받아 군사를 ^모음^.`,`*코쿄-*노 호-에 모돗타 @소-소-@와 *카네모치*노 *엔죠*오 우케테 헤이오 ^아츠메마시타^.`],
[`그리고 전국 *영웅*들에게 "@동탁@을 치자"는 *편지*를 ^돌림^.`,`소시테 젠코쿠노 *에-유-*타치니 "@토-타쿠@오 우토-" 토 이우 *테가미*오 ^마와시마시타^.`],
[`190년, @원소@를 *대표*로 하는 반동탁 *연합군*이 ^결성됨^.`,`햐쿠큐-쥬-넨, @엔쇼-@오 *다이효-*토 스루 한토-타쿠노 *렌고-군*가 ^켓세이사레마시타^.`],
[`이 *자리*엔 훗날 @오나라@의 *기초*를 놓는 장수 @손견@도, 소설에선 @유비@ 삼형제도 ^끼어 있었음^.`,`코노 *바*니와 노치니 @고@노 *키소*오 키즈쿠 쇼- @손켄@모, 쇼-세츠데와 @류-비@ 산쿄-다이모 ^쿠와왓테 이마시타^.`],
[`같은 *편*이 된 영웅들, 근데 다들 *속*으로는 딴 *계산*을 ^하고 있었음^.`,`*미카타*도-시니 낫타 에-유-타치데스가, 민나 *하라*노 나카데와 베츠노 *케이산*오 ^시테 이마시타^.`]
],
an:`조조`,a:[
[`@조조@는 +위험한+ *순간*마다 가장 빠른 *판단*을 내림.`,`@소-소-@와 +키켄나+ *슌칸*고토니 못토모 하야이 *한단*오 쿠다시마시타.`],
[`근데 같은 *속도*가 한 번은 *목숨*을 ^살렸고^, 한 번은 죄 없는 가족을 죽였음.`,`데모 오나지 *스피-도*가 이치도와 *이노치*오 ^스쿠이^, 이치도와 츠미노 나이 카조쿠오 코로시마시타.`],
[`@조조@는 *실수*보다 남에게 당하는 *상황*을 훨씬 더 ^두려워했음^.`,`@소-소-@와 *싯파이*요리 히토니 야라레루 *죠-쿄-*오 즛토 ^오소레테 이마시타^.`]
],
w:[
[`+급한+ *결정*일수록 마지막 1*분*만 더 ^확인해야^ 함.`,`+이소기노+ *케츠단*호도 사이고노 입*푼*다케 ^카쿠닌스루^ 히츠요-가 아리마스.`],
[`@조조@가 *부엌*만 먼저 봤어도 @진궁@이라는 *인재*를 ^잃지^ 않았을 거임.`,`@소-소-@가 사키니 *다이도코로*다케 미테 이레바, @친큐-@토 이우 *진자이*오 ^우시나와나캇타^ 데쇼-.`]
],
m:[`거울에 들킨 암살 미수는 연의 창작임. 정사의 조조는 동탁의 관직 제의를 거절하고 동쪽으로 도망침.`,`도망 중 붙잡혔다 풀려난 건 정사에도 있지만, 풀어준 사람은 진궁이 아니라 그를 알아본 이름 없는 관리임.`,`여백사 사건은 정사 주석마다 이야기가 다름. 《위서》는 여백사 쪽이 먼저 조조를 해치려 했다고 쓰고, 손성의 《잡기》에 "차라리 내가 남을 저버릴지언정" 발언이 나옴. 연의는 이걸 "천하 사람이 나를 저버리게 두진 않겠다"로 키움.`,`유비 삼형제의 연합군 참가는 연의 설정임.`],
nx:[`연합군 *장수*들이 적장 @화웅@ 한 명한테 줄줄이 당하는데, 이름 없는 *부하* 하나가 *손*을 ^듦^.`,`렌고-군노 *쇼-*타치가 테키쇼- @카유-@ 히토리니 츠기츠기토 야라레루 나카, 무메이노 *부카*가 히토리 *테*오 ^아게마스^.`]
},
{t:`술이 식기 전에 돌아온 남자`,y:`서기 190~191년`,prev:`조조가 동탁 암살에 실패하고 도망치다 여백사 일가를 벰. 원소를 대표로 반동탁 연합군이 결성됨.`,
s:[
[`연합군 *진영*에 매일 나쁜 *소식*이 ^날아듦^.`,`렌고-군노 *진에이*니 마이니치 와루이 *시라세*가 ^토도키마시타^.`],
[`@동탁@ 쪽 *장수* @화웅@이 연합군 *장군*들을 줄줄이 ^베고^ 있었던 거임.`,`@토-타쿠@가와노 *쇼-*노 @카유-@가 렌고-군노 *쇼-군*타치오 츠기츠기토 ^킷테^ 이타노데스.`],
[`*회의장*이 얼어붙은 *순간*, @관우@가 ^나섬^ — "제가 저 자의 목을 가져오겠습니다."`,`*카이기바*가 코오리츠이타 *슌칸*, @칸우@가 ^나노리데마시타^ — "와타시가 아노 모노노 쿠비오 톳테 마이리마스."`],
[`근데 @원소@의 동생 @원술@이 *직급*을 따지며 ^비웃음^ — "말단 *부하* 따위가 어딜 감히?"`,`데모 @엔쇼-@노 오토-토 @엔쥬츠@가 *야쿠쇼쿠*오 타테니 ^아자와라이마시타^ — "타다노 *부카*가 나마이키나!"`],
[`그때 @조조@가 따뜻한 *술* 한 *잔*을 ^건네며^ 응원함.`,`소노 토키 @소-소-@가 아타타카이 *사케*오 *잇파이* ^사시다시^, 오-엔시마시타.`],
[`@관우@는 "*술*은 돌아와서 마시겠소" 하고 *말*을 타고 ^나감^.`,`@칸우@와 "*사케*와 모돗테 카라 이타다키마스" 토 잇테 *우마*니 놋테 ^데테 이키마시타^.`],
[`잠시 뒤 *북소리*가 멈추고, @관우@가 @화웅@의 *머리*를 들고 ^돌아옴^.`,`시바라쿠시테 *타이코노 오토*가 야미, @칸우@가 @카유-@노 *쿠비*오 못테 ^모돗테 키마시타^.`],
[`건네받은 *술*은 아직 +따뜻했음+ — 연의 최고의 *명장면* 중 하나임.`,`우케톳타 *사케*와 마다 +아타타카캇타+ 노데스 — 엔기데 사이코-노 *메-바멘*노 히토츠데스.`],
[`*직급*보다 *실력*이 판을 ^뒤집은^ 순간이었음.`,`*야쿠쇼쿠*요리 *지츠료쿠*가 바오 ^힛쿠리카에시타^ 슌칸데시타.`],
[`화가 난 @동탁@은 최강의 *카드* @여포@를 @호뢰관@이라는 *관문*에 ^보냄^.`,`오콧타 @토-타쿠@와 사이쿄-노 *카-도* @료후@오 @코로-칸@토 이우 *세키쇼*니 ^오쿠리마시타^.`],
[`@적토마@를 탄 @여포@ 앞에서 연합군 *장수*들은 *상대*도 ^안 됐음^.`,`@세키토바@니 놋타 @료후@노 마에데 렌고-군노 *쇼-*타치와 *아이테*니모 ^나리마센데시타^.`],
[`그때 @장비@가 *창*을 들고 ^뛰어들고^, 이어서 @관우@와 @유비@까지 *합류*함.`,`소노 토키 @쵸-히@가 *야리*오 못테 ^토비코미^, 츠즈이테 @칸우@토 @류-비@마데 *고-류-*시마시타.`],
[`세 *형제*가 한 *사람*을 둘러싸고 싸운 이 장면이 그 유명한 @삼영전여포@임.`,`산닌노 *쿄-다이*가 히토리노 *아이테*오 카콘데 타타캇타 코노 바멘가, 아노 유-메-나 @산에이센료후@데스.`],
[`결국 @여포@는 *말* 머리를 돌려 ^물러났고^, 세 형제의 *이름*이 연합군에 퍼짐.`,`켓쿄쿠 @료후@와 *우마*노 무키오 카에테 ^히키아게^, 산쿄-다이노 *나마에*가 렌고-군니 히로마리마시타.`],
[`*전세*가 불리해지자 @동탁@은 +황당한+ *결정*을 내림.`,`*센쿄-*가 후리니 나루토 @토-타쿠@와 +토호-모나이+ *케츠단*오 쿠다시마시타.`],
[`*수도*를 서쪽 @장안@으로 옮기고, @낙양@ *시내*에 불을 ^질러버린^ 거임.`,`*슈토*오 니시노 @쵸-안@니 우츠시, @라쿠요-@노 *시가이*니 히오 ^츠케테 시맛타^ 노데스.`],
[`수백만 *백성*이 강제로 *집*을 떠났고, 길 위에서 수많은 사람이 ^죽었음^.`,`스-햐쿠만노 *민슈-*가 무리야리 *이에*오 하나레, 미치노 우에데 오-쿠노 히토가 ^나쿠나리마시타^.`],
[`연합군은 이 *기회*에 쫓아갈 수 있었는데, 다들 *눈치*만 ^봤음^.`,`렌고-군와 코노 *키카이*니 오우 코토모 데키마시타가, 민나 *요-스*미바카리 ^시테 이마시타^.`],
[`혼자 추격한 @조조@는 크게 *패배*하고 겨우 *목숨*만 ^건짐^.`,`히토리데 오이카케타 @소-소-@와 오-키쿠 *하이보쿠*시, 얏토 *이노치*다케 ^타스카리마시타^.`],
[`한편 @손견@은 불탄 @낙양@의 *우물*에서 황제의 *도장*, @옥새@를 ^건져 올림^.`,`잇포- @손켄@와 야케타 @라쿠요-@노 *이도*카라 코-테이노 *한코*, @교쿠지@오 ^히키아게마시타^.`],
[`소설에서 @손견@은 그 *사실*을 숨기고 자기 *땅*으로 ^돌아감^.`,`쇼-세츠데와 @손켄@와 소노 *지지츠*오 카쿠시테 지분노 *료-치*에 ^카에리마시타^.`],
[`공동의 *적*이 멀리 떠나자, 연합군은 서로의 *땅*을 노리며 ^흩어짐^.`,`쿄-츠-노 *테키*가 토-쿠 사루토, 렌고-군와 오타가이노 *료-치*오 네라이나가라 ^바라바라니 나리마시타^.`],
[`같은 *목표*로 모였던 *사람*들이 이제 서로의 *경쟁자*가 ^됨^.`,`오나지 *모쿠효-*데 아츠맛타 *히토*비토가, 이마야 오타가이노 *라이바루*니 ^나리마시타^.`]

E[2]={t:`황제 구하러 온 용병이 황제를 갈아치움ㅋㅋ`,y:`서기 189년`,prev:`하진이 환관을 치려고 군벌 동탁을 수도로 부름. 조조의 반대는 묵살됨.`,
s:[
[`189년 8월, @하진@은 *경호*도 없이 혼자 *궁*에 갔다가 @환관@들한테 +허무하게+ ^살해당함^.`,`햐쿠하치쥬-큐-넨 하치가츠, @카신@와 *고에이*모 [츠케즈] [히토리]데 *큐-덴*니 [이키], @칸간@타치니 +아켓나쿠+ ^코로사레마시타^.`],
[`먼저 칠 *계획*을 세운 쪽이 *정보전*에서 지고 먼저 ^당한^ 거임.`,`[사키]니 [우츠] *케이카쿠*오 [탓테타] [호-]가 *죠-호-센*데 [마케], [사키]니 ^야라레타^노데스.`],
[`*소식*을 들은 @원소@는 +분노한+ 군사를 이끌고 궁궐로 ^쳐들어감^ — *보복*의 시작임.`,`*시라세*오 [키이타] @엔쇼-@와 +게키도시타+ [헤-]오 [히키이테] [큐-덴]니 ^세메코미마시타^ — *훗슈-*노 [하지마리]데스.`],
[`수염 없는 남자는 환관으로 *오인*해서 다 베었는데, *사망자*가 2천 명을 +훌쩍+ ^넘었음^.`,`[히게]노 [나이] [오토코]와 [칸간]토 *고닌*시테 [미나] [키리], *시보-샤*와 니센닌오 +유-니+ ^코에마시타^.`],
[`살아남은 환관 @장양@은 어린 @황제@와 동생 @진류왕@을 *인질*처럼 끌고 +허둥지둥+ *밤길*로 ^도망침^.`,`[이키노콧타] [칸간] @쵸-죠-@와 [오사나이] @코-테이@토 [오토-토] @친류-오-@오 *히토지치*노요-니 [츠레], +아타후타토+ *요미치*오 ^니게마시타^.`],
[`결국 *추격대*에 몰린 @장양@은 강에 몸을 던져 *최후*를 ^맞음^.`,`[켓쿄쿠] *츠이게키타이*니 [오이츠메라레타] @쵸-죠-@와 [카와]니 [미오] [나게], *사이고*오 ^토게마시타^.`],
[`밤새 헤매던 두 형제 앞에 +어마어마한+ *대군*이 ^나타났는데^, 그 *선두*에 @동탁@이 있었음.`,`[히토반쥬-] [사마욧테 이타] [쿄-다이]노 [마에]니 +토테츠모나이+ *다이군*가 ^아라와레^, [소노] *센토-*니 @토-타쿠@가 [이마시타].`],
[`겁먹은 @황제@는 *말*도 못 했는데, 아홉 살 @진류왕@은 *상황*을 +또박또박+ ^설명함^.`,`[오비에타] @코-테이@와 *코토바*모 [데마센데시타]가, [큐-사이]노 @친류-오-@와 *죠-쿄-*오 +하키하키토+ ^세츠메이시마시타^.`],
[`*기록*에 따르면 @동탁@은 이때부터 형보다 동생 쪽에 +은근히+ *점수*를 ^줬음^.`,`*키로쿠*니 [요루]토, @토-타쿠@와 [코노] [토키]카라 [아니]요리 [오토-토]노 [호-]니 +히소카니+ *텐스-*오 ^츠케마시타^.`],
[`근데 @낙양@에 ^들어온^ @동탁@ 군사는 3천 명 *규모*라, 수도를 쥐기엔 +턱없이+ *부족*했음.`,`[데모] @라쿠요-@니 ^하잇타^ @토-타쿠@노 [헤-]와 산젠닌 *키보*데, [미야코]오 [니기루]니와 +마루데+ *부소쿠*데시타.`],
[`그래서 *밤*마다 몰래 군사를 빼냈다가 낮에 다시 ^행진시키는^ +교묘한+ *연출*을 함.`,`[소코데] *요루*고토니 [콧소리] [헤-]오 [다시], [히루]니 [마타] ^코-신사세루^ +타쿠미나+ *엔슈츠*오 [시마시타].`],
[`사람들은 @동탁@ 병력이 끝없다고 ^착각함^ — 이게 *허세* *마케팅*의 +무서운+ 힘임ㅋㅋ`,`[히토비토]와 @토-타쿠@노 [헤-료쿠]가 [카기리나이]토 ^칸치가이시마시타^ — [코레]가 *핫타리* *마-케팅구*노 +오소로시이+ [치카라]데스.`],
[`다음 *타깃*은 수도 *경비*를 맡은 @정원@의 군대, 거기엔 +최강의+ 부하 @여포@가 ^버티고^ 있었음.`,`[츠기]노 *타-겟토*와 [미야코]노 *케-비*오 [탄토-스루] @테이겐@노 [군타이]데, [소코]니와 +사이쿄-노+ [부카] @료후@가 ^히카에테^ [이마시타].`],
[`@동탁@은 @여포@한테 *헤드헌팅* *오퍼*를 넣었고, 소설에선 명마 @적토마@까지 *사이닝 보너스*로 ^얹어줌^.`,`@토-타쿠@와 @료후@니 *헷도한팅구*노 *오화-*오 [다시], [쇼-세츠]데와 [메-바] @세키토바@마데 *사이닝구 보-나스*토시테 ^츠케마시타^.`],
[`그러자 @여포@는 자기 *상사* @정원@을 베고, *부대*째로 @동탁@ 쪽에 +냉정하게+ ^갈아탐^.`,`[스루토] @료후@와 [지분]노 *죠-시* @테이겐@오 [키리], *부타이*고토 @토-타쿠@[가와]니 +레-세-니+ ^노리카에마시타^.`],
[`전 직장 *사장*을 처리하고 *팀*까지 통째로 ^빼온^, +역대급+ 이직임.`,`[마에]노 [쇼쿠바]노 *샤쵸-*오 [쇼리]시, *치-무*마데 [마루고토] ^힛코누이타^, +젠다이미몬노+ [텐쇼쿠]데스.`],
[`이제 @낙양@에서 @동탁@을 견제할 *세력*도 *브레이크*도 +완전히+ ^사라짐^.`,`[코레데] @라쿠요-@니 @토-타쿠@오 [켄세-데키루] *세료쿠*모 *브레-키*모 +칸젠니+ ^나쿠나리마시타^.`],
[`9월, @동탁@은 신하들을 *이사회*처럼 모아놓고 @황제@를 바꾸겠다는 *안건*을 +일방적으로+ ^통보함^.`,`[쿠가츠], @토-타쿠@와 [카신]타치오 *토리시마리야쿠카이*노요-니 [아츠메], @코-테이@오 [카에루]토 [이우] *안켄*오 +잇포-테키니+ ^츠-치시마시타^.`],
[`다들 *눈치*만 보는데 @원소@만 +정면으로+ ^대들었다가^, 결국 *사표* 던지고 동쪽으로 떠남.`,`[민나]가 *요-스*바카리 [미루] [나카], @엔쇼-@다케가 +쇼-멘카라+ ^탓테츠키^, [켓쿄쿠] *지효-*오 [타타키츠케테] [히가시]에 [사리마시타].`],
[`그렇게 열네 살 @황제@는 끌려 내려오고 아홉 살 동생 @헌제@로 ^교체됨^ — +황당한+ *코네* 인사 *시즌 2*임.`,`[코-시테] [쥬-욘사이]노 @코-테이@와 [히키즈리오로사레], [큐-사이]노 [오토-토] @켄테이@니 ^코-타이사레마시타^ — +토호-모나이+ *코네* [진지]노 *다이니단*데스.`],
[`쫓겨난 형은 이듬해 @동탁@이 보낸 *독*을 받고 +비참하게+ *생*을 ^마감함^.`,`[오이다사레타] [아니]와 [요쿠넨], @토-타쿠@가 [오쿳타] *도쿠*데 +미지메니+ *쇼-가이*오 ^토지마시타^.`],
[`황제 구하러 온 *용병*이 황제를 갈아치우고 *오너* 자리에 +뻔뻔하게+ ^앉아버림^.`,`[코-테이]오 [스쿠이]니 [키타] *요-헤-*가 [코-테이]오 [스게카에], *오-나-*노 [자]니 +즈-즈-시쿠+ ^스왓테 시마이마시타^.`],
[`이때 겉으로는 고개 숙이고 *속*으로 칼을 가는 *남자* @조조@가 +조용히+ ^기회를 엿보고^ 있었음.`,`[코노] [토키], [오모테]데와 [아타마]오 [사게], *하라*노 [나카]데 [키바]오 [토구] *오토코* @소-소-@가 +시즈카니+ ^키카이오 우카갓테^ [이마시타].`]
],
an:`여포`,a:[
[`@여포@는 *실력*은 업계 최고였지만, 더 좋은 *조건*이 오면 +망설임 없이+ ^옮겼음^.`,`@료후@와 *지츠료쿠*와 [교-카이] [사이코-]데시타가, [요리] [이이] *죠-켄*가 [쿠레바] +타메라이나쿠+ ^우츠리마시타^.`],
[`당장은 +똑똑한+ *선택* 같아도, 이런 *이력*이 쌓이면 아무도 그를 ^믿지^ 않게 됨.`,`[스구]니와 +카시코이+ *센타쿠*니 [미에테모], [코-이우] *리레키*가 [츠모루]토 [다레]모 [카레]오 ^신지나쿠^ [나리마스].`],
[`*신뢰*는 한 번 팔면 다시는 못 사는 +유일한+ *자산*임.`,`*신라이*와 [이치도] [우루]토 [니도토] [카에나이] +유이이츠노+ *시산*데스.`]
],
w:[
[`*숫자*가 부족할 땐 사람들이 ^보는^ *장면*부터 +확실하게+ 장악해야 함.`,`*스-지*가 [타리나이] [토키]와 [히토비토]가 ^미루^ *바멘*카라 +싯카리토+ [오사에루] [히츠요-]가 [아리마스].`],
[`근데 *허세*로 얻은 *권력*은 그만큼 +빠르게+ 적을 ^만듦^.`,`[데모] *핫타리*데 [에타] *켄료쿠*와 [소노] [붕] +하야쿠+ [테키]오 ^츠쿠리마스^.`]
],
m:[`하진의 머리를 담장 밖으로 던지는 장면은 연의 각색임.`,`여포가 정원을 죽이고 동탁에게 간 건 정사에 있음. 적토마를 선물로 주며 꼬드기는 장면은 연의 각색임.`,`밤에 군사를 빼냈다가 낮에 다시 들이는 허세 작전, 진류왕이 또박또박 답한 일화는 정사 주석에 전함.`,`조조는 정사에선 동탁의 관직 제의를 거절하고 곧 도망침. 동탁 밑에 남는 건 연의 설정임.`],
nx:[`칼을 품고 @동탁@의 *침실*에 들어간 @조조@, 근데 벽 *거울*에 그 모습이 +고스란히+ ^비쳐버림^.`,`[카타나]오 [후토코로]니 @토-타쿠@노 *신시츠*니 [하잇타] @소-소-@데스가, [카베]노 *카가미*니 [소노] [스가타]가 +쿳키리토+ ^우츳테 시마이마스^.`]
};
E[3]={t:`"내가 남을 배신할지언정" — 조조 흑화의 밤`,y:`서기 189~190년`,prev:`동탁이 여포를 빼 오고 황제까지 갈아치우며 낙양을 장악함.`,
s:[
[`소설에서 @조조@는 @동탁@을 제거하려고 *보검*을 품에 숨긴 채 +태연하게+ *집무실*로 ^찾아감^.`,`[쇼-세츠]데와 @소-소-@와 @토-타쿠@오 [하이죠스루] [타메] *메-켄*오 [후토코로]니 [카쿠시], +헤-젠토+ *시츠무시츠*에 ^타즈네마시타^.`],
[`@동탁@이 침대에 누워 *등*을 돌린 *순간*, @조조@가 +조용히+ 칼을 ^뽑음^.`,`@토-타쿠@가 [신다이]니 [요코]니 [낫테] *세나카*오 [무케타] *슌칸*, @소-소-@와 +시즈카니+ [카타나]오 ^누키마시타^.`],
[`근데 벽에 걸린 *거울*에 그 *장면*이 +생중계로+ ^비쳐버림^ㅋㅋ`,`[데모] [카베]노 *카가미*니 [소노] *바멘*가 +나마츄-케-데+ ^우츳테 시마이마시타^.`],
[`@동탁@이 "뭐 하냐?" 하고 돌아보자, @조조@는 무릎 꿇고 "*선물*로 이 *명검*을 바치러 왔습니다"라고 +천연덕스럽게+ ^둘러댐^.`,`@토-타쿠@가 "[나니]오 [시테 이루]?" 토 [후리무쿠]토, @소-소-@와 [히자마즈이테] "*오쿠리모노*니 [코노] *메-켄*오 [켄죠-] [시니] [마이리마시타]" 토 +시렛토+ ^고마카시마시타^.`],
[`0.5초 만에 *암살*을 *프레젠테이션*으로 바꾼 +미친+ *애드리브*임ㅋㅋ`,`레-텐고뵤-데 *안사츠*오 *프레젠*니 [카에타] +토테츠모나이+ *아도리부*데스.`],

[`*본사*를 서쪽 @장안@으로 옮기고, @낙양@ *시내*에 불을 ^질러버린^ 거임 — +최악의+ *구조조정*임.`,`*혼샤*오 [니시]노 @쵸-안@니 [우츠시], @라쿠요-@노 *시가이*니 [히]오 ^츠케테 시맛타^노데스 — +사이아쿠노+ *리스토라*데스.`],

[`연합군은 이 *기회*에 쫓아갈 수 있었는데, 다들 *눈치*만 보며 +미적미적+ ^버팀^.`,`[렌고-군]와 [코노] *키카이*니 [오우] [코토]모 [데키마시타]가, [민나] *요-스*[미]바카리데 +구즈구즈토+ ^이스와리마시타^.`],

[`한편 @손견@은 불탄 @낙양@의 *우물*에서 황제의 *도장* @옥새@를 +우연히+ ^건져 올림^.`,`[잇포-] @손켄@와 [야케타] @라쿠요-@노 *이도*카라 [코-테이]노 *한코* @교쿠지@오 +구-젠니+ ^히키아게마시타^.`],

m:[`정사에서 화웅을 벤 건 관우가 아니라 손견임. "술이 식기 전" 장면은 연의 창작임.`,`삼영전여포(유비·관우·장비가 여포와 싸운 장면)도 연의 창작임. 정사에서 유비 삼형제는 연합군에 없었음.`,`동탁의 장안 천도와 낙양 방화(190년), 수백만 명 강제 이주는 정사 기록임. 조조가 혼자 추격했다가 형양에서 크게 진 것도 정사에 있음.`,`손견이 낙양 우물에서 옥새를 얻은 이야기는 정사 주석(《오서》)에 나옴. 숨기고 돌아갔다는 부분은 연의 쪽 각색이 강함.`],

[`이걸 보며 *분노*를 ^삼키던^ *원로* *임원*이 하나 있었으니, 대신 @왕윤@이었음.`,`[코레]오 [미테] *이카리*오 ^코라에테 이타^ *쵸-로-* *야쿠인*가 [히토리] [이테], [다이진]노 @오-인@데시타.`],

[`"@여포@는 어디 있느냐!" 하고 +다급하게+ ^외친^ @동탁@ 앞에 나타난 건, 바로 그 *경호실장*의 *창*이었음.`,`"@료후@와 [도코]다!" 토 +아와테테+ ^사켄다^ @토-타쿠@노 [마에]니 [아라와레타] [노]와, [마사니] [소노] *고에이 쵸-*노 *야리*데시타.`],

s:[
[`193년, @서주@를 지나던 @조조@ 아버지 일행이 +잔인하게+ ^살해당함^ — 범인은 @서주@ *책임자* @도겸@ 쪽 *부하*였음.`,`햐쿠큐-쥬-산넨, @조슈-@오 [토-루] @소-소-@노 [치치]노 [잇코-]가 +잔코쿠니+ ^코로사레마시타^ — [한닌]와 @조슈-@노 *세키닌샤* @토-켄@[가와]노 *부카*데시타.`],
[`분노한 @조조@는 *복수*를 명분으로 @서주@에 쳐들어가 +처참한+ *학살*을 ^벌임^.`,`[게키도시타] @소-소-@와 *훗슈-*오 [메-모쿠]니 @조슈-@에 [세메코미], +산산타루+ *갸쿠사츠*오 ^오코나이마시타^.`],
[`강물이 시체로 ^막혀^ 흐르지 않았다는 *기록*까지 있음 — @조조@ *커리어*의 +가장 어두운+ *흑역사*임.`,`[카와]가 [시타이]데 ^세키토메라레^ [나가레나캇타]토 [이우] *키로쿠*마데 [아리마스] — @소-소-@노 *캬리아*노 +못토모 쿠라이+ *쿠로레키시*데스.`],
[`위기에 몰린 @도겸@이 +다급하게+ *구조 요청*을 보내자, @유비@가 *소수 병력*으로 ^달려감^.`,`[키키]니 [오치잇타] @토-켄@가 +아와테테+ *큐-엔 요-세-*오 [오쿠루]토, @류-비@가 *쇼-스-노 헤-*데 ^카케츠케마시타^.`],
[`남들은 다 *손익*을 계산할 때 @유비@만 +계산 없이+ ^달려간^ *그림*이었음.`,`[호카]노 [히토]와 [민나] *손에키*오 [케-산시테 이타]노니 @류-비@다케가 +손토쿠 누키데+ ^카케츠케타^ *즈*데시타.`],
[`마침 그때 @조조@의 *본진*에서 +충격적인+ *속보*가 ^날아옴^.`,`[춋도] [소노] [토키], @소-소-@노 *혼진*카라 +쇼-게키테키나+ *솟호-*가 ^토도키마시타^.`],
[`@조조@가 자리를 비운 틈에 @진궁@이 @여포@를 *새 사장*으로 모셔 와 @연주@에서 *쿠데타*를 +몰래+ ^일으킨^ 거임.`,`@소-소-@가 [루스]니 [시타] [스키]니 @친큐-@가 @료후@오 *신샤쵸-*토시테 [무카에], @엔슈-@데 *쿠-데타-*오 +콧소리+ ^오코시타^노데스.`],
[`4화에서 @조조@의 *본색*을 보고 떠났던 그 @진궁@이 +제대로+ *복수*를 ^한^ 셈임ㅋㅋ`,`[욘와]데 @소-소-@노 *혼쇼-*오 [미테] [삿타] [아노] @친큐-@가 +싯카리토+ *훗슈-*오 ^하타시타^ [와케]데스.`],
[`@연주@ 대부분이 하룻밤에 *반란군* 쪽으로 ^넘어가고^, 남은 *거점*은 +겨우+ 세 곳뿐이었음.`,`@엔슈-@노 [호톤도]가 [히토반]데 *한란군*[가와]니 ^네가에리^, [노콧타] *쿄텐*와 +와즈카+ [밋츠]다케데시타.`],
[`그 세 곳을 +끝까지+ 지켜낸 게 @순욱@과 @정욱@ — *브레인*들이 *회사*를 ^살린^ 거임.`,`[소노] [밋츠]오 +사이고마데+ [마모리누이타] [노]가 @쥰이쿠@토 @테-이쿠@데 — *브레인*타치가 *카이샤*오 ^스쿳타^노데스.`],
[`@조조@는 급히 *회군*해 @여포@와 1년 넘게 +피 말리는+ *소모전*을 ^벌임^.`,`@소-소-@와 [이소이데] *히키카에시*, @료후@토 [이치넨] [이죠-] +치노 니지무요-나+ *쇼-모-센*오 ^쿠리히로게마시타^.`],
[`메뚜기 *떼*까지 덮쳐 *식량*이 바닥나자 양쪽 다 +어쩔 수 없이+ ^휴전함^.`,`[이나고]노 *무레*마데 [오소이] *쇼쿠료-*가 [소코오 츠쿠]토, [료-호-]토모 +야무오 에즈+ ^큐-센시마시타^.`],
[`그 사이 @서주@에선 @도겸@이 병으로 죽기 직전, @유비@에게 *회사*를 넘기겠다는 +파격적인+ *유언*을 ^남김^.`,`[소노] [아이다] @조슈-@데와 @토-켄@가 [뵤-키]데 [시누] [슨젠], @류-비@니 *카이샤*오 [유즈루]토 [이우] +하카쿠노+ *유이곤*오 ^노코시마시타^.`],
[`@유비@는 +몇 번이나+ *사양*하다가 결국 @서주@를 ^물려받음^ — 공짜로 *상장사*를 받은 셈임.`,`@류-비@와 +난도모+ *지타이*시타 [스에], [켓쿄쿠] @조슈-@오 ^히키츠기마시타^ — [타다]데 *죠-죠-가이샤*오 [모랏타] [요-나] [모노]데스.`],
[`짚신 팔던 *무명*이 드디어 큰 *영토*의 오너가 ^된^ +감격적인+ 순간임.`,`[와라지]오 [웃테 이타] *무메-*가 [츠이니] [오-키나] *료-치*노 [오-나-]니 ^낫타^ +칸게키테키나+ [슌칸]데스.`],
[`근데 *자리*가 커지면 *적*도 커지는 법 — @서주@는 사방이 +노리는+ 땅이었음.`,`[데모] *포스토*가 [오-키쿠] [나레바] *테키*모 [오-키쿠] [나루] [모노] — @조슈-@와 [시호-]카라 +네라와레루+ [토치]데시타.`],
[`195년, @조조@는 결국 @여포@를 몰아내고 @연주@ *본사*의 *경영권*을 +완벽하게+ ^탈환함^.`,`햐쿠큐-쥬-고넨, @소-소-@와 [츠이니] @료후@오 [오이다시], @엔슈-@노 *혼샤*노 *케-에-켄*오 +칸페키니+ ^닷칸시마시타^.`],
[`*갈 곳* 잃은 @여포@와 @진궁@은 +뻔뻔하게도+ @유비@에게 *피난처*를 구하러 ^찾아옴^.`,`*이키바*오 [나쿠시타] @료후@토 @친큐-@와 +즈-즈-시쿠모+ @류-비@노 [모토]니 *히난사키*오 [모토메테] ^얏테 키마시타^.`],
[`@유비@는 +사람 좋게+ 받아줬는데, 이 *결정*이 훗날 *뒤통수*로 ^돌아옴^.`,`@류-비@와 +오히토요시니모+ [우케이레마시타]가, [코노] *케츠단*가 [노치]니 *우라기리*토 [낫테] ^카엣테 키마스^.`]
],
an:`유비`,a:[
[`@유비@는 *손익*보다 *의리*를 먼저 ^보여줬고^, 그게 +결정적인+ *신용*이 됨.`,`@류-비@와 *손에키*요리 *기리*오 [사키]니 ^미세^, [소레]가 +케츠테-테키나+ *신요-*니 [나리마시타].`],
[`하지만 아무나 ^받아주는^ *착함*은 +치명적인+ *보안 구멍*이 되기도 함.`,`[시카시] [다레데모] ^우케이레루^ *야사시사*와 +치메이테키나+ *세큐리티 호-루*니모 [나리마스].`]
],
w:[
[`*평판*은 계산 없이 쌓은 *신뢰*에서 오고, 그건 +결정적인+ 순간에 *현금*처럼 ^쓰임^.`,`*효-반*와 [케-산] [누키]데 [츤다] *신라이*카라 [우마레], [소레]와 +케츠테-테키나+ [슌칸]니 *겐킨*노요-니 ^츠카에마스^.`],
[`*본사*를 비울 땐 반드시 +믿을 만한+ *책임자*를 ^세워야^ 함 — @조조@는 @순욱@ 덕에 살았음.`,`*혼샤*오 [아케루] [토키]와 [카나라즈] +신라이데키루+ *세키닌샤*오 ^오카나케레바^ [나리마센] — @소-소-@와 @쥰이쿠@노 [오카게]데 [타스카리마시타].`]
],
m:[`조조 아버지 조숭을 죽인 주체는 기록마다 다름(도겸이 보낸 군사라는 설, 도겸 부하 장개가 재물을 노렸다는 설 등).`,`서주 학살과 "사수가 시체로 막혀 흐르지 않았다"는 서술은 정사 도겸전에 있음.`,`진궁·장막이 여포를 맞아 연주에서 반란(194), 순욱·정욱이 세 성을 지킨 일, 메뚜기 피해로 인한 휴전은 정사임. 도겸 사후 유비의 서주 승계(194)도 정사이며, 연의는 유비의 세 번 사양을 강조함.`],
nx:[`@유비@가 *출장*을 간 사이, 술 취한 @장비@의 *실수*로 @서주@가 통째로 ^털림^ — 범인은 +당연히+ 그 *손님*임.`,`@류-비@가 *슛쵸-*니 [데테 이루] [아이다], [욧파랏타] @쵸-히@노 *미스*데 @조슈-@가 [마루고토] ^우바와레마스^ — [한닌]와 +모치론+ [아노] *오캬쿠*데스.`]
};
E[8]={t:`손님이 집주인 내쫓음 + 조조의 '황제 IP' 독점 계약`,y:`서기 196년`,prev:`조조가 연주를 되찾았고, 유비는 도겸에게 서주를 물려받았음. 갈 곳 잃은 여포가 유비에게 의탁함.`,
s:[
[`196년, @원술@이 @서주@를 노리고 쳐들어오자 @유비@는 *본거지*를 비우고 +급하게+ *원정*을 ^떠남^.`,`햐쿠큐-쥬-로쿠넨, @엔쥬츠@가 @조슈-@오 [네랏테] [세메테] [쿠루]토, @류-비@와 *혼쿄치*오 [아케테] +이소이데+ *엔세-*니 ^데카케마시타^.`],
[`*본거지* @하비@의 *관리*는 @장비@한테 ^맡겼는데^ — 이게 +치명적인+ *인사 실수*였음.`,`*혼쿄치* @카히@노 *칸리*와 @쵸-히@니 ^마카세마시타가^ — [코레]가 +치메-테키나+ *진지 미스*데시타.`],
[`@장비@는 현지 *간부*와 ^충돌했고^, 그 *갈등*이 +순식간에+ 커짐.`,`@쵸-히@와 [겐치]노 *칸부*토 ^쇼-토츠시^, [소노] *아츠레키*가 +앗토이우마니+ [오-키쿠] [나리마시타].`],
[`궁지에 몰린 쪽이 몰래 @여포@에게 *성문*을 열어주겠다고 ^내통함^ — +전형적인+ 내부자 *유출*임.`,`[오이츠메라레타] [가와]가 [콧소리] @료후@니 *죠-몬*오 [아케루]토 ^나이츠-시마시타^ — +텐케-테키나+ [나이부샤]노 *류-슈츠*데스.`],
[`@여포@는 그날 밤 +손쉽게+ @하비@를 점령하고 @유비@의 *가족*까지 *인질*로 ^잡음^.`,`@료후@와 [소노] [요루] +앗사리+ @카히@오 [센료-시], @류-비@노 *카조쿠*마데 *히토지치*니 ^토리마시타^.`],
[`손님으로 받아준 놈이 *집주인*을 내쫓고 *명의*까지 ^가로챈^ 거임 — +레전드급+ *배신*ㅋㅋ`,`[캬쿠]토시테 [무카에타] [오토코]가 *야누시*오 [오이다시], *메-기*마데 ^요코도리시타^노데스 — +덴세츠큐-노+ *우라기리*데스.`],
[`돌아갈 곳을 잃은 @유비@는 +굴욕적이게도+ @여포@ 밑에서 작은 *성*을 받는 *하청* 신세가 ^됨^.`,`[모도루] [바쇼]오 [우시낫타] @류-비@와 +쿠츠조쿠테키니모+ @료후@노 [모토]데 [치이사나] *시로*오 [모라우] *시타우케*노 [미]니 ^나리마시타^.`],
[`같은 해, 다른 쪽에선 *역사*를 바꿀 +거대한+ *딜*이 ^성사되고^ 있었음.`,`[오나지] [토시], [베츠]노 [토코로]데와 *레키시*오 [카에루] +쿄다이나+ *디-루*가 ^세-리츠시테^ [이마시타].`],
[`@장안@에서 탈출한 @헌제@는 +초라한+ *몰골*로 *폐허*가 된 @낙양@에 ^돌아옴^.`,`@쵸-안@카라 [닷슈츠시타] @켄테이@와 +미스보라시이+ *스가타*데 *하이쿄*토 [낫타] @라쿠요-@니 ^모돗테 키마시타^.`],
[`황제인데 *식량*도 *숙소*도 없어서 신하들이 +직접+ 들풀을 뜯어 먹었다는 기록까지 ^있음^.`,`[코-테이]데 [아리나가라] *쇼쿠료-*모 *슈쿠샤*모 [나쿠], [카신]타치가 +지분데+ [노쿠사]오 [츤데] [타베타]토 [이우] [키로쿠]마데 ^아리마스^.`],
[`다들 "*애물단지*"라며 +외면할 때+, @조조@만 이걸 *황금알*로 ^봤음^.`,`[민나]가 "*오니모츠*"다토 [잇테] +메오 소무케루+ [나카], @소-소-@다케가 [코레]오 *킨노 타마고*토 ^미마시타^.`],
[`@순욱@이 결정적인 *조언*을 ^던짐^ — "황제를 모시는 쪽이 천하의 *명분*을 +독점합니다+."`,`@쥰이쿠@가 [케츠테-테키나] *죠겐*오 ^시마시타^ — "[코-테이]오 [오무카에스루] [호-]가 [텐카]노 *타이기메-분*오 +도쿠센데키마스+."`],

chart:[`조조 (허도) — 헌제를 모신 최강 성장주. 브레인 순욱·정욱, 청주병, 둔전제로 무장. 다음 타깃은 여포.`,`원소 (기주) — 하북 최대 세력. 북쪽에서 공손찬과 전쟁 중. 황제 영입 기회를 걷어참.`,`원술 (수춘) — 원소의 동생. 황제를 사칭해 사방이 적. 내리막.`,`여포·진궁 (서주) — 유비에게서 서주를 가로챔. 최강 무력, 최약 신용.`,`유비·관우·장비 — 서주를 잃고 조조의 지원을 받으며 재기 중. 조운과 인연을 맺어 둠.`,`손책 (강동) — 손견의 아들. 원술 밑에서 독립해 강동을 빠르게 평정 중.`,`그 밖 — 형주의 유표, 북쪽의 공손찬, 완성의 장수. 헌제는 조조의 손 안에 있음.`],
m:[`원문사극(150보 거리에서 화극의 작은 가지를 맞힘)은 정사 여포전에 있음.`,`원술의 칭제(197)와 그 영토의 참혹한 기근은 정사임. 옥새가 원술에게 간 경로는 기록마다 다름.`,`완성 전투(197)에서 조앙·조안민·전위가 전사한 건 정사임. 조조가 전위를 위해 울었다는 기록도 정사에 있고, "아들보다 더 슬프다"는 말은 연의 쪽 표현임.`],
nx:[`사방에서 *포위*된 @여포@, *참모* @진궁@의 +목숨 건+ *조언*을 계속 ^무시하는데^...`,`[시호-]카라 *호-이*사레타 @료후@, *산보-* @친큐-@노 +이노치가케노+ *죠겐*오 [즛토] ^무시시츠즈케^...`]
};

E[10]={t:`최강 스펙의 최악 엔딩 — 여포, 하비성에서 끝나다`,y:`서기 198년`,prev:`여포가 화살 한 발로 중재력을 과시했지만, 조조의 다음 타깃으로 찍힘. 원술은 황제를 사칭해 고립됨.`,
s:[
[`198년, @여포@가 다시 @유비@를 공격하자, 이를 *명분* 삼아 @조조@가 +직접+ *대군*을 이끌고 ^출격함^.`,`햐쿠큐-쥬-하치넨, @료후@가 [후타타비] @류-비@오 [코-게키스루]토, [코레]오 *타이기메-분*니 @소-소-@가 +미즈카라+ *다이군*오 [히키이테] ^슛게키시마시타^.`],
[`@여포@는 @하비@성에 *농성*하며 +느긋하게+ ^버팀^ — 천하 최강 *스펙*을 믿은 거임.`,`@료후@와 @카히@죠-니 *로-죠-*시테 +논비리+ ^카마에마시타^ — [텐카] [사이쿄-]노 *스펫쿠*오 [신지타]노데스.`],
[`*참모* @진궁@은 "밖으로 나가 *협공*해야 합니다"라며 +간절하게+ *작전*을 ^건의함^.`,`*산보-* @친큐-@와 "[소토]니 [데테] *하사미우치*니 [스베키]데스" 토 +세츠니+ *사쿠센*오 ^켄겐시마시타^.`],
[`근데 @여포@는 아내의 *반대*에 흔들려 그 *제안*을 +끝내+ ^묵살함^.`,`[데모] @료후@와 [츠마]노 *한타이*니 [유레테] [소노] *테-안*오 +켓쿄쿠+ ^모쿠사츠시마시타^.`],
[`최고의 *브레인*을 두고 *결정*은 집에서 ^내리는^ +전형적인+ *오너 리스크*임.`,`[사이코-]노 *브레인*오 [카카에나가라] *케츠단*와 [이에]데 ^쿠다스^ +텐케-테키나+ *오-나- 리스쿠*데스.`],
[`@조조@는 강물을 끌어와 *성*을 +통째로+ ^물에 잠기게 함^ — 3개월짜리 *수공*이었음.`,`@소-소-@와 [카와]노 [미즈]오 [히키이레], *시로*오 +마루고토+ ^스이보츠사세마시타^ — [산카게츠]니 [오요부] *스이코-*데시타.`],
[`고립이 길어지자 *부하*들의 *불만*이 +폭발 직전+까지 ^쌓임^.`,`[코리츠]가 [나가비쿠]토 *부카*타치노 *후만*가 +바쿠하츠 슨젠마데+ ^타마리마시타^.`],
[`결국 *부하* 장수들이 @진궁@을 묶고 *성문*을 열어 +멋대로+ ^항복함^ — 내부 *쿠데타*였음.`,`[켓쿄쿠] *부카*노 [쇼-]타치가 @친큐-@오 [시바리] *죠-몬*오 [아케테] +캇테니+ ^코-후쿠시마시타^ — [나이부]노 *쿠-데타-*데시타.`],
[`@백문루@까지 몰린 @여포@도 결국 묶인 채 @조조@ 앞에 ^끌려옴^ — +최강의+ *스펙*이 무릎 꿇은 *순간*임.`,`@하쿠몬로-@마데 [오이츠메라레타] @료후@모 [켓쿄쿠] [시바라레타] [마마] @소-소-@노 [마에]니 ^히키다사레마시타^ — +사이쿄-노+ *스펫쿠*가 [히자]오 [츠이타] *슌칸*데스.`],
[`@여포@는 "*포승*이 너무 꽉 조인다"며 +능청스럽게+ *협상*을 ^시도함^ — "나를 쓰면 천하는 금방이오."`,`@료후@와 "*나와*가 [키츠스기루]" 토 +누케누케토+ *코-쇼-*오 ^코코로미마시타^ — "[와타시]오 [츠카에바] [텐카]와 [스구]다."`],
[`@조조@가 +솔깃해하던+ 그 *순간*, *옆자리*에 있던 @유비@가 ^한마디 함^.`,`@소-소-@가 +코코로가 유레타+ [소노] *슌칸*, *토나리*니 [이타] @류-비@가 ^히토코토 이이마시타^.`],
[`"@정원@과 @동탁@이 어떻게 됐는지 *기억* 안 나십니까?" — +서늘한+ *팩트 폭격*임.`,`"@테-겐@토 @토-타쿠@가 [도-] [낫타]카, *키오쿠*니 [아리마센]카?" — +히야리토 스루+ *세-론 바쿠게키*데스.`],
[`@여포@가 +분노하며+ ^외침^ — "이 *귀 큰 놈*이 제일 *신용* 못 할 놈이다!"`,`@료후@와 +게키도시테+ ^사케비마시타^ — "[코노] *미미노 데카이 야츠*가 [이치반] *신요-* [나라나이] [야츠]다!"`],
[`결국 @여포@는 ^처형됐고^, @진궁@도 +담담하게+ *죽음*을 택함 — @조조@의 *스카우트*를 끝까지 거절한 거임.`,`[켓쿄쿠] @료후@와 ^쇼케-사레^, @친큐-@모 +탄탄토+ *시*오 [에라비마시타] — @소-소-@노 *스카우토*오 [사이고마데] [코토왓타]노데스.`],
[`@조조@는 @진궁@의 노모와 가족을 +끝까지+ ^돌봐줬음^ — *옛 동료*에 대한 마지막 *예의*였음.`,`@소-소-@와 @친큐-@노 [로-보]토 [카조쿠]노 +사이고마데+ ^멘도-오 미마시타^ — *모토 도-료-*에노 [사이고]노 *레-기*데시타.`],
[`반면 @여포@ 밑에 있던 @장료@는 +당당하게+ 항복해 *커리어*를 리셋하고 @조조@ 팀의 *에이스*로 ^재탄생함^.`,`[잇포-] @료후@노 [모토]니 [이타] @쵸-료-@와 +도-도-토+ [코-후쿠]시, *캬리아*오 [리셋토]시테 @소-소-@ [치-무]노 *에-스*토시테 ^우마레카와리마시타^.`],
[`@허도@에 들어간 @유비@를 두고, 소설에선 @헌제@가 *족보*를 확인하고 '*황숙*'이라 +공식적으로+ ^인정함^.`,`@쿄토@니 [하잇타] @류-비@니 [츠이테], [쇼-세츠]데와 @켄테이@가 *케-즈*오 [카쿠닌]시, '*코-슈쿠*'토 +코-시키니+ ^미토메마시타^.`],
[`1화의 그 *브랜드 자산*이 드디어 *인증*을 받은 거임 — 근데 @조조@ 눈엔 이게 +슬슬+ ^거슬리기^ 시작함.`,`[다이이치와]노 [아노] *브란도 시산*가 [츠이니] *닌쇼-*오 [에타]노데스 — [데모] @소-소-@노 [메]니와 [코레]가 +단단+ ^메자와리니 나리하지메마스^.`]
],
an:`여포`,a:[
[`@여포@는 *스펙*은 만렙이었지만, *참모*의 말보다 +가까운+ 사람 말에 ^흔들렸음^.`,`@료후@와 *스펫쿠*와 [칸스토]데시타가, *산보-*노 [코토바]요리 +미지카나+ [히토]노 [코토바]니 ^유레마시타^.`],
[`배신으로 쌓은 *커리어*는 마지막에 *신용* 한 줄 때문에 +허무하게+ ^무너짐^.`,`[우라기리]데 [키즈이타] *캬리아*와 [사이고]니 *신요-* [히토코토]데 +아켓나쿠+ ^쿠즈레마시타^.`]
],
w:[
[`*의사결정*은 가장 똑똑한 *참모*의 말을 +끝까지+ ^들어야^ 함 — 가까운 사람 말 말고.`,`*이시켓테-*와 [이치반] [카시코이] *산보-*노 [코토바]오 +사이고마데+ ^키쿠^ [베키]데스 — [미지카나] [히토]노 [코토바]데와 [나쿠].`],
[`결정적 순간의 *한마디*는 칼보다 +무서움+ — @유비@의 *팩트 체크* 한 줄이 @여포@를 ^끝냄^.`,`[케츠테-테키나] [슌칸]노 *히토코토*와 [카타나]요리 +오소로시이+데스 — @류-비@노 *팩토 첵쿠* [히토코토]가 @료후@오 ^오와라세마시타^.`]
],
m:[`하비성 수공과 3개월 농성, 진궁의 건의를 아내 만류로 따르지 않은 일(정사 주석), 부하 장수들이 진궁을 묶고 항복한 일은 정사임.`,`"포승이 너무 조인다", 유비의 "정원과 동탁을 보라", 여포의 "이 귀 큰 놈이 가장 믿을 수 없다"는 모두 정사 기록임. 진궁 처형과 조조가 그 노모를 돌본 일, 장료의 항복도 정사임.`,`헌제가 유비를 '황숙'이라 부르는 장면은 연의 설정임.`],
nx:[`@조조@가 *술자리*에서 @유비@에게 +돌직구+로 ^말함^ — "천하의 *영웅*은 그대와 나뿐이오."`,`@소-소-@가 *사카모리*데 @류-비@니 +돗치쿄쿠데+ ^이이마스^ — "[텐카]노 *에-유-*와 [키미]토 [와타시]다케다."`]
};
E[11]={t:`"천하 영웅은 너랑 나뿐" — 젓가락 떨어뜨린 남자의 탈출`,y:`서기 199~200년`,prev:`여포가 하비에서 처형되고, 유비는 조조를 따라 허도에 들어감.`,
s:[
[`소설에서 @허도@의 @유비@는 일부러 *텃밭*을 가꾸며 +욕심 없는+ 척 *연기*를 ^했음^.`,`[쇼-세츠]데와 @쿄토@노 @류-비@와 [와자토] *하타케*오 [이지리], +요쿠노 나이+ [후리]노 *엔기*오 ^시마시타^.`],
[`어느 날 @조조@가 @유비@를 불러 *술자리*를 열고 +날카롭게+ ^떠봄^ — "지금 천하의 *영웅*은 누구라고 보시오?"`,`[아루] [히] @소-소-@와 @류-비@오 [욘데] *사카모리*오 [히라키], +스루도쿠+ ^사구리오 이레마시타^ — "[이마] [텐카]노 *에-유-*와 [다레]다토 [오모우]?"`],
[`@유비@가 @원소@, @원술@ 등의 *이름*을 늘어놓자 @조조@는 +전부+ ^깎아내림^ — "다 *그릇*이 안 되오."`,`@류-비@가 @엔쇼-@, @엔쥬츠@[나도]노 *나마에*오 [아게루]토, @소-소-@와 +젠부+ ^코키오로시마시타^ — "[민나] *우츠와*데와 [나이]."`],
[`그리고 @유비@와 자기를 가리키며 +조용히+ *결론*을 ^내림^ — "천하의 *영웅*은 그대와 이 @조조@뿐이오."`,`[소시테] @류-비@토 [지분]오 [사시테] +시즈카니+ *케츠론*오 ^다시마시타^ — "[텐카]노 *에-유-*와 [키미]토 [코노] @소-소-@다케다."`],

[`심지어 "장기전으로 가자"던 @전풍@은 *직언*했다는 *이유*로 +감옥에+ ^갇힘^.`,`[사라니] "[쵸-키센]니 [모치코모-]" 토 [잇타] @덴포-@와 *치키겐*시타 [토이우] *리유-*데 +로-야니+ ^이레라레마시타^.`],

[`@조조@는 *맨발*로 뛰어나가 @허유@를 맞음 — *핵심 정보*를 쥔 사람 앞에선 +체면 따위+ ^버린^ 거임.`,`@소-소-@와 *하다시*데 [토비다시테] @쿄유-@오 [무카에마시타] — *쥬-요- 죠-호-*오 [니깃타] [히토]노 [마에]데와 +멘츠나도+ ^스테타^노데스.`],
[`@허유@가 넘긴 *정보*는 +결정적+이었음 — @원소@ 군의 *식량 창고*가 @오소@에 있다는 것.`,`@쿄유-@가 [와타시타] *죠-호-*와 +케츠테-테키+데시타 — @엔쇼-@군노 *쇼쿠료- 소-코*가 @우소@니 [아루]토 [이우] [코토].`],
[`@조조@는 +직접+ 정예 5천을 이끌고 @원소@군으로 *위장*해 *야밤*에 @오소@를 ^기습함^.`,`@소-소-@와 +미즈카라+ [세-에-] 고센오 [히키이], @엔쇼-@군니 *기소-*시테 *요나카*니 @우소@오 ^키슈-시마시타^.`],
[`*창고*에 불이 붙자 원소군 *식량*이 +한순간에+ 재가 되어 ^사라짐^ — *공급망* 붕괴임.`,`*소-코*니 [히]가 [츠쿠]토 [엔쇼-군]노 *쇼쿠료-*와 +잇슌데+ [하이]니 [낫테] ^키에마시타^ — *사프라이 체인*노 [호-카이]데스.`],
[`*패닉*에 빠진 원소군에서 *장수* @장합@마저 +연쇄적으로+ ^투항함^.`,`*파닉쿠*니 [오치잇타] [엔쇼-군]카라 *쇼-* @쵸-코-@마데모 +렌사테키니+ ^토-코-시마시타^.`],
[`결국 *대군*은 +처참하게+ 무너졌고, @원소@는 *체면*이고 뭐고 겨우 8백 기만 데리고 ^도망침^.`,`[켓쿄쿠] *다이군*와 +산잔니+ [쿠즈레], @엔쇼-@와 *멘츠*모 [나니]모 [나쿠] [얏토] [핫퍄쿠키]다케오 [츠레테] ^니게마시타^.`],

[`"@원소@가 강할 땐 나도 *불안*했는데 하물며 남들이야" — *조직*을 ^살린^ +통 큰+ *사면*이었음.`,`"@엔쇼-@가 [츠요캇타] [토키]와 [와타시]데사에 *후안*닷타, [마시테] [타닌]와" — *소시키*오 ^스쿳타^ +다이탄나+ *샤멘*데시타.`],
[`같은 해, 강동을 +폭풍처럼+ 평정하던 @손책@이 *사냥* 중 *자객*의 습격으로 ^쓰러짐^.`,`[오나지] [토시], @코-토-@오 +아라시노 요-니+ [헤-테-시테 이타] @손사쿠@가 *카리*노 [토츄-] *시카쿠*니 [오소와레테] ^타오레마시타^.`],
[`스물여섯, 죽기 직전 그는 열아홉 동생 @손권@에게 *경영권*을 ^넘기며^ +담담하게+ *유언*을 남김.`,`니쥬-로쿠사이, [시누] [슨젠], [카레]와 쥬-큐-사이노 [오토-토] @손켄@니 *케-에-켄*오 ^유즈리^, +탄탄토+ *유이곤*오 [노코시마시타].`],
[`"*전장*에서 겨루는 건 내가 낫지만, *인재*를 써서 나라를 지키는 건 네가 낫다."`,`"*센죠-*데 [아라소우] [노]와 [와타시]가 [우에]다가, *진자이*오 [츠캇테] [쿠니]오 [마모루] [노]와 [오마에]가 [우에]다."`],
[`그렇게 훗날 @적벽@의 *주인공*이 될 @손권@ *시대*가 +조용히+ ^시작됨^.`,`[코-시테] [노치]니 @세키헤키@노 *슈진코-*토 [나루] @손켄@노 *지다이*가 +시즈카니+ ^하지마리마시타^.`]

s:[
[`관도에서 진 @원소@는 *재기*를 노렸지만, 202년 *후계자*도 +확실히+ 정하지 않은 채 ^세상을 떠남^.`,`@칸토@데 [마케타] @엔쇼-@와 *사이키*오 [네라이마시타]가, 니햐쿠니넨, *코-케-샤*모 +핫키리+ [키메나이] [마마] ^나쿠나리마시타^.`],
[`장남 @원담@과 막내 @원상@이 서로 *정통성*을 주장하며 +치열한+ *상속 분쟁*을 ^벌임^.`,`[쵸-난] @엔탄@토 [스엣코]노 @엔쇼-@가 [타가이]니 *세-토-세-*오 [슈쵸-시], +하게시이+ *소-조쿠 아라소이*오 ^쿠리히로게마시타^.`],
[`대기업 *오너* 사후의 +전형적인+ *경영권 분쟁*임 — 2천 년 전에도 이 *패턴*은 ^똑같았음^ㅋㅋ`,`[다이키교-]노 *오-나-* [시고]노 +텐케-테키나+ *케-에-켄 아라소이*데스 — 니센넨 [마에]니모 [코노] *카타*와 ^카와리마센데시타^.`],
[`@조조@는 이 *내분*을 +느긋하게+ 지켜보다가, 형제들이 ^지칠^ 때마다 하나씩 *인수*해 나감.`,`@소-소-@와 [코노] *나이훈*오 +윳타리토+ [나가메], [쿄-다이]가 ^츠카레루^ [타비]니 [히토츠즈츠] *바이슈-*시테 [이키마시타].`],

[`@유비@는 "*물고기*가 *물*을 얻었을 뿐이니 +더는+ 말하지 마라"며 *갈등*을 ^정리함^.`,`@류-비@와 "*사카나*가 *미즈*오 [에타]다케다, +모-+ [이우나]" 토 *아츠레키*오 ^오사메마시타^.`],

[`@유비@는 *나이*도 *직급*도 한참 아래인 사람에게 세 번 ^고개를 숙였음^ — +진짜+ 인재는 이렇게 데려옴.`,`@류-비@와 *토시*모 *야쿠쇼쿠*모 [즛토] [시타]노 [히토]니 [산도] ^아타마오 사게마시타^ — +혼토-니+ [이이] [진자이]와 [코-시테] [츠레테 쿠루]노데스.`],
[`*체면*보다 *결과*를 먼저 본 사람만 +판을 바꿀+ *카드*를 ^손에 넣음^.`,`*멘츠*요리 *켓카*오 [사키]니 [미루] [히토]다케가 +바오 카에루+ *카-도*오 ^테니 이레마스^.`]
],
w:[
[`좋은 *사업계획서*는 *시장*, *경쟁자*, *파트너*, *순서*를 +한 장에+ ^보여줌^ — 융중대가 딱 그거임.`,`[이이] *지교- 케-카쿠*와 *시죠-*, *쿄-고-*, *파-토나-*, *쥰반*오 +이치마이데+ ^미세마스^ — @류-츄-타이@가 [마사니] [소레]데스.`],
[`핵심 *인재*를 영입하면 기존 *멤버*의 +서운함+부터 ^챙겨야^ 함.`,`*카나메노 진자이*오 [무카에타]라 [키존]노 *멘바-*노 +사비시사+카라 ^케아시나케레바^ [나리마센].`]
],
m:[`유비가 세 번 찾아가서야 만났다(三往乃見)는 건 정사 제갈량전 기록이고, 융중대의 내용, "물고기와 물" 발언, 관우·장비의 불만도 정사임.`,`처음 두 번의 허탕, 눈보라, 낮잠 장면은 연의의 연출임.`],
nx:[`@유표@가 죽자 *후계자*는 싸워보지도 않고 @조조@에게 +통째로+ *항복*을 ^선언함^ — @유비@는 백성을 데리고 도망칠 수밖에 없게 됨.`,`@류-효-@가 [나쿠나루]토 *코-케-샤*와 [타타카와즈니] @소-소-@니 +마루고토+ *코-후쿠*오 ^센겐시^ — @류-비@와 [민]오 [츠레테] [니게루] [시카] [나쿠] [나리마스].`]
};
E[16]={t:`싸우기도 전에 회사를 팔아버린 후계자, 백성을 못 버린 오너`,y:`서기 208년`,prev:`유비가 세 번 찾아가 제갈량을 영입함. 조조는 형주를 노리고 남하를 준비함.`,
s:[
[`208년, @조조@의 *선발대*가 @신야@로 몰려오자 @관우@와 @장비@는 +비꼬듯+ ^말함^ — "*물고기*더러 막으라 하시죠."`,`니햐쿠하치넨, @소-소-@노 *센파츠타이*가 @신야@니 [오시요세루]토, @칸우@토 @쵸-히@와 +이야미탓푸리니+ ^이이마시타^ — "*사카나*니 [후세가세타라] [도-데스]."`],
[`소설에서 @제갈량@은 @유비@의 *칼*과 *인감*을 빌려 +당당하게+ *지휘권*을 ^넘겨받음^.`,`[쇼-세츠]데와 @쇼카츠료-@와 @류-비@노 *켄*토 *인칸*오 [카리테] +도-도-토+ *시키켄*오 ^우케츠기마시타^.`],
[`그리고 @박망파@의 좁은 *골짜기*로 적을 끌어들여 +보란 듯이+ *화공*으로 ^박살 냄^.`,`[소시테] @하쿠보-하@노 [세마이] *타니*니 [테키]오 [사소이코미], +미고토니+ *카코-*데 ^타타키츠부시마시타^.`],
[`*입사* 첫 프로젝트에서 *성과*를 내자, 두 형님의 *태도*가 +싹+ ^바뀜^ㅋㅋ`,`*뉴-샤* [사이쇼]노 [프로제쿠토]데 *세-카*오 [다스]토, [후타리]노 [아니키]노 *타이도*가 +가라리토+ ^카와리마시타^.`],
[`근데 진짜 *위기*는 따로 있었음 — @형주@의 *오너* @유표@가 +하필+ 이때 병으로 ^세상을 떠남^.`,`[데모] [혼토-]노 *키키*와 [베츠]니 [아리마시타] — @케-슈-@노 *오-나-* @류-효-@가 +요리니 욧테+ [코노] [토키] [뵤-키]데 ^나쿠나리마시타^.`],
[`*후계자* 자리는 +이미+ 외가 *세력*이 밀던 둘째 @유종@에게 ^넘어가^ 있었음.`,`*코-케-샤*노 [자]와 +스데니+ [하하카타]노 *세료쿠*가 [오시테 이타] [지난] @류-소-@니 ^와탓테^ [이마시타].`],
[`그리고 @유종@은 @조조@가 오자 싸워보지도 않고 *회사*를 통째로 ^넘김^ — +전형적인+ *헐값 매각*임.`,`[소시테] @류-소-@와 @소-소-@가 [쿠루]토 [타타카와즈니] *카이샤*오 [마루고토] ^와타시마시타^ — +텐케-테키나+ *야스우리*데스.`],
[`이 *소식*을 @유비@는 +뒤늦게+ ^알게 됨^ — *본사*가 *통보*도 없이 경쟁사에 팔린 거임.`,`[코노] *시라세*오 @류-비@와 +아토니낫테+ ^시리마시타^ — *혼샤*가 *츠-치*모 [나쿠] [쿄-고-]니 [우라레타]노데스.`],
[`@제갈량@은 "지금이 *찬스*입니다, @양양@을 치면 @형주@는 우리 *것*입니다"라며 +강하게+ ^건의함^.`,`@쇼카츠료-@와 "[이마]가 *찬스*데스, @조-요-@오 [우테바] @케-슈-@와 [와레와레]노 *모노*데스" 토 +츠요쿠+ ^켄겐시마시타^.`],
[`근데 @유비@는 "*은인*의 *아들*을 칠 순 없다"며 +끝내+ ^거절함^ — *의리*냐 *실리*냐의 갈림길이었음.`,`[데모] @류-비@와 "*온진*노 *무스코*오 [우츠] [코토]와 [데키나이]" 토 +켓쿄쿠+ ^코토와리마시타^ — *기리*카 *짓리*카노 [와카레미치]데시타.`],
[`그사이 @조조@의 정예 *기병*이 하루 3백 리라는 +무서운+ *속도*로 ^쫓아옴^.`,`[소노] [아이다]니 @소-소-@노 [세-에-] *키헤-*가 [이치니치] [산뱌쿠리]토 [이우] +오소로시이+ *스피-도*데 ^오잇테 키마시타^.`],
[`그런데 @유비@를 따르겠다는 *백성*과 *피난민*이 10만 명 넘게 +줄줄이+ ^따라붙음^.`,`[토코로가] @류-비@니 [츠이테 이쿠]토 [이우] *민슈-*토 *히난민*가 쥬-만닌 [이죠-] +조로조로토+ ^츠이테 키마시타^.`],
[`하루에 10리밖에 못 가는 +답답한+ *행군*, *참모*들은 백성을 버리라고 ^권함^.`,`[이치니치]니 [쥬-리]시카 [스스메나이] +모도카시이+ *코-군*데, *산보-*타치와 [민]오 [스테루] [요-니] ^스스메마시타^.`],
[`@유비@의 *대답*은 +단호했음+ — "큰일은 *사람*을 근본으로 삼는 법인데, 어찌 버리겠느냐."`,`@류-비@노 *코타에*와 +킷파리토 시테 이마시타+ — "[다이지]오 [나스]니와 *히토*오 [모토]토 [스루] [모노]다, [도-시테] [스테라레요-]."`],
[`이 *한마디*가 @유비@ *브랜드*의 +핵심 가치+가 ^됨^ — 사람을 버리지 않는 리더.`,`[코노] *히토코토*가 @류-비@노 *브란도*노 +카쿠신테키나 카치+니 ^나리마시타^ — [히토]오 [미스테나이] [리-다-].`],
[`하지만 그 *대가*로 @조조@의 *추격대*가 @장판@에서 마침내 +턱밑까지+ ^따라잡음^.`,`[시카시] [소노] *다이쇼-*토시테, @소-소-@노 *츠이게키타이*가 @쵸-한@데 [츠이니] +메토 하나노 사키마데+ ^오이츠키마시타^.`]
],
an:`유비`,a:[
[`@유비@는 +눈앞의+ *영토*보다 *평판*과 *사람*을 ^택했음^.`,`@류-비@와 +메노 마에노+ *료-치*요리 *효-반*토 *히토*오 ^에라비마시타^.`],
[`이게 당장은 +손해+ 같지만, 두고두고 *인재*와 *민심*을 ^끌어모으는^ *자산*이 됨.`,`[코레]와 [스구니와] +손+니 [미에마스]가, [나가이 메데] *진자이*토 *민신*오 ^히키요세루^ *시산*니 [나리마스].`]
],
w:[
[`*위기*일수록 *핵심 가치*를 +흔들림 없이+ ^지키는^ 리더에게 *팬*이 생김.`,`*키키*[호도] *카쿠신 카치*오 +부레즈니+ ^마모루^ [리-다-]니 *환*가 [츠키마스].`],
[`반대로 @유종@처럼 싸우지도 않고 *매각*하면, 회사도 *이름*도 +순식간에+ ^사라짐^.`,`[교쿠]니 @류-소-@노요-니 [타타카와즈니] *바이캬쿠*스루토, [카이샤]모 *나마에*모 +앗토이우마니+ ^키에마스^.`]
],
m:[`박망파 화공은 연의 설정임. 정사에선 제갈량 합류 전에 유비가 박망에서 하후돈을 물리친 일이 있음.`,`유표 사망과 유종 항복(208), 제갈량의 양양 공격 건의(정사 주석), 백성 10여만과 하루 10여 리 행군, "큰일은 사람을 근본으로" 발언, 조조 기병의 하루 3백여 리 추격은 정사임.`],
nx:[`혼란 속에 @유비@의 *아들*이 행방불명 — 그를 찾으러 @조운@이 혼자 적진 *한복판*으로 +거꾸로+ ^달려 들어감^.`,`[콘란]노 [나카], @류-비@노 *무스코*가 [유쿠에후메-]니 — [카레]오 [사가시]니 @쵸-운@가 [히토리]데 [테키진]노 *도만나카*에 +갸쿠니+ ^카케콘데 이키마스^.`]
};
E[17]={t:`적진을 역주행한 남자, 다리 위에서 소리친 남자`,y:`서기 208년`,prev:`유종이 조조에게 항복했고, 유비는 백성을 데리고 피난하다 장판에서 따라잡힘.`,
s:[
[`@장판@의 *아수라장*에서 @유비@는 *가족*까지 버리고 +간신히+ ^탈출함^.`,`@쵸-한@노 *슈라바*데 @류-비@와 *카조쿠*마데 [스테테] +얏토노 코토데+ ^닷슈츠시마시타^.`],
[`그때 "@조운@이 @조조@ 쪽으로 넘어갔다"는 +다급한+ *보고*가 *본진*에 ^들어옴^.`,`[소노] [토키] "@쵸-운@가 @소-소-@[가와]니 [네가엣타]" 토 [이우] +셋파츠맛타+ *호-코쿠*가 *혼진*니 ^토도키마시타^.`],
[`@유비@는 *단창*을 던지며 +단호하게+ ^말함^ — "@자룡@은 나를 버리고 갈 *사람*이 아니다."`,`@류-비@와 *테보코*오 [나게츠케테] +킷파리토+ ^이이마시타^ — "@시류-@와 [와타시]오 [스테테] [이쿠] *닌겐*데와 [나이]."`],
[`실제로 @조운@은 잃어버린 아들 @아두@를 찾으러 *적진* 쪽으로 +거꾸로+ 달리는 *역주행* ^중이었음^.`,`[짓사이]니 @쵸-운@와 [하구레타] [무스코] @아토@오 [사가시]니 *테키진*노 [호-]에 +갸쿠니+ [하시루] *갸쿠소-*노 ^사이츄-데시타^.`],
[`소설에선 @조운@이 *품*에 아기를 안고 @조조@ *대군* 속을 +종횡무진+ 뚫으며 장수 수십을 ^벰^.`,`[쇼-세츠]데와 @쵸-운@가 *후토코로*니 [아카고]오 [다키], @소-소-@노 *다이군*노 [나카]오 +쥬-오-무진니+ [츠키누케], [쇼-]오 [스-쥬-닌] ^키리마시타^.`],
[`정사에서도 @조운@은 @아두@와 그 *어머니*를 +끝까지+ 지켜 ^살려냄^ — 진짜 *경호*의 정석임.`,`[세-시]데모 @쵸-운@와 @아토@토 [소노] *하하오야*오 +사이고마데+ [마못테] ^타스케마시타^ — [혼모노]노 *고에이*노 [오-도-]데스.`],
[`소설에선 @유비@가 받아 든 *아들*을 땅에 던지며 "이 녀석 때문에 *명장*을 잃을 뻔했다"고 +울컥해서+ ^외침^ㅋㅋ`,`[쇼-세츠]데와 @류-비@가 [우케톳타] *무스코*오 [지멘]니 [나게], "[코이츠]노 [세-]데 *메-쇼-*오 [우시나우] [토코로]닷타" 토 +캇토낫테+ ^사케비마시타^.`],
[`그 *시각*, 뒤쪽 @장판교@에선 @장비@가 단 20여 *기병*으로 +혼자+ ^버티고^ 있었음.`,`[소노] *지코쿠*, [우시로]노 @쵸-한쿄-@데와 @쵸-히@가 [와즈카] 니쥬-[요키]노 *키헤-*데 +히토리데+ ^훈밧테^ [이마시타].`],

an:`노숙`,a:[
[`@노숙@은 눈앞의 *손익*보다 3자 *구도*를 ^먼저 본^ +장기적인+ *전략가*였음.`,`@로슈쿠@와 [메노 마에]노 *손에키*요리 [산샤]노 *코-즈*오 ^사키니 미타^ +쵸-키테키나+ *센랴쿠카*데시타.`],
[`다만 '빌려준 땅'이라는 +애매한+ *계약*이 나중에 큰 *분쟁*을 ^부름^.`,`[타다] '[카시타] [토치]'토 [이우] +아이마이나+ *케-야쿠*가 [노치]니 [오-키나] *훈소-*오 ^마네키마스^.`]
],
w:[
[`*파트너십* 계약서엔 *반납* 조건과 *기한*을 +반드시+ ^명시해야^ 함 — 형주가 그 반면교사임.`,`*파-토나-십푸*노 [케-야쿠쇼]니와 *헨캬쿠* [죠-켄]토 *키겐*오 +카나라즈+ ^메-키스루^ [베키]데스 — @케-슈-@가 [소노] [한멘쿄-시]데스.`],
[`*정략결혼*처럼 *관계*로 묶은 동맹은, 이해관계가 바뀌면 +쉽게+ ^풀림^.`,`*세-랴쿠켓콘*노요-니 *칸케-*데 [무슨다] [도-메-]와, [리가이]가 [카와레바] +칸탄니+ ^호도케마스^.`]
],
m:[`유비의 형주 남부 4군 확보(209), 주유-조인의 강릉 공방, 손권 누이와의 혼인(209), 시녀들이 칼을 차고 있어 유비가 늘 긴장했다는 기록(정사 법정전), 주유의 "유비를 붙잡아 두자" 건의, 노숙의 형주 대여 지지, 조조가 붓을 떨어뜨린 일(정사 주석)은 정사임.`,`연의는 혼인을 주유의 '미인계 함정'으로 각색함.`],
nx:[`서른여섯의 천재 @주유@가 *원정* 준비 중 +갑자기+ 쓰러짐 — 그리고 비어 있던 *책사* 자리에 '봉황의 새끼'가 ^등장함^.`,`산쥬-로쿠사이노 [텐사이] @슈유@가 *엔세-*노 [쥰비]츄-니 +토츠젠+ [타오레] — [소시테] [아이테 이타] *사쿠시*노 [자]니 '[호-오-]노 [히나]'가 ^토-죠-시마스^.`]
};
E[21]={t:`천재 사령관의 퇴장, '봉황 새끼'의 입사, 익주에서 온 초대장`,y:`서기 210~211년`,prev:`유비는 손권의 여동생과 혼인하고 형주를 빌려 성장 발판을 마련함.`,
s:[
[`210년, @익주@ 공략을 준비하던 @주유@가 *원정* *도중*에 병으로 +허무하게+ ^세상을 떠남^ — 겨우 서른여섯이었음.`,`니햐쿠쥬-넨, @에키슈-@ [코-랴쿠]오 [쥰비시테 이타] @슈유@가 *엔세-*노 *토츄-*데 [뵤-키]니 [타오레], +아켓나쿠+ ^나쿠나리마시타^ — [와즈카] 산쥬-로쿠사이데시타.`],
[`소설에선 @제갈량@에게 세 번 당한 *분노*와 *열등감*으로 "하늘은 왜 @제갈량@까지 낳았는가"라며 +원통하게+ ^죽음^.`,`[쇼-세츠]데와 @쇼카츠료-@니 [산도] [야라레타] *이카리*토 *렛토-칸*데 "[텐]와 [나제] @쇼카츠료-@마데 [운다]노카" 토 +쿠야시게니+ ^나쿠나리마시타^.`],
[`하지만 정사의 @주유@는 *도량*이 넓고 *음악*에도 밝은 +멋진+ *리더*였음 — 열등감 캐릭터는 연의의 ^각색^임.`,`[데스가] [세-시]노 @슈유@와 *도료-*가 [히로쿠] *온가쿠*니모 [아카루이] +스테키나+ *리-다-*데시타 — [렛토-칸] [캬라]와 [엔기]노 ^캬쿠쇼쿠^데스.`],
[`@주유@는 죽기 전 *후임*으로 @노숙@을 +강력하게+ ^추천함^ — 동맹파가 오나라 *실세*가 된 거임.`,`@슈유@와 [시누] [마에]니 *코-닌*토시테 @로슈쿠@오 +츠요쿠+ ^스이센시마시타^ — [도-메-하]가 @고@노 *짓켄샤*니 [낫타]노데스.`],
[`같은 시기, @제갈량@과 함께 '와룡·봉추'로 불리던 *천재* @방통@이 @유비@ *팀* *라인업*에 +드디어+ ^합류함^.`,`[오나지] [코로], @쇼카츠료-@토 [토모]니 '@가류-@·@호-스-@'토 [요바레타] *텐사이* @호-토-@가 @류-비@ *치-무*노 *라인낫푸*니 +츠이니+ ^고-류-시마시타^.`],
[`근데 첫 *발령*은 작은 고을 *현령* — 소설에선 술만 마시다 +보란 듯이+ 백 일 치 *업무*를 반나절에 ^처리함^ㅋㅋ`,`[데모] [사이쇼]노 *하츠레-*와 [치이사나] [마치]노 *쵸-칸* — [쇼-세츠]데와 [사케]바카리 [논데], +미세츠케루 요-니+ [햐쿠니치]붕노 *교-무*오 [한니치]데 ^카타즈케마시타^.`],
[`정사에선 그 *현령* 자리에서 +진짜로+ ^잘렸는데^, @노숙@과 @제갈량@의 *추천*으로 겨우 *핵심 참모*가 됨.`,`[세-시]데와 [소노] *쵸-칸*노 [자]데 +혼토-니+ ^멘쇼쿠사레^, @로슈쿠@토 @쇼카츠료-@노 *스이센*데 [얏토] *카나메노 산보-*니 [나리마시타].`],
[`*스펙*보다 *평판*과 *추천*이 커리어를 ^살린^ +대표적인+ 케이스임.`,`*스펫쿠*요리 *효-반*토 *스이센*가 [캬리아]오 ^스쿳타^ +다이효-테키나+ [케-스]데스.`],
[`211년, 서쪽 *변방*의 맹장 @마초@가 @조조@에게 *반기*를 들고 @동관@에서 +치열하게+ ^맞붙음^.`,`니햐쿠쥬-이치넨, [니시]노 *헨쿄-*노 [모-쇼-] @바쵸-@가 @소-소-@니 *한키*오 [히루가에시], @도-칸@데 +하게시쿠+ ^부츠카리마시타^.`],
[`밀리던 @조조@는 @마초@와 동맹 @한수@ 사이를 +교묘하게+ *이간질*해서 ^무너뜨림^ — *파트너십* 깨기의 달인임.`,`[오사레테 이타] @소-소-@와 @바쵸-@토 [도-메-]노 @칸스이@노 [아이다]오 +타쿠미니+ *나카타가이*사세테 ^쿠즈시마시타^ — *파-토나-십푸* [쿠즈시]노 *타츠진*데스.`],
[`이 *소식*에 +유약한+ @익주@의 주인 @유장@은 다음 *타깃*이 자기라는 *공포*에 ^빠짐^.`,`[코노] *시라세*니 +요와키나+ @에키슈-@노 [아루지] @류-쇼-@와 [츠기]노 *타-겟토*가 [지분]다토 [이우] *쿄-후*니 ^오치이리마시타^.`],
[`이때 *참모* @장송@과 @법정@이 +은밀히+ ^속삭임^ — "같은 유씨인 @유비@를 불러 *용병*으로 쓰시죠."`,`[코노] [토키] *산보-* @쵸-쇼-@토 @호-세-@가 +히소카니+ ^사사야키마시타^ — "[오나지] [류-시]노 @류-비@오 [욘데] *요-헤-*토시테 [츠카이마쇼-]."`],
[`근데 두 사람의 *속셈*은 따로 있었음 — 무능한 *오너* 대신 @유비@를 새 주인으로 ^모시려는^ +내부+ *쿠데타*였음.`,`[데모] [후타리]노 *하라*와 [베츠]니 [아리마시타] — [무노-나] *오-나-*노 [카와리]니 @류-비@오 [아타라시이] [아루지]니 ^무카에요-토스루^ +나이부노+ *쿠-데타-*데시타.`],
[`211년, @유비@는 @형주@를 @제갈량@과 @관우@에게 맡기고 '*초대받은 손님*'의 *모습*으로 +조용히+ ^출발함^.`,`니햐쿠쥬-이치넨, @류-비@와 @케-슈-@오 @쇼카츠료-@토 @칸우@니 [마카세], '*마네카레타 캬쿠*'노 *스가타*데 +시즈카니+ ^슛파츠시마시타^.`]
],
an:`방통`,a:[
[`@방통@은 *첫인상*이 +별로라서+ 잘렸지만, *실력*을 아는 사람들의 *추천*으로 ^살아남음^.`,`@호-토-@와 *다이이치인쇼-*가 +이마이치데+ [멘쇼쿠사레마시타]가, *지츠료쿠*오 [시루] [히토비토]노 *스이센*데 ^이키노코리마시타^.`],
[`좋은 *네트워크*는 내 *실수*를 +한 번쯤+ ^덮어주는^ 보험임.`,`[이이] *넷토와-쿠*와 [지분]노 *싯파이*오 +이치도구라이와+ ^카밧테 쿠레루^ [호켄]데스.`]
],
w:[
[`*파트너십*은 바깥 적보다 +안쪽의+ *의심* 하나에 ^깨짐^ — @조조@의 이간질처럼.`,`*파-토나-십푸*와 [소토]노 [테키]요리 +우치가와노+ *우타가이* [히토츠]데 ^코와레마스^ — @소-소-@노 [나카타가이]노요-니.`],
[`남의 *회사*에 *컨설턴트*로 들어갈 땐, 누가 진짜 *결정권자*인지부터 +정확히+ ^파악해야^ 함.`,`[타닌]노 *카이샤*니 *콘사루탄토*토시테 [하이루] [토키]와, [다레]가 [혼토-]노 *켓테-켄샤*카오 +세-카쿠니+ ^하아쿠스루^ [베키]데스.`]
],
m:[`주유 사망(210, 36세)과 노숙 후임 추천, 방통이 현령 자리에서 면직된 뒤 노숙·제갈량의 추천으로 중용된 일은 정사임. 제갈량 때문에 분노해 죽는 주유와 반나절 업무 처리 장면은 연의임.`,`동관 전투와 마초·한수 이간(211), 장송·법정의 유비 영입 건의도 정사임.`],
nx:[`손님으로 들어간 @유비@, 결국 *초대한 집주인*을 향해 +칼을 돌림+ — 그런데 *전략가* @방통@이 *화살* 한 발에 ^쓰러짐^.`,`[캬쿠]토시테 [하잇타] @류-비@와 [츠이니] *마네이타 야누시*니 +야이바오 무케+ — [토코로가] *센랴쿠카* @호-토-@가 *야* [입파츠]데 ^타오레마스^.`]
};
E[22]={t:`초대한 집주인에게 칼을 돌린 손님, 그리고 낙봉파의 비극`,y:`서기 212~214년`,prev:`주유가 세상을 떠나고 방통이 유비 팀에 합류함. 익주의 유장이 유비를 '용병'으로 초대함.`,
s:[
[`@익주@에 들어간 @유비@는 @한중@의 @장로@를 막는다는 *명목*으로 1년 넘게 +느긋하게+ ^머묾^ — 실은 *민심* 작업 중이었음.`,`@에키슈-@니 [하잇타] @류-비@와 @칸츄-@노 @쵸-로@오 [후세구]토 [이우] *메-모쿠*데 [이치넨] [이죠-] +윳타리토+ ^타이자이시마시타^ — [지츠와] *민신* [코-사쿠]노 [사이츄-]데시타.`],
[`@방통@은 세 가지 *옵션*을 +깔끔하게+ ^제시함^ — 바로 *본사*를 치는 상책, 요지부터 먹는 중책, 철수하는 하책.`,`@호-토-@와 [밋츠]노 *옵숀*오 +킷치리토+ ^테-지시마시타^ — [스구니] *혼샤*오 [우츠] [죠-사쿠], [요-쇼-]카라 [토루] [츄-사쿠], [텟타이스루] [게사쿠].`],
[`@유비@는 +현실적인+ *중책*을 골랐고, 마침 @장송@의 *내통*이 들통나며 @유장@과 ^전면전^에 돌입함.`,`@류-비@와 +겐지츠테키나+ *츄-사쿠*오 [에라비], [춋도] @쵸-쇼-@노 *나이츠-*가 [바레테], @류-쇼-@토 ^젠멘센소-^니 [토츠뉴-시마시타].`],
[`*초대한 손님*이 *집주인*을 치는 +뻔뻔한+ 상황 — 9화의 @여포@와 뭐가 다르냐는 *비판*도 ^나올^ 만했음.`,`*마네이타 캬쿠*가 *야누시*오 [우츠] +즈-즈-시이+ [죠-쿄-] — [큐-와]노 @료후@토 [나니]가 [치가우]노카토 [이우] *히한*모 ^데루^ [하즈]데시타.`],
[`그런데 214년, @낙성@ *포위전* 중에 @방통@이 날아온 *화살*에 맞아 +허무하게+ ^전사함^ — 서른여섯이었음.`,`[토코로가] 니햐쿠쥬-욘넨, @라쿠죠-@노 *호-이센*노 [사이츄-], @호-토-@가 [톤데 키타] *야*니 [아타리], +아켓나쿠+ ^센시시마시타^ — 산쥬-로쿠사이데시타.`],
[`소설에선 그곳 *지명*이 '봉황이 ^떨어지는^ 언덕', @낙봉파@였다고 함 — +소름 돋는+ *복선*임.`,`[쇼-세츠]데와 [소코]노 *치메-*가 '[호-오-]가 ^오치루^ [사카]', @라쿠호-하@닷타토 [이이마스] — +조쿠토스루+ *후쿠센*데스.`],
[`*핵심 참모*를 잃은 @유비@는 @제갈량@, @장비@, @조운@까지 +총동원해+ *증원*을 ^요청함^.`,`*카나메노 산보-*오 [우시낫타] @류-비@와 @쇼카츠료-@, @쵸-히@, @쵸-운@마데 +소-도-인데+ *조-엔*오 ^요-세-시마시타^.`],

E[24]={t:`노장의 한 방과 '닭갈비'의 비밀 — 유비, 한중왕이 되다`,y:`서기 215~219년`,prev:`순욱이 떠나고 조조는 위공이 됨. 손권과 유비는 형주를 나눴고, 합비에선 장료가 8백 명으로 10만을 꺾음.`,
s:[
[`215년, @조조@는 @한중@의 @장로@를 +손쉽게+ 항복시키며 @익주@의 *급소*인 *목덜미*를 ^움켜쥠^.`,`니햐쿠쥬-고넨, @소-소-@와 @칸츄-@노 @쵸-로@오 +앗사리+ [코-후쿠사세], @에키슈-@노 *큐-쇼*데아루 *쿠비스지*오 ^츠카미마시타^.`],
[`216년엔 아예 '위왕'이 되며 *황제* 바로 아래 +사실상의+ *오너*로 ^등극함^.`,`니햐쿠쥬-로쿠넨니와 [츠이니] '@기오-@'토 [나리], *코-테이*노 [스구] [시타]노 +짓시츠테키나+ *오-나-*니 ^노보리츠메마시타^.`],
[`@한중@이라는 *관문*을 뺏기면 @익주@는 +문 없는 집+이 되기에, @유비@는 *총력전*을 ^선언함^.`,`@칸츄-@토 [이우] *칸몬*오 [우바와레레바] @에키슈-@와 +토비라노 나이 이에+니 [나루] [노]데, @류-비@와 *소-료쿠센*오 ^센겐시마시타^.`],
[`2년 가까운 +지루한+ *대치* 끝에, 219년 @정군산@에서 결정적인 *찬스*가 ^찾아옴^.`,`[니넨] [치카쿠]노 +타이쿠츠나+ *타이지*노 [스에], 니햐쿠쥬-큐-넨, @테-군잔@데 [케츠테-테키나] *찬스*가 ^오토즈레마시타^.`],
[`*노장* @황충@이 산 위에서 +번개처럼+ 내려와 @조조@ 쪽 *사령관* @하후연@을 ^베어버림^.`,`*로-쇼-* @코-츄-@가 [야마]노 [우에]카라 +이나즈마노 요-니+ [카케오리], @소-소-@[가와]노 *시레-칸* @카코-엔@오 ^키리스테마시타^.`],
[`*나이*는 숫자일 뿐이라는 걸 +온몸으로+ 증명한 *레전드* 경력직임 — @황충@은 이 한 방으로 ^스타가 됨^ㅋㅋ`,`*토시*와 [타다]노 [스-지]다토 +젠신데+ [쇼-메-시타] *레젠도* [츄-토사이요-]데스 — @코-츄-@와 [코노] [잇파츠]데 ^스타-니 나리마시타^.`],
[`직접 달려온 @조조@도 @유비@의 +철벽+ *수비*를 뚫지 못하고 몇 달을 *소모전*으로 ^허비함^.`,`[지키지키니] [카케츠케타] @소-소-@모 @류-비@노 +텟페키노+ *슈비*오 [야부레즈], [스-카게츠]오 *쇼-모-센*데 ^무다니 시마시타^.`],
[`어느 날 @조조@가 저녁으로 나온 *닭갈비*를 보며 "*계륵*"이라 중얼거리자, *부하* @양수@가 +혼자+ 짐을 ^싸기^ 시작함.`,`[아루] [히], @소-소-@가 [유-쇼쿠]니 [데타] *토리노 아바라*오 [미테] "*케-로쿠*" 토 [츠부야쿠]토, *부카* @요-슈-@가 +히토리데+ [니모츠]오 ^마토메^ [하지메마시타].`],
[`"먹자니 살이 없고 버리자니 아까운 것 — 철수하실 *신호*요." 너무 +눈치 빠른+ *해석*이었음.`,`"[타베요-니모] [니쿠]가 [나쿠], [스테루]니와 [오시이] [모노] — [텟타이]나사루 *아이즈*다." [아마리니] +사시노 이이+ *카이샤쿠*데시타.`],
[`@조조@는 실제로 @한중@을 ^포기했지만^, @양수@는 *군기*를 어지럽혔다는 *죄*로 +결국+ 처형됨.`,`@소-소-@와 [짓사이]니 @칸츄-@오 ^아키라메마시타가^, @요-슈-@와 *군키*오 [미다시타]토 [이우] *츠미*데 +켓쿄쿠+ [쇼케-사레마시타].`],
[`*상사*의 속마음을 너무 빨리 ^읽고^ 떠벌리는 *부하*는, +능력자+여도 위험해지는 법임.`,`*죠-시*노 [혼네]오 [하야쿠] ^욘데^ [이이후라스] *부카*와, +유-노-데모+ [키켄니] [나루] [모노]데스.`],
[`219년, @유비@는 @한중@을 지켜낸 *기세*로 '@한중왕@'에 ^오름^ — 짚신 장수가 +드디어+ *왕*이 된 거임.`,`니햐쿠쥬-큐-넨, @류-비@와 @칸츄-@오 [마모리누이타] *이키오이*데 '@칸츄-오-@'니 ^츠키마시타^ — [와라지우리]가 +츠이니+ *오-*니 [낫타]노데스.`],
[`@관우@, @장비@, @마초@, @황충@ — 훗날 '오호대장'이라 불리는 *라인업*의 +가장 화려한+ *전성기*였음.`,`@칸우@, @쵸-히@, @바쵸-@, @코-츄-@ — [노치]니 '[고코타이쇼-]'토 [요바레루] *라인낫푸*노 +못토모 하나야카나+ *젠세-키*데시타.`],
[`근데 @관우@는 "*노장* @황충@과 같은 *급*이라니"라며 +대놓고+ ^불만을 터뜨림^ — 자존심 경보가 울리기 시작함.`,`[데모] @칸우@와 "*로-쇼-* @코-츄-@토 [오나지] *카쿠*토와" 토 +로코츠니+ ^후만오 부치마케마시타^ — [프라이도]노 [케-호-]가 [나리하지메마스].`]
],
an:`양수`,a:[
[`@양수@는 *눈치*는 1등이었지만, 그걸 +티 내는+ 순간 *상사*에게 *위협*이 ^됐음^.`,`@요-슈-@와 *사시*와 [이치반]데시타가, [소레]오 +히케라카스+ [슌칸] *죠-시*니 [톳테] *쿄-이*니 ^나리마시타^.`],
[`*조직*에서 *통찰*은 +조용히+ 쓰여야 ^빛남^.`,`*소시키*데와 *도-사츠*와 +시즈카니+ [츠카와레테] [코소] ^카가야키마스^.`]
],
w:[
[`*경력직*을 쓸 땐 *나이*보다 *실행력*을 +냉정하게+ ^봐야^ 함 — @황충@처럼.`,`*츄-토사이요-*데와 *토시*요리 *짓코-료쿠*오 +레-세-니+ ^미루^ [베키]데스 — @코-츄-@노요-니.`],
[`*직급* 체계를 바꿀 땐 기존 *에이스*의 +자존심+부터 ^설득해야^ 함 — 안 그러면 @관우@처럼 터짐.`,`*야쿠쇼쿠* [타이케-]오 [카에루] [토키]와 [키존]노 *에-스*노 +프라이도+카라 ^셋토쿠시나케레바^ [나리마센] — [사모나이토] @칸우@노요-니 [바쿠하츠시마스].`]
],
m:[`조조의 한중 평정(215)과 위왕 즉위(216), 정군산에서 황충이 하후연을 벤 일(219), '계륵' 일화(정사 주석 《구주춘추》), 양수 처형(219, 연의는 계륵과 직접 연결함), 유비의 한중왕 즉위(219)는 정사임.`,`관우가 황충과 같은 반열을 불만스러워한 건 정사 비시전에 있음. '오호대장'은 연의 명칭임.`],
nx:[`기세가 오른 @관우@가 +직접+ 북쪽 @번성@을 ^치러 감^ — 그리고 *하늘*마저 그의 편을 들어 *홍수*가 터짐.`,`[이키오이]니 [놋타] @칸우@가 +미즈카라+ [키타]노 @한죠-@오 ^세메니 이키마스^ — [소시테] *텐*마데 [카레]노 [미카타]오 [시테] *코-즈이*가 [오코리마스].`]
};

E[25]={t:`홍수와 함께 천하를 뒤흔든 남자 — 관우의 커리어 하이`,y:`서기 219년`,prev:`유비가 한중을 지켜 한중왕이 됨. 관우는 황충과 같은 급이라는 데 불만을 터뜨림.`,
s:[
[`219년, @관우@는 @형주@에서 *북상*해 @조조@의 *요새* @번성@을 +거세게+ ^포위함^.`,`니햐쿠쥬-큐-넨, @칸우@와 @케-슈-@카라 *호쿠조-*시, @소-소-@노 *요-사이* @한죠-@오 +하게시쿠+ ^호-이시마시타^.`],
[`마침 *장마*로 강이 넘치자, *구원군*으로 온 @우금@의 7개 부대가 +통째로+ 물에 ^잠김^.`,`[춋도] *나가아메*데 [카와]가 [아후레루]토, *엔군*토시테 [키타] @우킨@노 [나나츠]노 [부타이]가 +마루고토+ [미즈]니 ^츠카리마시타^.`],
[`이게 @수엄칠군@ *전설* — @관우@는 배를 타고 +유유히+ 다가가 @우금@의 *항복*을 ^받아냄^.`,`[코레]가 @스이엔시치군@노 *덴세츠* — @칸우@와 [후네]데 +유-유-토+ [치카즈키], @우킨@노 *코-후쿠*오 ^우케마시타^.`],
[`반면 맹장 @방덕@은 "나는 *항복*하는 *장수*가 아니다"며 +끝까지+ 버티다 ^처형됨^.`,`[잇포-] [모-쇼-] @호-토쿠@와 "[와타시]와 *코-후쿠*스루 *쇼-*데와 [나이]" 토 +사이고마데+ [테-코-]시, ^쇼케-사레마시타^.`],
[`이 *뉴스*에 *천하*가 진동했고, @조조@는 수도를 옮길까 +진지하게+ ^고민함^.`,`[코노] *뉴-스*니 *텐카*가 [유레], @소-소-@와 [미야코]오 [우츠스]카 +신켄니+ ^나야미마시타^.`],
[`소설에선 @관우@가 독화살 맞은 팔을 명의 @화타@에게 맡기고, 뼈를 긁는 *수술*을 받으며 +태연하게+ *바둑*을 ^둠^.`,`[쇼-세츠]데와 @칸우@가 [도쿠야]오 [우케타] [우데]오 [메-이] @카다@니 [마카세], [호네]오 [케즈루] *슈쥬츠*오 [우케나가라] +헤-젠토+ *고*오 ^우치마시타^.`],
[`근데 *정상*에 선 순간, @관우@는 동맹 @손권@에게 +치명적인+ *실언*을 ^날림^ — 혼담을 청한 *사신*에게 "범의 딸을 개의 자식에게 주겠냐".`,`[데모] *쵸-텐*니 [탓타] [슌칸], @칸우@와 [도-메-]노 @손켄@니 +치메-테키나+ *시츠겐*오 ^하나치마시타^ — [엔단]오 [모-시콘다] *시샤*니 "[토라]노 [무스메]오 [이누]노 [코]니 [야레루]카".`],
[`이 *모욕*에 @손권@은 +이를 갈며+ 몰래 @조조@와 *뒷거래*를 ^시작함^.`,`[코노] *부조쿠*니 @손켄@와 +하오 쿠이시바리+ [콧소리] @소-소-@토 *우라토리히키*오 ^하지메마시타^.`],
[`오나라 *사령관* @여몽@은 +일부러+ *병*을 핑계로 물러나는 *연기*를 ^했음^.`,`@고@노 *시레-칸* @료모-@와 +와자토+ *뵤-키*오 [코-지츠]니 [히쿠] *엔기*오 ^시마시타^.`],
[`후임은 무명의 서생 @육손@ — 그는 @관우@에게 +극도로 겸손한+ *칭찬 편지*를 보내 *경계심*을 ^녹여버림^.`,`[코-닌]와 [무메-]노 [쇼세-] @리쿠손@ — [카레]와 @칸우@니 +코노우에나쿠 켄쿄나+ *호메노 테가미*오 [오쿠리], *케-카이신*오 ^토카시테 시마이마시타^.`],
[`방심한 @관우@는 @형주@의 *수비 병력*까지 빼서 +전부+ 북쪽 *전선*에 ^투입함^.`,`[유단시타] @칸우@와 @케-슈-@노 *슈비 헤-료쿠*마데 [누키], +스베테+ [키타]노 *젠센*니 ^토-뉴-시마시타^.`],
[`*본사*가 텅 빈 그 *순간*, 강 건너에선 상인으로 *변장*한 군사들이 +조용히+ 배에 ^오르고^ 있었음.`,`*혼샤*가 [카랏포]니 [낫타] [소노] *슌칸*, [카와]노 [무코-]데와 [쇼-닌]니 *헨소-*시타 [헤-]가 +시즈카니+ [후네]니 ^놋테^ [이마시타].`]
],
an:`관우`,a:[
[`@관우@는 *실력*으로 *정상*에 올랐지만, 그 +높은+ *자존심*이 동맹을 ^적으로 만들었음^.`,`@칸우@와 *지츠료쿠*데 *쵸-텐*니 [노보리마시타]가, [소노] +타카이+ *프라이도*가 [도-메-]오 ^테키니 마와시마시타^.`],
[`*성공* 직후가 가장 +위험한+ 순간이라는 걸 그는 ^몰랐음^ — *방심*이 최대의 적임.`,`*세-코-* [쵸쿠고]가 [못토모] +키켄나+ [슌칸]다토 [이우] [코토]오, [카레]와 ^시리마센데시타^ — *유단*가 [사이다이]노 [테키]데스.`]
],
w:[
[`*커리어 하이*에서 내뱉은 *실언* 한 마디가 +모든+ *관계*를 ^무너뜨릴^ 수 있음.`,`*캬리아 하이*데 [하키다시타] *시츠겐* [히토코토]가 +스베테노+ *칸케-*오 ^쿠즈스^ [코토]모 [아리마스].`],
[`*경쟁사*가 +갑자기+ *겸손*해지면, 그건 *칭찬*이 아니라 ^경고^임.`,`*쿄-고-*가 +토츠젠+ *켄쿄*니 [낫타라], [소레]와 *호메코토바*데와 [나쿠] ^케-코쿠^데스.`]
],

E[26]={t:`텅 빈 본사, 퇴로 없는 영웅 — 관우의 최후`,y:`서기 219년`,prev:`관우가 수엄칠군으로 천하를 흔들었지만, 손권을 모욕했고 여몽·육손의 위장에 방심함.`,
s:[
[`@여몽@의 위장 *부대*는 +소리 없이+ 강을 건너 @형주@의 *초소*를 하나씩 ^접수함^.`,`@료모-@노 [기소-] *부타이*와 +오토모 나쿠+ [카와]오 [와타리], @케-슈-@노 *미하리쇼*오 [히토츠즈츠] ^셋슈-시마시타^.`],

[`게다가 @여몽@은 점령지 백성의 *가족*을 +극진히+ 돌보며 @관우@ 병사들의 *민심*을 ^흔들어놓음^.`,`[사라니] @료모-@와 [센료-치]노 [민]노 *카조쿠*오 +테-쵸-니+ [아츠카이], @칸우@노 [헤-]타치노 *민신*오 ^유사부리마시타^.`],

[`앞엔 @조조@의 *구원군*, 뒤엔 오나라 — @관우@는 *사면초가* 상태로 +작은+ 성 @맥성@으로 ^쫓겨남^.`,`[마에]니와 @소-소-@노 *엔군*, [우시로]니와 @고@ — @칸우@와 *시멘소카*노 [죠-타이]데 +치이사나+ [시로] @바쿠죠-@에 ^오이야라레마시타^.`],

[`@조조@는 그 머리를 *제후*의 예로 +정중하게+ ^장례 치러줌^ — 옛 *부하*에 대한 마지막 *예우*였음.`,`@소-소-@와 [소노] [쿠비]오 *쇼코-*노 [레-]데 +테-쵸-니+ ^호-무리마시타^ — [모토]노 *부카*니 [타이스루] [사이고]노 *레-구-*데시타.`],
[`@형주@와 동생을 동시에 잃은 @유비@는 +이성을 잃을 만큼+ *분노*했고, 마음속에 *복수*를 ^새김^.`,`@케-슈-@토 [오토-토]오 [도-지니] [우시낫타] @류-비@와 +리세-오 우시나우 호도+ *게키도*시, [코코로]니 *훗슈-*오 ^키자미마시타^.`]
],
an:`관우`,a:[

[`*의리*의 상징이 *내부자*의 배신으로 무너졌다는 게 이 이야기의 +가장 아픈+ ^아이러니^임.`,`*기리*노 [쇼-쵸-]가 *나이부샤*노 [우라기리]데 [쿠즈레타] [코토]가, [코노] [모노가타리]노 +이치반 이타이+ ^아이로니-^데스.`]

[`경쟁사의 *민심* 공략은 +무력보다+ ^강함^ — @여몽@은 칼보다 *복지*로 이겼음.`,`[쿄-고-]노 *민신* [코-랴쿠]와 +부료쿠요리+ ^츠요이^데스 — @료모-@와 [카타나]요리 *후쿠시*데 [카치마시타].`]

E[27]={t:`영웅의 퇴장과 4백 년 회사의 폐업 — 조조 사망, 위나라 건국`,y:`서기 220년`,prev:`관우가 형주를 잃고 처형됐고, 손권은 그 머리를 조조에게 보냄.`,
s:[

[`*유언*은 의외로 +소박했음+ — "장례는 *검소*하게, 금은보화는 넣지 마라."`,`*유이곤*와 [이가이니모] +시소데시타+ — "[소-기]와 *시츠소*니, [킨긴]노 [타카라]와 [이레루나]."`],
[`*간웅*이라 욕먹었지만, @조조@는 시를 쓰고 *인재*를 ^키운^ +다재다능한+ *CEO*였음.`,`*칸유-*토 [노노시라레마시타]가, @소-소-@와 [시]오 [츠쿠리] *진자이*오 ^소다테타^ +타사이나+ *시-이-오-*데시타.`],
[`*후계자*는 장남 @조비@ — 재능 넘치는 동생 @조식@과의 +치열한+ *후계 경쟁*에서 ^이긴^ 사람임.`,`*코-케-샤*와 [쵸-난] @소-히@ — [사이노-] [아후레루] [오토-토] @소-쇼쿠@토노 +하게시이+ *코-케-샤 아라소이*니 ^캇타^ [히토]데스.`],
[`소설에선 @조비@가 동생이자 *라이벌*인 @조식@에게 "일곱 걸음 안에 *시*를 지으라"고 +잔인하게+ ^명령함^.`,`[쇼-세츠]데와 @소-히@가 [오토-토]데 *라이바루*데모 [아루] @소-쇼쿠@니 "[나나호] [아루쿠] [아이다]니 *시*오 [츠쿠레]" 토 +잔코쿠니+ ^메-지마시타^.`],
[`"콩깍지를 태워 콩을 삶으니, 같은 뿌리에서 났건만 어찌 이리 급히 볶는가" — *형제*의 *갈등*을 ^찌른^ +애달픈+ 시임.`,`"[마메가라]오 [타이테] [마메]오 [니루], [오나지] [네]카라 [우마레타] [노]니 [나제] [콘나니] [이소이데] [이루]노카" — *쿄-다이*노 *아츠레키*오 ^츠이타^ +세츠나이+ [시]데스.`],
[`같은 해 10월, @조비@는 @헌제@에게 *자리*를 넘기라고 +압박했고+, *선양*이라는 형식으로 ^황제가 됨^.`,`[오나지] [토시]노 [쥬-가츠], @소-히@와 @켄테이@니 *쿠라이*오 [유즈레]토 +앗파쿠시+, *젠조-*토 [이우] [케-시키]데 ^코-테이니 나리마시타^.`],
[`이게 @위나라@의 *탄생* — 4백 년 가까이 이어진 @한나라@ *간판*이 +공식적으로+ ^내려진^ 순간임.`,`[코레]가 @기@노 *탄조-* — [욘햐쿠넨] [치카쿠] [츠즈이타] @칸@노 *칸반*가 +세-시키니+ ^오로사레타^ [슌칸]데스.`],
[`3화에서 아홉 살에 *황제*가 됐던 @헌제@는 30년 넘게 *허수아비*로 살다 +조용히+ ^퇴장함^.`,`[산와]데 [큐-사이]데 *코-테이*니 [낫타] @켄테이@와 [산쥬-넨] [이죠-] *카카시*토시테 [이키], +시즈카니+ ^타이죠-시마시타^.`],
[`이로써 한나라를 이을 *정통*과 *명분*이 +뜨거운 감자+가 ^됨^ — @유비@ 쪽이 가만있을 리 없었음.`,`[코레데] [칸]오 [츠구] *세-토-*토 *타이기메-분*가 +아츠이 테-마+니 ^나리마시타^ — @류-비@[가와]가 [다맛테 이루] [와케]가 [아리마센].`],
[`한편 @조비@ 곁엔 +조용하지만 무서운+ *참모* 하나가 *실력*을 ^쌓고^ 있었음 — 이름은 @사마의@.`,`[잇포-] @소-히@노 [소바]니와 +시즈카다가 오소로시이+ *산보-*가 [히토리] *지츠료쿠*오 ^타쿠와에테^ [이마시타] — [나마에]와 @시바이@.`],
[`@조조@가 생전에 "남의 *신하*로 끝날 *그릇*이 아니다"라며 +경계했던+ 바로 그 남자임.`,`@소-소-@가 [세-젠] "[히토]노 *카신*데 [오와루] *우츠와*데와 [나이]" 토 +케-카이시테 이타+ [마사니] [소노] [오토코]데스.`]

an:`조조`,a:[

m:[`이릉 전투(222)에서 유비가 길게 진영을 펼친 일(위 쪽 기록의 '7백여 리'), 육손의 지구전과 장수들의 불만, 화공으로 40여 진영을 깬 일, 유비의 백제성 퇴각과 탄식(정사 주석), 육손이 위의 침공을 우려해 추격을 멈춘 일은 정사임. 팔진도 미로는 연의임.`],
nx:[`@백제성@ 병상에 누운 @유비@가 @제갈량@을 불러 +믿기 힘든+ *유언*을 ^남김^ — "내 *아들*이 못났으면, 그대가 *대표*를 하시오."`,`@하쿠테-죠-@노 [뵤-쇼-]니 [후시타] @류-비@가 @쇼카츠료-@오 [욘데] +신지가타이+ *유이곤*오 ^노코시마스^ — "[와가] *무스코*가 [오로카]나라, [키미]가 *다이효-*니 [나리나사이]."`]

E[30]={t:`"아들이 못나면 그대가 하라" — 창업자의 마지막 인사`,y:`서기 223년`,prev:`이릉에서 육손의 화공에 대패한 유비가 백제성으로 물러남.`,
s:[
[`223년 봄, @백제성@ *병상*의 @유비@는 *마지막* 면담을 위해 +급히+ @제갈량@을 ^불러들임^.`,`니햐쿠니쥬-산넨노 [하루], @하쿠테-죠-@노 *뵤-쇼-*노 @류-비@와 *사이고*노 [멘단]노 [타메] +이소이데+ @쇼카츠료-@오 ^요비요세마시타^.`],
[`그리고 *후계자* @유선@을 앞에 두고 +믿기 힘든+ *유언*을 ^남김^.`,`[소시테] *코-케-샤* @류-젠@오 [마에]니 +신지가타이+ *유이곤*오 ^노코시마시타^.`],
[`"그대의 *재능*은 @조비@의 열 배요 — 아들이 *보좌*할 만하면 돕고, *그릇*이 안 되면 그대가 +직접+ ^맡으시오^."`,`"[키미]노 *사이노-*와 @소-히@노 [쥬-바이]다 — [무스코]가 *호사*스루니 [아타이]스레바 [타스케], *우츠와*데 [나케레바] [키미]가 +지분데+ ^히키우케요^."`],
[`@제갈량@은 *눈물*을 흘리며 "죽을 때까지 *충성*하겠습니다"라고 +단호하게+ ^맹세함^.`,`@쇼카츠료-@와 *나미다*오 [나가시테] "[시누] [마데] *츄-세-*오 [츠쿠시마스]" 토 +킷파리토+ ^치카이마시타^.`],
[`오너가 *경영권*과 *신뢰*를 동시에 ^넘긴^, +역사상 가장 유명한+ *승계*임.`,`[오-나-]가 *케-에-켄*토 *신라이*오 [도-지니] ^타쿠시타^, +레키시죠- 못토모 유-메-나+ *쇼-케-*데스.`],
[`@유비@는 아들에게도 "*악*이 작다고 하지 말고, *선*이 작다고 안 하지 마라"는 +짧지만 묵직한+ *편지*를 ^남김^.`,`@류-비@와 [무스코]니모 "*아쿠*가 [치이사이] [카라]토 [시테와] [나라나이], *젠*가 [치이사이] [카라]토 [시나이] [노]모 [이케나이]" 토 [이우] +미지카쿠테 오모이+ *테가미*오 ^노코시마시타^.`],
[`223년 4월, 짚신 장수에서 *황제*까지 오른 @유비@는 예순셋에 +조용히+ *눈*을 ^감음^.`,`니햐쿠니쥬-산넨 시가츠, [와라지우리]카라 *코-테이*마데 [노보리츠메타] @류-비@와 로쿠쥬-산사이데 +시즈카니+ *메*오 ^토지마시타^.`],
[`그의 *커리어*는 실패와 *도망*의 연속이었지만, +끝까지+ 사람을 ^버리지 않은^ 리더였음.`,`[카레]노 *캬리아*와 [싯파이]토 *토-보-*노 [렌조쿠]데시타가, +사이고마데+ [히토]오 ^미스테나캇타^ [리-다-]데시타.`],
[`열일곱 @유선@이 즉위하자, @제갈량@은 @승상@으로서 나라의 *실무*와 *책임*을 +전부+ ^떠맡음^.`,`쥬-나나사이노 @류-젠@가 [소쿠이스루]토, @쇼카츠료-@와 @죠-쇼-@토시테 [쿠니]노 *지츠무*토 *세키닌*오 +스베테+ ^히키우케마시타^.`],
[`첫 *결정*은 +의외로+ 원수였던 오나라와의 *재동맹* — 사신 @등지@를 ^보내^ 관계를 회복함.`,`[사이쇼]노 *케츠단*와 +이가이니모+ [아다닷타] @고@토노 *사이도-메-* — [시샤] @토-시@오 ^오쿠리^ [칸케-]오 [카이후쿠시마시타].`],
[`*감정*보다 *생존*을 ^앞세운^ +냉정한+ 리셋이었음 — 이제 남은 *적*은 북쪽의 @위나라@ 하나.`,`*칸죠-*요리 *세-존*오 ^유-센시타^ +레-세-나+ [리셋토]데시타 — [코레데] [노코루] *테키*와 [키타]노 @기@ [히토츠].`],
[`그런데 그 전에 남쪽 @남중@에서 *반란*이 터짐 — 북쪽으로 가려면 +먼저+ *뒷마당*부터 ^정리해야^ 했음.`,`[토코로가] [소노] [마에]니 [미나미]노 @난츄-@데 *한란*가 [오코리마시타] — [키타]에 [무카우]니와 +마즈+ *우라니와*카라 ^카타즈케나케레바^ [나리마센데시타].`]
],
an:`유비`,a:[
[`@유비@는 *능력*보다 *사람*을 ^남긴^ +보기 드문+ 창업자였음.`,`@류-비@와 *노-료쿠*요리 *히토*오 ^노코시타^ +메즈라시이+ [소-교-샤]데시타.`],
[`마지막에 *권한*과 *신뢰*를 통째로 넘긴 그 *결단*이 촉한을 +40년+ 더 ^버티게^ 함.`,`[사이고]니 *켄겐*토 *신라이*오 [마루고토] [타쿠시타] [소노] *케츠단*가 @쇼쿠칸@오 +욘쥬-넨+ [나가쿠] ^모타세마시타^.`]
],
w:[
[`*승계*는 "누가 *지분*을 갖느냐"보다 "누구에게 *신뢰*를 ^주느냐^"가 +핵심+임.`,`*쇼-케-*와 "[다레]가 *모치분*오 [모츠]카"요리 "[다레]니 *신라이*오 ^아타에루^카"가 +카나메+데스.`],
[`큰 *실패* 뒤엔 *감정*을 접고 +과감하게+ 관계를 ^리셋해야^ 다시 출발할 수 있음.`,`[오-키나] *싯파이*노 [아토]와 *칸죠-*오 [오사메테] +다이탄니+ [칸케-]오 ^리셋토시나케레바^ [사이슛파츠]데키마센.`]
],
m:[`백제성 탁고와 "그대가 직접 맡으라(君可自取)", 제갈량의 맹세, 유비가 아들에게 남긴 유언(정사 주석), 유비 사망(223년 4월, 63세), 유선 즉위, 등지 파견과 오와의 재동맹, 남중 반란은 정사임.`],
nx:[`남쪽 반란군 *리더* @맹획@을 일곱 번 잡고 일곱 번 ^풀어줌^ — @제갈량@의 +황당한+ *M&A* 전략이 시작됨.`,`[미나미]노 [한란군]노 *리-다-* @모-카쿠@오 [나나도] [토라에테] [나나도] ^하나시^ — @쇼카츠료-@노 +토호-모나이+ *엠안도에-* [센랴쿠]가 [하지마리마스].`]
};
E[31]={t:`일곱 번 잡고 일곱 번 풀어준 남자 — 마음을 사는 M&A`,y:`서기 225년`,prev:`유비가 백제성에서 제갈량에게 나라를 맡기고 세상을 떠남. 제갈량은 오와 다시 손잡음.`,
s:[
[`225년, @제갈량@은 북벌 전에 +직접+ *남쪽*의 *반란*을 정리하러 ^출정함^.`,`니햐쿠니쥬-고넨, @쇼카츠료-@와 [호쿠바츠]노 [마에]니 +미즈카라+ *미나미*노 *한란*오 [시즈메니] ^슛세-시마시타^.`],
[`떠날 때 젊은 *참모* @마속@이 +핵심을 찌르는+ *조언*을 ^던짐^ — "*성*을 치기보다 *마음*을 치는 게 상책입니다."`,`[슛파츠]노 [사이], [와카이] *산보-* @바쇼쿠@가 +카쿠신오 츠쿠+ *죠겐*오 ^시마시타^ — "*시로*오 [세메루]요리 *코코로*오 [세메루] [노]가 [죠-사쿠]데스."`],
[`반란군의 *리더*는 @맹획@ — 현지인에게 +인기 많은+ *카리스마형* 우두머리였음.`,`[한란군]노 *리-다-*와 @모-카쿠@ — [겐치]노 [히토비토]니 +닌키노 아루+ *카리스마 타이푸*노 [카시라]데시타.`],
[`@제갈량@은 @맹획@을 *포로*로 잡자 +일부러+ 자기 *진영*을 구경시켜 주고 ^풀어줌^.`,`@쇼카츠료-@와 @모-카쿠@오 *호료*니 [스루]토, +와자토+ [지분]노 *진에이*오 [켄부츠사세테] ^하나시마시타^.`],
[`@맹획@은 "*진영*을 알았으니 다음엔 이긴다"며 +당당하게+ 돌아갔지만, 또 ^잡힘^ㅋㅋ — *자신감*만 넘쳤음.`,`@모-카쿠@와 "*진에이*오 [싯타] [카라] [츠기]와 [카츠]" 토 +도-도-토+ [카에리마시타]가, [마타] ^츠카마리마시타^ — *지신*다케와 [아리마시타].`],
[`이걸 일곱 번 *반복*해서 이른바 @칠종칠금@ — 마지막엔 @맹획@이 +진심으로+ *항복*을 ^선언함^.`,`[코레]오 [나나카이] *쿠리카에시*테 [이와유루] @시치쇼-시치킨@ — [사이고]니와 @모-카쿠@가 +코코로카라+ *코-후쿠*오 ^센겐시마시타^.`],
[`"@승상@의 *위엄*은 하늘 같으니, 남쪽 사람들은 다시는 *배신*하지 않겠습니다."`,`"@죠-쇼-@노 *이겐*와 [텐]노 [요-]데스, [미나미]노 [모노]와 [니도토] *우라기리*마센."`],
[`더 +놀라운+ 건 그다음 — @제갈량@은 점령지에 *관리*를 두지 않고 현지 *리더*들에게 *자치*를 ^맡김^.`,`[못토] +오도로쿠베키+ [노]와 [소노] [아토] — @쇼카츠료-@와 [센료-치]니 *칸리*오 [오카즈], [겐치]노 *리-다-*타치니 *지치*오 ^마카세마시타^.`],
[`남의 땅을 *인수*하면서 +기존 경영진+을 그대로 ^살려두는^ 영리한 *PMI* 전략임.`,`[타닌]노 [토치]오 *바이슈-*시나가라 +키존노 케-에-진+오 [소노마마] ^이카시테 오쿠^ [카시코이] *피-에무아이* [센랴쿠]데스.`],
[`덕분에 남쪽에서 *세금*과 *물자*, *병력*이 +꾸준히+ 북벌 *자금*으로 ^흘러들어옴^.`,`[오카게]데 [미나미]카라 *제-킨*토 *붓시*, *헤-료쿠*가 +코츠코츠토+ [호쿠바츠]노 *시킨*토시테 ^나가레콘데 키마시타^.`],
[`이제 *뒷마당*은 +깔끔하게+ 정리됐고, @제갈량@의 *시선*은 오직 북쪽 @위나라@로 ^향함^.`,`[코레데] *우라니와*와 +킨레-니+ [카타즈키], @쇼카츠료-@노 *시센*와 [타다] [키타]노 @기@에 ^무카이마시타^.`]
],
an:`제갈량`,a:[
[`@제갈량@은 *무력*으로 누르는 대신 *마음*을 사서, +비용은 적게+ ^오래가는^ 안정을 만들었음.`,`@쇼카츠료-@와 *부료쿠*데 [오사에루] [카와리]니 *코코로*오 [카이], +코스토오 오사에테+ ^나가쿠 츠즈쿠^ [안테-]오 [츠쿠리마시타].`],
[`근데 이 *조언*을 준 @마속@이, 나중엔 그의 가장 +뼈아픈+ *실패*가 ^됨^.`,`[데모] [코노] *죠겐*오 [쿠레타] @바쇼쿠@가 [노치]니 [카레]노 [못토모] +이타이+ *싯파이*니 ^나리마스^.`]
],
w:[
[`*M&A* 후엔 상대 조직의 *리더*를 바꾸기보다 +내 편으로+ ^만드는^ 게 싸게 먹힘.`,`*엠안도에-*노 [아토]와 [아이테]노 [소시키]노 *리-다-*오 [카에루]요리 +미카타니+ ^스루^ [호-]가 [야스쿠] [츠키마스].`],

[`"*식사*는 조금 하시고, 곤장 스무 대 이상의 일은 +전부 직접+ *결재*하십니다."`,`"*쇼쿠지*와 [스코시]데, [쥬-바츠] [니쥬-] [이죠-]노 [켄]와 +스베테 지분데+ *켓사이*나사이마스."`],

[`모든 걸 혼자 *결재*한 *리더십*이 +결국+ 리더 자신을 ^태워버린^ 거임 — 원조 *번아웃*임.`,`[스베테]오 [히토리]데 *켓사이*시타 *리-다-십푸*가 +켓쿄쿠+ [리-다-] [지신]오 ^모야시츠쿠시타^노데스 — [간소]노 *반아우토*데스.`],

[`@사마의@는 그 진영 터를 둘러보고 "천하의 *기재*로다"라며 +진심으로+ ^감탄함^ — *라이벌*에 대한 마지막 *존중*이었음.`,`@시바이@와 [소노] [진에이]노 [아토]오 [미테 마와리], "[텐카]노 *키사이*다" 토 +코코로카라+ ^칸탄시마시타^ — *라이바루*에노 [사이고]노 *손케-*데시타.`]

[`근데 @조상@은 곧 *인사권*을 휘둘러 @사마의@를 +명예직으로+ 밀어내고 *실권*을 ^독점함^.`,`[데모] @소-소-@와 [스구니] *진지켄*오 [후리마와시], @시바이@오 +메-요쇼쿠니+ [오시야리], *짓켄*오 ^도쿠센시마시타^.`],

[`"*노망*이 났더라"는 *보고*에 @조상@은 +완전히+ ^방심함^.`,`"*보케*가 [하지맛테 이타]" 토 [이우] *호-코쿠*니 @소-소-@와 +칸젠니+ ^유단시마시타^.`],
[`249년 정월, @조상@이 *황제*를 모시고 @고평릉@ *성묘*를 간 사이, @사마의@가 +번개같이+ *수도*를 ^장악함^.`,`니햐쿠욘쥬-큐-넨노 [쇼-가츠], @소-소-@가 *코-테이*오 [오토모]시테 @코-헤-료-@에 *하카마이리*니 [잇타] [스키]니, @시바이@가 +이나즈마노 요-니+ *슈토*오 ^쇼-아쿠시마시타^.`],

[`*참모*들이 "황제를 끼고 싸우라"고 말렸지만, @조상@은 +순순히+ *항복*을 ^택함^ — "부자로 살면 그만"이라며.`,`*산보-*타치와 "[코-테이]오 [이타다이테] [타타카에]" 토 [토메마시타]가, @소-소-@와 +스나오니+ *코-후쿠*오 ^에라비마시타^ — "[카네모치]데 [이라레레바] [이이]" 토.`],
[`그리고 며칠 뒤, @조상@ 일가는 *반역* *혐의*로 +몰살당함+ — *약속*은 ^휴지 조각^이었음.`,`[소시테] [스-지츠고], @소-소-@노 [이치조쿠]와 *무혼*노 *켄기*데 +미나고로시니 사레+ — *야쿠소쿠*와 ^카미쿠즈^데시타.`],
[`이걸로 위나라 *실권*은 +완전히+ 사마씨 *가문*으로 ^넘어감^ — @조조@가 한나라에 했던 일을 이제 사마씨가 조씨에게 하는 거임.`,`[코레데] @기@노 *짓켄*와 +칸젠니+ [시바시]노 *이치몬*니 ^우츠리마시타^ — @소-소-@가 [칸]니 [시타] [코토]오, [이마도]와 [시바시]가 [소-시]니 [스루]노데스.`]

[`"@사마소@의 *속셈*은 길 가는 *사람*도 다 안다!" — 260년, 그는 +겨우+ 수백 명을 이끌고 직접 ^쳐들어감^.`,`"@시바쇼-@노 *하라*와 [미치]오 [유쿠] *히토*데사에 [싯테 이루]!" — 니햐쿠로쿠쥬-넨, [카레]와 +와즈카+ [스-햐쿠닌]오 [히키이테] [미즈카라] ^세메코미마시타^.`],

E[37]={t:`담요 덮고 절벽을 굴러 내려온 남자, 그리고 "여기가 즐거워서요"`,y:`서기 263~264년`,prev:`사마소가 위나라를 장악했고, 촉은 강유의 무리한 북벌과 내부 부패로 지쳐감.`,
s:[

[`@강유@는 *요새* @검각@에서 @종회@의 대군을 +철벽처럼+ ^막아냄^ — 정면으론 *돌파*가 불가능했음.`,`@쿄-이@와 *요-사이* @켄카쿠@데 @쇼-카이@노 [다이군]오 +텟페키노 요-니+ ^후세기마시타^ — [쇼-멘]카라노 *톳파*와 [후카노-]데시타.`],

[`수도 앞을 지키던 @제갈량@의 아들 @제갈첨@은 +끝까지+ 싸우다 아들과 함께 ^전사함^ — *명가*의 마지막 *자존심*이었음.`,`[슈토]노 [마에]오 [마못테 이타] @쇼카츠료-@노 [무스코] @쇼카츠센@와 +사이고마데+ [타타카이], [무스코]토 [토모]니 ^센시시마시타^ — *메-몬*노 [사이고]노 *프라이도*데시타.`],
[`성안의 @유선@은 *회의* 끝에 싸우지 않고 +순순히+ *항복*을 ^선언함^ — @유비@가 세운 나라는 43년 만에 문을 닫음.`,`[죠-나이]노 @류-젠@와 *카이기*노 [스에], [타타카와즈니] +스나오니+ *코-후쿠*오 ^센겐시마시타^ — @류-비@가 [타테타] [쿠니]와 [욘쥬-산넨]데 [마쿠]오 [토지마시타].`],

[`이듬해 @낙양@으로 끌려간 @유선@에게 @사마소@가 촉 *음악*을 틀어주며 +슬쩍+ ^떠봄^ — "*고향* 생각 안 나오?"`,`[요쿠넨] @라쿠요-@니 [츠레테 이카레타] @류-젠@니, @시바쇼-@가 @쇼쿠@노 *온가쿠*오 [나가시테] +사리게나쿠+ ^사구리오 이레마시타^ — "*코쿄-*가 [코이시쿠] [나이]카?"`],
[`@유선@의 *대답*은 +충격적이었음+ — "여기가 즐거워서 촉 *생각*은 안 납니다."`,`@류-젠@노 *코타에*와 +쇼-게키테키데시타+ — "[코코]가 [타노시쿠테] @쇼쿠@노 *코토*와 [오모이다시마센]."`],
[`@사마소@조차 +어이없어했다는+ 이 한마디로, @유선@은 오히려 *목숨*과 *노후*를 ^보장받음^ — 바보였는지 *생존 전략*이었는지는 아직도 *논쟁*임.`,`@시바쇼-@데사에 +아키레타토 이우+ [코노] [히토코토]데, @류-젠@와 [교쿠니] *이노치*토 *로-고*오 ^호쇼-사레마시타^ — [오로카]닷타노카 *세-존 센랴쿠*닷타노카와 [이마데모] *론소-*데스.`]

an:`등애`,a:[

[`*리더*가 가장 위험한 *구간*을 먼저 ^가면^, 팀은 +두려움 없이+ 따라옴.`,`*리-다-*가 [이치반] [키켄나] *쿠칸*오 [사키]니 ^이케바^, [치-무]와 +오소레즈니+ [츠이테 키마스].`]

an:`조조·유비·손권`,a:[
[`@조조@는 *시스템*, @유비@는 *사람*, @손권@은 *균형*으로 각자의 회사를 +끝까지+ ^키웠음^.`,`@소-소-@와 *시스테무*, @류-비@와 *히토*, @손켄@와 *바란스*데 [소레조레]노 [카이샤]오 +사이고마데+ ^소다테마시타^.`],
[`그리고 셋 다 *후계*에서 +흔들렸다는+ 공통점이 ^있음^ — 창업보다 *승계*가 더 어렵다는 증거임.`,`[소시테] [산닌]토모 *아토츠기*데 +유라이다+ [토이우] [쿄-츠-텐]가 ^아리마스^ — [소-교-]요리 *쇼-케-*노 [호-]가 [무즈카시이] [쇼-코]데스.`]
],
w:[
[`백 년 드라마의 결론 — *창업*은 영웅이 하지만, 회사를 ^완성하는^ 건 +끝까지 버틴+ *조직*임.`,`[햐쿠넨]노 [도라마]노 [케츠론] — *소-교-*와 [에-유-]가 [시마스]가, [카이샤]오 ^칸세-사세루^ [노]와 +사이고마데 타에타+ *소시키*데스.`],
[`그러니 *인재*를 키우고, *승계*를 설계하고, *신뢰*를 ^지키는^ 것 — 이게 40화를 관통한 +단 하나의+ *교훈*임.`,`[다카라] *진자이*오 [소다테], *쇼-케-*오 [세켄시], *신라이*오 ^마모루^ [코토] — [코레]가 [욘쥬-와]오 [츠라누이타] +타닷타 히토츠노+ *쿄-쿤*데스.`]
],
chart:[`위 (220~265) — 조조가 기반을 만들고 조비가 세운 나라. 결국 신하였던 사마씨에게 같은 방식으로 넘어감.`,`촉한 (221~263) — 유비가 세우고 제갈량이 버틴 나라. 등애의 기습으로 멸망했고, 유선은 낙양에서 여생을 보냄.`,`오 (229~280) — 손견·손책·손권 3대가 세운 나라. 손권은 229년 황제를 칭함. 후계 분쟁과 손호의 폭정 끝에 마지막으로 멸망.`,`진 (265~) — 사마의·사마사·사마소·사마염이 만든 나라. 280년 천하통일.`,`엔딩 — 184년 황건적의 난부터 280년 통일까지 약 1백 년. 삼국의 창업자 누구도 최종 승자가 되지 못함.`],
m:[`손권 말년의 후계 분쟁(이궁의 변)과 육손의 울분 속 죽음(245), 손권 사망(252), 손호 즉위(264)와 폭정, 양호·두예·왕준의 오 정벌 준비, 두예의 '파죽지세', 쇠사슬을 횃불로 녹인 일, 손호의 항복(280년 3월)은 정사임.`,`연의는 마지막 회를 "천하의 대세는 나뉜 지 오래면 합쳐지고, 합쳐진 지 오래면 나뉜다"는 첫 회의 말과 수미상관으로 맺음.`],
nx:[`40화 *완주*를 축하함 — 이제 *1화*부터 다시 읽으면, 짚신 장수가 +전혀 다르게+ ^보일^ 거임.`,`[욘쥬-와] *칸소-*, [오메데토-] [고자이마스] — [이마] *다이이치와*카라 [요미나오스]토, [와라지우리]가 +맛타쿠 치갓테+ ^미에루^ [하즈]데스.`]
};
