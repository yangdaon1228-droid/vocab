const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(s,tap){return esc(s).replace(/\[([^\]]+)\]/g,(m,w)=>tap?`<span class="w" data-w="${w}">${w}</span>`:w).replace(/@([^@]+)@/g,'<span class="p">$1</span>').replace(/\*([^*]+)\*/g,(m,w)=>tap?`<span class="n" data-w="${w}">${w}</span>`:`<span class="n">${w}</span>`).replace(/\^([^^]+)\^/g,(m,w)=>tap?`<span class="v" data-w="${w}">${w}</span>`:`<span class="v">${w}</span>`).replace(/\+([^+]+)\+/g,(m,w)=>tap?`<span class="a" data-w="${w}">${w}</span>`:`<span class="a">${w}</span>`);}
function plain(s){return s.replace(/[@*^+]/g,'');}
const SVG_BM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';
const SVG_BM_ON='<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';
const SVG_X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const CLS_COLOR={n:'var(--pink)',v:'var(--blue)',a:'var(--green)',x:'var(--sub)'};
function look(cls,w){if(typeof GD!=='undefined'&&GD[w])return GD[w];const d=lookup(cls,w);return d?Object.assign({type:cls==='w'?'x':cls},d):null;}
const CLS_NAME={n:'명사',v:'동사',a:'형용사'};
function wkey(e){return e.base+'|'+e.mean;}
function isWord(k){return st.words.some(w=>w.key===k);}
function isMarked(id){return st.bm.some(b=>b.id===id);}
function card(id,pair){const on=isMarked(id);return `<div class="card" id="${id}"><button class="mark${on?' on':''}" type="button" aria-label="책갈피" data-id="${id}">${on?SVG_BM_ON:SVG_BM}</button><p class="k">${fmt(pair[0],false)}</p><p class="j">(${fmt(pair[1],true)})</p></div>`;}
function render(){
  const n=st.ep,e=E[n-1];
  let h=`<p class="meta">제${n}화 / 전 40화 · ${e.y}</p><h1>${esc(e.t)}</h1>`;
  if(e.prev)h+=`<div class="prev"><b>지난 이야기</b>${esc(e.prev)}</div>`;
  h+=`<p class="legend"><span class="p">회색</span> 고유명사·직책 · <span class="n">핑크</span> 명사 · <span class="v">파랑</span> 동사 · <span class="a">초록</span> 형용사·상태<br>일본어 줄의 단어를 탭하면 연핑크 형광펜과 함께 단어장에 저장돼요.</p>`;
  e.s.forEach((p,i)=>h+=card(`e${n}-s${i}`,p));
  h+=`<div class="sec">인간 해부 · ${esc(e.an)}</div>`;e.a.forEach((p,i)=>h+=card(`e${n}-a${i}`,p));
  h+=`<div class="sec">오늘의 무기</div>`;e.w.forEach((p,i)=>h+=card(`e${n}-w${i}`,p));
  if(e.chart){h+=`<div class="sec">${n}화 정리 · 인물 관계와 세력도</div>`;e.chart.forEach(t=>{const i=t.indexOf(' — ');h+=`<div class="chart"><b>${esc(t.slice(0,i))}</b>${esc(t.slice(i+3))}</div>`;});}h+=`<div class="sec">정사 vs 연의</div>`;e.m.forEach(t=>h+=`<p class="memo">${esc(t)}</p>`);
  h+=`<div class="sec">다음 화 예고</div>`+card(`e${n}-x0`,e.nx);
  h+=`<div class="nav"><button type="button" id="pv">← 이전 화</button><button type="button" id="nv">${n>=E.length?'다음 화 준비 중':'다음 화 →'}</button></div>`;
  $('ep').innerHTML=h;
  $('pv').disabled=n<=1;$('nv').disabled=n>=E.length;$('pvT').disabled=n<=1;
  $('pv').onclick=()=>go(n-1);$('nv').onclick=()=>go(n+1);
  $('epLbl').textContent=`제${n}화`;
  paintHL();renderEps();renderBm();renderVb();
}
function paintHL(){document.querySelectorAll('.j [data-w]').forEach(el=>{const cls=el.className.split(' ')[0];const d=look(cls,el.dataset.w);el.classList.toggle('hl',!!(d&&isWord(wkey(d))));});}
let tt;function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),1400);}
function tapWord(el){const c0=el.className.split(' ')[0];const d=look(c0,el.dataset.w);if(!d)return;const cls=d.type||c0;const k=wkey(d);if(isWord(k)){st.words=st.words.filter(w=>w.key!==k);toast(`단어장에서 뺐어요 · ${d.base}`);}else{st.words.unshift({key:k,cls,base:d.base,mean:d.mean,rows:d.rows,ep:st.ep});toast(`단어장에 저장했어요 · ${d.base}`);}save();paintHL();renderVb();}
function renderEps(){let h='';for(let i=1;i<=E.length;i++)h+=`<button type="button" class="eprow${i===st.ep?' on':''}" data-ep="${i}"><b>${i}화</b><span>${esc(E[i-1].t)}</span></button>`;$('epGrid').innerHTML=h;$('epGrid').querySelectorAll('button').forEach(b=>b.onclick=()=>{closePanels();go(+b.dataset.ep);});}
function findPair(id){const m=id.match(/^e(\d+)-([sawx])(\d+)$/);if(!m)return null;const e=E[+m[1]-1];if(!e)return null;const p=m[2]==='x'?e.nx:e[m[2]][+m[3]];return p?{ep:+m[1],p}:null;}
function toggleMark(id){if(isMarked(id))st.bm=st.bm.filter(b=>b.id!==id);else{const f=findPair(id);if(!f)return;st.bm.unshift({id,ep:f.ep,txt:plain(f.p[0]).slice(0,44)});toast('책갈피에 저장했어요');}save();const el=document.querySelector(`.mark[data-id="${id}"]`);if(el){const on=isMarked(id);el.classList.toggle('on',on);el.innerHTML=on?SVG_BM_ON:SVG_BM;}renderBm();}
function renderBm(){$('bmCnt').textContent=st.bm.length;const L=$('bmList');if(!st.bm.length){L.innerHTML='<div class="empty">문장 카드 오른쪽 위 리본을 누르면 여기에 모여요.</div>';return;}L.innerHTML=st.bm.map(b=>`<div class="bm"><a href="#" data-id="${b.id}"><small>${b.ep}화</small>${esc(b.txt)}…</a><button class="x" type="button" aria-label="삭제" data-del="${b.id}">${SVG_X}</button></div>`).join('');L.querySelectorAll('a').forEach(a=>a.onclick=ev=>{ev.preventDefault();jump(a.dataset.id);});L.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>toggleMark(b.dataset.del));}
let vf='all';
function renderVb(){$('vbCnt').textContent=st.words.length;const cats=[['all','전체'],['n','명사'],['v','동사'],['a','형용사'],['x','기타']];$('vbChips').innerHTML=cats.map(([k,t])=>{const c=k==='all'?st.words.length:st.words.filter(w=>w.cls===k).length;return `<button type="button" class="${vf===k?'on':''}" data-f="${k}">${t} ${c}</button>`;}).join('');$('vbChips').querySelectorAll('button').forEach(b=>b.onclick=()=>{vf=b.dataset.f;renderVb();});const list=st.words.filter(w=>vf==='all'||w.cls===vf);$('vbInfo').textContent=`${st.words.length}개`;if(!list.length){$('vbList').innerHTML='<div class="empty">본문 일본어 줄의 단어를 탭하면 카드로 저장돼요. 다시 탭하면 빠져요.</div>';return;}$('vbList').innerHTML=list.map(w=>`<div class="vc" style="--c:${CLS_COLOR[w.cls]}"><button class="x" type="button" aria-label="삭제" data-k="${esc(w.key)}">${SVG_X}</button><p class="b">${esc(w.base)}</p><p class="m">${esc(w.mean)}</p><div class="rows">${w.rows.map(r=>`<div class="r"><span>${esc(r[0])}</span><span>${esc(r[1])} <em>· ${esc(r[2])}</em></span></div>`).join('')}</div></div>`).join('');$('vbList').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{st.words=st.words.filter(w=>w.key!==b.dataset.k);save();renderVb();paintHL();});}
function closePanels(){['epPanel','bmPanel','vbPanel','bkPanel'].forEach(p=>$(p).classList.remove('show'));}
function togglePanel(id){const open=$(id).classList.contains('show');closePanels();if(!open)$(id).classList.add('show');}
function jump(id){const f=findPair(id);if(!f)return;closePanels();if(st.ep!==f.ep){st.ep=f.ep;save();render();}const el=$(id);if(el){const top=el.getBoundingClientRect().top+window.scrollY-document.querySelector('.top').offsetHeight-16;window.scrollTo({top,behavior:'smooth'});el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),1800);}}
function go(n){if(n<1||n>E.length)return;st.ep=n;save();try{history.replaceState(null,'','#ep'+n);}catch(e){}render();window.scrollTo(0,0);}
function setMode(m){st.mode=m;save();$('m0').classList.toggle('on',m===0);$('m1').classList.toggle('on',m===1);$('app').classList.toggle('ko',m===1);}
$('m0').onclick=()=>setMode(0);$('m1').onclick=()=>setMode(1);
$('epBtn').onclick=()=>{togglePanel('epPanel');const c=$('epGrid').querySelector('.on');if(c&&$('epPanel').classList.contains('show')){const L=$('epGrid');L.scrollTop=c.offsetTop-L.offsetTop-L.clientHeight/2+c.clientHeight/2;}};$('bkBtn').onclick=()=>togglePanel('bkPanel');$('bmBtn').onclick=()=>togglePanel('bmPanel');$('vbBtn').onclick=()=>togglePanel('vbPanel');
$('pvT').onclick=()=>go(st.ep-1);
$('ep').addEventListener('click',ev=>{const w=ev.target.closest('.j [data-w]');if(w){tapWord(w);return;}const m=ev.target.closest('.mark');if(m)toggleMark(m.dataset.id);});
const hm=(location.hash||'').match(/^#ep(\d+)$/);if(hm&&+hm[1]>=1&&+hm[1]<=E.length)st.ep=+hm[1];
if(st.ep>E.length||st.ep<1)st.ep=1;
setMode(st.mode);render();
window.addEventListener('hashchange',()=>{const m=(location.hash||'').match(/^#ep(\d+)$/);if(m&&+m[1]!==st.ep)go(+m[1]);});

function bkData(){return JSON.stringify({app:'samguk40',v:1,date:new Date().toISOString(),ep:st.ep,mode:st.mode,bm:st.bm,words:st.words});}
function bkMsg(t){$('bkMsg').textContent=t;}
function restore(txt){let d;try{d=JSON.parse(txt.trim());}catch(e){bkMsg('백업 내용을 읽을 수 없어요. 복사한 내용 전체가 들어갔는지 확인해 주세요.');return;}
 if(!d||d.app!=='samguk40'){bkMsg('이 페이지의 백업이 아니에요.');return;}
 const wk=new Set(st.words.map(w=>w.key));let nw=0,nb=0;(d.words||[]).forEach(w=>{if(w&&w.key&&!wk.has(w.key)){st.words.push(w);wk.add(w.key);nw++;}});
 const bk=new Set(st.bm.map(b=>b.id));(d.bm||[]).forEach(b=>{if(b&&b.id&&!bk.has(b.id)){st.bm.push(b);bk.add(b.id);nb++;}});
 if(d.ep&&d.ep>=1&&d.ep<=E.length)st.ep=d.ep;save();render();bkMsg(`복원했어요 · 단어 ${nw}개, 책갈피 ${nb}개 추가 (이미 있던 건 그대로 둠)`);}
$('bkDown').onclick=()=>{let framed=false;try{framed=window.self!==window.top;}catch(e){framed=true;}if(framed){bkMsg('이 미리보기 화면에서는 파일 저장이 막혀 있어요. GitHub 주소에서 열면 돼요. 지금은 "백업 내용 복사"를 써 주세요.');return;}try{const b=new Blob([bkData()],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');const d=new Date();a.href=u;a.download=`samguk-backup-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);bkMsg('백업 파일을 저장했어요. 아이폰은 "파일" 앱 다운로드 폴더에 들어가요.');}catch(e){bkMsg('이 화면에서는 파일 저장이 막혀 있어요. "백업 내용 복사"를 써 주세요.');}};
$('bkUp').onclick=()=>$('bkFile').click();
$('bkFile').onchange=ev=>{const f=ev.target.files&&ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restore(String(r.result));r.readAsText(f);ev.target.value='';};
$('bkCopy').onclick=async()=>{const t=bkData();try{await navigator.clipboard.writeText(t);bkMsg('백업 내용을 복사했어요. 메모 앱 등에 붙여넣어 보관하세요.');}catch(e){$('bkPasteBox').style.display='block';$('bkText').value=t;$('bkText').select();bkMsg('자동 복사가 안 돼서 아래 칸에 내용을 띄웠어요. 길게 눌러 전체 복사하세요.');}};
$('bkPasteBtn').onclick=()=>{const b=$('bkPasteBox');b.style.display=b.style.display==='none'?'block':'none';$('bkText').value='';};
$('bkApply').onclick=()=>restore($('bkText').value);

</script>
</body>
</html>
