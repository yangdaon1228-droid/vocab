<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>일본어 스피킹 3000</title>
<style>
html{background:#f5fbfa;}
:root{
  --ink:#1c2b2a; --sub:#6f8683; --line:#dbeae7; --bg:#f5fbfa; --card:#fff;
  --done:#0e9488; --done-bg:#e6f7f4; --done-line:#b9e6dd;
  --hl:#e2673d; --hl-bg:#fdece4; --hl-line:#f4c3ac;
  --chip-on:#0e9488;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{min-height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;
  font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;}
header{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:10px 12px 8px;}
h1{font-size:15px;margin:0 0 8px;font-weight:800;color:#0e8f83;}
h1 small{color:var(--sub);font-weight:600;}
.searchrow{display:flex;gap:6px;}
#q{flex:1;padding:11px 13px;font-size:16px;border:1.5px solid var(--line);
  border-radius:12px;background:var(--card);outline:none;color:var(--ink);}
#q:focus{border-color:var(--hl);}
.toolrow{display:flex;gap:7px;margin-top:7px;}
#exportBtn,#importBtn,#resetBtn{flex:1;padding:9px 0;border-radius:12px;border:1.5px solid;
  font-size:12.5px;font-weight:700;background:var(--card);}
#exportBtn{color:#0e8f83;border-color:#b9e6dd;background:#eafaf7;}
#importBtn{color:#0e8f83;border-color:#b9e6dd;background:#eafaf7;}
#resetBtn{color:#c2542f;border-color:#f4c3ac;background:#fdf1ea;flex:0 0 auto;padding:9px 14px;}
.rowlabel{font-size:10.5px;color:var(--sub);font-weight:800;margin:8px 0 3px 2px;}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1.2px solid var(--line);
  background:var(--card);font-size:12.5px;font-weight:700;color:var(--sub);white-space:nowrap;}
.chip.on{background:var(--chip-on);color:#fff;border-color:var(--chip-on);}
.chip.hlchip.on{background:var(--hl);border-color:var(--hl);}
.chip .n{opacity:.75;font-weight:600;margin-left:3px;}
.progwrap{padding:8px 2px 0;}
.progtext{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;margin-bottom:4px;}
.progbar{height:7px;background:#dcf3ef;border-radius:5px;overflow:hidden;}
.progfill{height:100%;background:linear-gradient(90deg,#0e9488,#e2673d);width:0%;transition:width .25s;}
main{padding:8px 10px 90px;max-width:1000px;margin:0 auto;background:var(--bg);}
.grid{display:grid;grid-template-columns:1fr;gap:9px;}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr;}}
@media(min-width:1020px){.grid{grid-template-columns:1fr 1fr 1fr;}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:12px 13px;position:relative;}
.card.done{background:var(--done-bg);border-color:var(--done-line);}
.card.hl{border-color:var(--hl);box-shadow:0 0 0 1.5px var(--hl) inset;background:var(--hl-bg);}
.card.done.hl{background:linear-gradient(135deg,var(--hl-bg),var(--done-bg));}
.rank{position:absolute;top:8px;right:10px;font-size:10.5px;color:var(--sub);font-weight:700;}
.part-tag{display:inline-block;font-size:9.5px;font-weight:800;color:#0c7f74;
  background:#e2f6f2;border-radius:6px;padding:1.5px 6px;margin-bottom:5px;}
.kr{font-size:22px;font-weight:900;line-height:1.25;margin-right:6px;color:#1c2b2a;}
.ro{font-size:12.5px;color:var(--sub);font-style:italic;}
.mean{margin-top:4px;font-size:14.5px;color:#3a4e4b;}
.ex{margin-top:6px;font-size:12.8px;color:#728b87;line-height:1.5;
  border-left:2.5px solid var(--hl-line);padding-left:7px;}
.btnrow{display:flex;gap:6px;margin-top:9px;}
.abtn{flex:1;padding:7px 0;border-radius:10px;border:1.2px solid var(--line);
  background:#fff;font-size:12.5px;font-weight:700;color:var(--sub);}
.abtn.done-on{background:var(--done);border-color:var(--done);color:#fff;}
.abtn.hl-on{background:var(--hl);border-color:var(--hl);color:#fff;}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px;}
.pager{display:flex;justify-content:center;align-items:center;gap:10px;padding:16px 0 6px;flex-wrap:wrap;}
.pgbtn{padding:8px 14px;border-radius:10px;border:1.2px solid var(--line);
  background:#fff;font-size:13px;font-weight:700;color:var(--ink);}
.pgbtn:disabled{opacity:.35;}
.pgbtn.on{background:var(--chip-on);color:#fff;border-color:var(--chip-on);}
#pageInfo{font-size:12.5px;color:var(--sub);}
footer{text-align:center;padding:10px;font-size:11px;color:var(--sub);background:var(--bg);}
</style>
<script>window.VOCAB_DATA = [{"id":1,"kr":"지칸","ro":"jikan","mean":"시간","part":"일상·관계","ex":"지칸 니 츠이테 모오 스코시 쿠와시쿠 하나시테 쿠다사이.<br>= 시간에 대해 조금 더 자세히 말해 주세요."},{"id":2,"kr":"히츠요오","ro":"hitsuyō","mean":"필요","part":"일상·관계","ex":"코노 시료오 데 히츠요오 노 이미 오 카쿠닌 시마시타.<br>= 이 자료에서 필요의 의미를 확인했어요."},{"id":3,"kr":"젠부","ro":"zenbu","mean":"전부","part":"일상·관계","ex":"젠부 니 칸스루 사이신 노 죠오호오 오 시라베마시타.<br>= 전부에 관한 최신 정보를 찾아봤어요."},{"id":4,"kr":"덴와","ro":"denwa","mean":"전화","part":"일상·관계","ex":"콘카이 와 덴와 오 츄우신 니 칸가에마스.<br>= 이번에는 전화를 대화의 중심 주제로 삼아 봐요."},{"id":5,"kr":"몬다이","ro":"mondai","mean":"문제","part":"업무·기획","ex":"민나 데 몬다이 노 요오텐 오 세이리 시마쇼오.<br>= 함께 문제의 요점을 정리해 봅시다."},{"id":6,"kr":"호오코쿠","ro":"hōkoku","mean":"보고","part":"업무·기획","ex":"코노 하나시 와 호오코쿠 토 후카쿠 칸케이 시테이마스.<br>= 이 이야기는 보고와 깊은 관계가 있어요."},{"id":7,"kr":"카조쿠","ro":"kazoku","mean":"가족","part":"일상·관계","ex":"카조쿠 니 츠이테 와 마다 이켄 가 와카레테이마스.<br>= 가족에 대해서는 아직 의견이 갈려요."},{"id":8,"kr":"지켄","ro":"jiken","mean":"사건","part":"뉴스·사회","ex":"지켄 오 리카이 스루 타메 니 레이 오 미마쇼오.<br>= 사건을 이해하기 위해 예를 봅시다."},{"id":9,"kr":"닌겐","ro":"ningen","mean":"인간","part":"일상·관계","ex":"코노 시료오 니 닌겐 노 세츠메이 가 아리마스.<br>= 이 자료에 인간에 대한 설명이 있어요."},{"id":10,"kr":"세카이","ro":"sekai","mean":"세계","part":"뉴스·사회","ex":"세카이 노 하나시 와 아토 데 유쿠리 츠즈케마쇼오.<br>= 세계 이야기는 나중에 천천히 계속해요."},{"id":11,"kr":"켓콘","ro":"kekkon","mean":"결혼","part":"일상·관계","ex":"마즈 켓콘 노 젠타이조오 오 츠카미마쇼오.<br>= 먼저 결혼의 전체 모습을 파악해 봅시다."},{"id":12,"kr":"샤신","ro":"shashin","mean":"사진","part":"일상·관계","ex":"샤신 니 칸스루 시츠몬 오 이치도 세이리 시마스.<br>= 사진에 관한 질문을 한 번 정리할게요."},{"id":13,"kr":"키분","ro":"kibun","mean":"기분","part":"일상·관계","ex":"키분 니 칸시테 아타라시이 시텐 가 우마레마시타.<br>= 기분에 관해 새로운 관점이 생겼어요."},{"id":14,"kr":"칸젠","ro":"kanzen","mean":"완전","part":"감정·추상","ex":"소노 칸젠 와 겐지츠 데모 요쿠 미라레마스.<br>= 그런 완전은 현실에서도 자주 보여요."},{"id":15,"kr":"리카이","ro":"rikai","mean":"이해","part":"감정·추상","ex":"리카이 토 타 노 코오호 오 히카쿠 시테 미마쇼오.<br>= 이해와 다른 후보를 비교해 봅시다."},{"id":16,"kr":"카쿠닌","ro":"kakunin","mean":"확인","part":"업무·기획","ex":"코노 바아이 와 카쿠닌 가 토쿠 니 쥬우요오 데스.<br>= 이 경우에는 확인이 특히 중요해요."},{"id":1 <header>
 <div class="headerInner">

  <div class="toolrow">
    <button id="exportBtn">⬇ 진행상황 백업</button>
    <button id="importBtn">⬆ 백업 복원</button>
    <button id="resetBtn">초기화</button>
    <input id="importFile" type="file" accept="application/json" hidden>
  </div>

  <div class="filters" id="partFilters"></div>
  <div class="rowlabel">상태</div>
  <div class="filters" id="statusFilters"></div>
  <div class="progwrap">
    <div class="progtext"><span id="progText">0/0 (0%)</span><span id="hlCount">하이라이트 0</span></div>
    <div class="progbar"><div class="progfill" id="progFill"></div></div>
  </div>
 </div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyMsg" hidden>검색 결과가 없습니다.</div>
  <div class="pager" id="pager"></div>
</main>
<footer>전체 3,000개 · 진행 상태는 이 브라우저에 저장됩니다</footer>
<script>
const LS_DONE = "speaking3000_progress_done";
const LS_HL   = "speaking3000_progress_hl";
const PAGE_SIZE = 100;

let DATA = window.VOCAB_DATA || [];
let done = new Set(JSON.parse(localStorage.getItem(LS_DONE) || "[]"));
let hl   = new Set(JSON.parse(localStorage.getItem(LS_HL) || "[]"));

let state = { q:"", part:"전체", status:"all", hlOnly:false, page:1 };

function saveDone(){ localStorage.setItem(LS_DONE, JSON.stringify([...done])); }
function saveHl(){ localStorage.setItem(LS_HL, JSON.stringify([...hl])); }

function matches(d){
  if(!state.q && state.part !== "전체" && d.part !== state.part) return false;
  if(state.hlOnly && !hl.has(d.id)) return false;
  if(state.status === "done" && !done.has(d.id)) return false;
  if(state.status === "hide-done" && done.has(d.id)) return false;
  if(state.q){
    const s = (d.kr+d.ro+d.mean+d.ex+d.part).toLowerCase();
    if(!s.includes(state.q.toLowerCase())) return false;
  }
  return true;
}

const PARTS = ["전체", ...Array.from(new Set(DATA.map(d=>d.part)))];

function buildPartFilters(){
  const wrap = document.getElementById("partFilters");
  wrap.innerHTML = "";
  PARTS.forEach(p=>{
    const count = p === "전체" ? DATA.length : DATA.filter(d=>d.part===p).length;
    const b = document.createElement("button");
    b.className = "chip" + (state.part===p ? " on":"");
    b.innerHTML = p + '<span class="n">' + count + '</span>';
    b.onclick = ()=>{ state.part=p; state.page=1; render(); window.scrollTo(0,0); };
    wrap.appendChild(b);
  });
}

function buildStatusFilters(){
  const cats = [
    {key:"all", label:"전체"},
    {key:"hide-done", label:"암기 전만"},
    {key:"done", label:"암기완료만"},
  ];
  const wrap = document.getElementById("statusFilters");
  wrap.innerHTML = "";
  cats.forEach(c=>{
    const b = document.createElement("button");
    b.className = "chip" + (state.status===c.key ? " on":"");
    b.textContent = c.label;
    b.onclick = ()=>{ state.status=c.key; state.page=1; render(); };
    wrap.appendChild(b);
  });
  const hb = document.createElement("button");
  hb.className = "chip hlchip" + (state.hlOnly ? " on":"");
  hb.textContent = "★ 하이라이트만";
  hb.onclick = ()=>{ state.hlOnly = !state.hlOnly; state.page=1; render(); };
  wrap.appendChild(hb);
}

function card(d){
  const isDone = done.has(d.id);
  const isHl = hl.has(d.id);
  const div = document.createElement("div");
  div.className = "card" + (isDone?" done":"") + (isHl?" hl":"");
  div.innerHTML =
    '<div class="rank">#' + d.id + '</div>' +
    '<div class="part-tag">' + d.part + '</div><br>' +
    '<div><span class="kr">' + d.kr + '</span><span class="ro">' + d.ro + '</span></div>' +
    '<div class="mean">' + d.mean + '</div>' +
    '<div class="ex">' + d.ex + '</div>' +
    '<div class="btnrow">' +
      '<button class="abtn ' + (isDone?'done-on':'') + '" data-act="done">' + (isDone?'✓ 암기완료':'암기완료') + '</button>' +
      '<button class="abtn ' + (isHl?'hl-on':'') + '" data-act="hl">' + (isHl?'★ 하이라이트':'☆ 하이라이트') + '</button>' +
    '</div>';
  div.querySelector('[data-act="done"]').onclick = ()=>{
    if(done.has(d.id)) done.delete(d.id); else done.add(d.id);
    saveDone(); render();
  };
  div.querySelector('[data-act="hl"]').onclick = ()=>{
    if(hl.has(d.id)) hl.delete(d.id); else hl.add(d.id);
    saveHl(); render();
  };
  return div;
}

function render(){
  buildPartFilters();
  buildStatusFilters();
  const hits = DATA.filter(matches);
  const totalPages = Math.max(1, Math.ceil(hits.length / PAGE_SIZE));
  if(state.page > totalPages) state.page = totalPages;
  const start = (state.page-1)*PAGE_SIZE;
  const pageItems = hits.slice(start, start+PAGE_SIZE);

  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  document.getElementById("emptyMsg").hidden = pageItems.length !== 0;
  pageItems.forEach(d => grid.appendChild(card(d)));

  const doneCount = DATA.filter(d=>done.has(d.id)).length;
  const pct = DATA.length ? Math.round(doneCount/DATA.length*100) : 0;
  document.getElementById("progText").textContent = doneCount + "/" + DATA.length + " (" + pct + "%)";
  document.getElementById("progFill").style.width = pct + "%";
  document.getElementById("hlCount").textContent = "하이라이트 " + hl.size;
  document.getElementById("totalLabel").textContent = DATA.length + "개";

  const pager = document.getElementById("pager");
  pager.innerHTML = "";
  if(totalPages > 1){
    const mk = (label, page, disabled) => {
      const b = document.createElement("button");
      b.className = "pgbtn"; b.textContent = label; b.disabled = !!disabled;
      b.onclick = ()=>{ state.page = page; render(); window.scrollTo(0,0); };
      return b;
    };
    pager.appendChild(mk("‹ 이전", state.page-1, state.page<=1));
    const info = document.createElement("span");
    info.id = "pageInfo";
    info.textContent = state.page + " / " + totalPages + " 페이지  (총 " + hits.length + "개)";
    pager.appendChild(info);
    pager.appendChild(mk("다음 ›", state.page+1, state.page>=totalPages));
  }
}

document.getElementById("q").addEventListener("input", e=>{
  state.q = e.target.value.trim(); state.page = 1; render();
});
document.getElementById("resetBtn").onclick = ()=>{
  if(confirm("암기완료·하이라이트 기록을 전부 초기화할까요?")){
    done = new Set(); hl = new Set(); saveDone(); saveHl(); render();
  }
};
document.getElementById("exportBtn").onclick = ()=>{
  const payload = JSON.stringify({done:[...done], hl:[...hl], savedAt:new Date().toISOString()});
  const blob = new Blob([payload], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "speaking3000_progress_backup.json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
};
document.getElementById("importBtn").onclick = ()=>{
  document.getElementById("importFile").click();
};
document.getElementById("importFile").addEventListener("change", (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const obj = JSON.parse(ev.target.result);
      const newDone = new Set(obj.done||[]);
      const newHl = new Set(obj.hl||[]);
      if(confirm("백업 파일에서 암기완료 " + newDone.size + "개, 하이라이트 " + newHl.size + "개를 불러옵니다. 덮어쓸까요?")){
        done = newDone; hl = newHl; saveDone(); saveHl(); render();
        alert("복원 완료!");
      }
    }catch(err){
      alert("백업 파일을 읽지 못했습니다.");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

render();
</script>
</body></html>
