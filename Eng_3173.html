<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>다온 영단어장 (3173)</title>
<style>
:root{
  --ink:#1f2733; --sub:#7c8798; --line:#dfe6ee; --bg:#f5f8fb; --card:#fff;
  --done:#2e7d5b; --done-bg:#e9f6ef; --done-line:#b9e2cd;
  --hl:#3860c9; --hl-bg:#edf1fc; --hl-line:#c8d5f5;
  --chip-on:#2e7d5b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;}
header{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:10px 12px 8px;}
h1{font-size:15px;margin:0 0 8px;font-weight:800;color:#1f4fd6;}
h1 small{color:var(--sub);font-weight:600;}
.searchrow{display:flex;gap:6px;}
#q{flex:1;padding:11px 13px;font-size:16px;border:1.5px solid var(--line);
  border-radius:12px;background:var(--card);outline:none;color:var(--ink);}
#q:focus{border-color:var(--hl);}
.toolrow{display:flex;gap:7px;margin-top:7px;}
#exportBtn,#importBtn,#resetBtn{flex:1;padding:9px 0;border-radius:12px;border:1.5px solid;
  font-size:12.5px;font-weight:700;background:var(--card);}
#exportBtn{color:#3860c9;border-color:#c8d5f5;background:#f2f5fd;}
#importBtn{color:#3860c9;border-color:#c8d5f5;background:#f2f5fd;}
#resetBtn{color:#c9463b;border-color:#f0bcb6;background:#fdf3f2;flex:0 0 auto;padding:9px 14px;}
.rowlabel{font-size:10.5px;color:var(--sub);font-weight:800;margin:8px 0 3px 2px;}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1.2px solid var(--line);
  background:var(--card);font-size:12.5px;font-weight:700;color:var(--sub);white-space:nowrap;}
.chip.on{background:var(--chip-on);color:#fff;border-color:var(--chip-on);}
.chip.hlchip.on{background:var(--hl);border-color:var(--hl);}
.chip .n{opacity:.75;font-weight:600;margin-left:3px;}
.progwrap{padding:8px 2px 0;}
.progtext{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;margin-bottom:4px;}
.progbar{height:7px;background:#e3ecf7;border-radius:5px;overflow:hidden;}
.progfill{height:100%;background:linear-gradient(90deg,#2e7d5b,#3860c9);width:0%;transition:width .25s;}
main{padding:8px 10px 90px;max-width:1000px;margin:0 auto;}
.grid{display:grid;grid-template-columns:1fr;gap:9px;}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr;}}
@media(min-width:1020px){.grid{grid-template-columns:1fr 1fr 1fr;}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:12px 13px;position:relative;}
.card.done{background:var(--done-bg);border-color:var(--done-line);}
.card.hl{border-color:var(--hl);box-shadow:0 0 0 1.5px var(--hl) inset;background:var(--hl-bg);}
.card.done.hl{background:linear-gradient(135deg,var(--hl-bg),var(--done-bg));}
.rank{position:absolute;top:8px;right:10px;font-size:10.5px;color:var(--sub);font-weight:700;}
.part-tag{display:inline-block;font-size:9.5px;font-weight:800;color:#2451b8;
  background:#e7edfb;border-radius:6px;padding:1.5px 6px;margin-bottom:5px;}
.en{font-size:20px;font-weight:900;line-height:1.25;margin-right:6px;color:#12213f;}
.ph{font-size:12.5px;color:var(--sub);font-style:italic;}
.mean{margin-top:4px;font-size:14.5px;color:#3a4657;}
.chunk{margin-top:6px;font-size:12.8px;color:#6b7686;line-height:1.5;
  border-left:2.5px solid var(--hl-line);padding-left:7px;}
.btnrow{display:flex;gap:6px;margin-top:9px;}
.abtn{flex:1;padding:7px 0;border-radius:10px;border:1.2px solid var(--line);
  background:#fff;font-size:12.5px;font-weight:700;color:var(--sub);}
.abtn.done-on{background:var(--done);border-color:var(--done);color:#fff;}
.abtn.hl-on{background:var(--hl);border-color:var(--hl);color:#fff;}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px;}
.pager{display:flex;justify-content:center;align-items:center;gap:10px;padding:16px 0 6px;flex-wrap:wrap;}
.pgbtn{padding:8px 14px;border-radius:10px;border:1.2px solid var(--line);
  background:#fff;font-size:13px;font-weight:700;color:var(--ink);}
.pgbtn:disabled{opacity:.35;}
.pgbtn.on{background:var(--chip-on);color:#fff;border-color:var(--chip-on);}
#pageInfo{font-size:12.5px;color:var(--sub);}
footer{text-align:center;padding:10px;font-size:11px;color:var(--sub);}
</style>
</head>
<body>
<header>
  <h1>다온 영단어장 <small id="totalLabel"></small></h1>
  <div class="searchrow">
    <input id="q" type="text" placeholder="단어, 뜻, 표현 검색...">
  </div>
  <div class="toolrow">
    <button id="exportBtn">백업 내보내기</button>
    <button id="importBtn">백업 불러오기</button>
    <button id="resetBtn">초기화</button>
  </div>
  <input type="file" id="importFile" accept="application/json" style="display:none">
  <div class="rowlabel">카테고리</div>
  <div class="filters" id="partFilters"></div>
  <div class="rowlabel">상태</div>
  <div class="filters">
    <button class="chip" id="allChip">전체</button>
    <button class="chip" id="doneChip">암기완료</button>
    <button class="chip" id="notdoneChip">미암기</button>
    <button class="chip hlchip" id="hlChip">하이라이트 <span class="n" id="hlCount">0</span></button>
  </div>
  <div class="progwrap">
    <div class="progtext"><span>진행률</span><span id="progText">0/0 (0%)</span></div>
    <div class="progbar"><div class="progfill" id="progFill"></div></div>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="pager" id="pager"></div>
</main>
<footer>다온 영단어장 · 로컬 저장 기반 · 카테고리는 자동분류(참고용)</footer>

bility — 개연성을 평가하다", "part": "고급 어휘·표현"}, {"id": 17, "en": "feasibility", "ph": "피저빌러티", "mean": "실현 가능성", "chunk": "assess feasibility — 실현 가능성을 평가하다", "part": "고급 어휘·표현"}, {"id": 18, "en": "viability", "ph": "바이어빌러티", "mean": "사업·실행 가능성", "chunk": "test viability — 실행 가능성을 검증하다", "part": "고급 어휘·표현"}, {"id": 19, "en": "counterargument", "ph": "카운터아규먼트", "mean": "반론", "chunk": "address the counterargument — 반론에 대응하다", "part": "일반 동사·표현"}, {"id": 20, "en": "counterexample", "ph": "카운터이그잼플", "mean": "반례", "chunk": "give a counterexample — 반례를 들다", "part": "고급 어휘·표현"}, {"id": 21, "en": "contradiction", "ph": "컨트러딕션", "mean": "모순", "chunk": "resolve a contradiction — 모순을 해소하다", "part": "고급 어휘·표현"}, {"id": 22, "en": "trade-off", "ph": "트레이드오프", "mean": "상충관계", "chunk": "weigh the trade-offs — 상충관계를 따져보다", "part": "고급 어휘·표현"}, {"id": 23, "en": "assumption gap", "ph": "어섬션 갭", "mean": "가정의 빈틈", "chunk": "identify an assumption gap — 가정의 빈틈을 찾다", "part": "고급 어휘·표현"}, {"id": 24, "en": "margin of error", "ph": "마진 어브 에러", "mean": "오차 범위", "chunk": "within the margin of error — 오차 범위 안에서", "part": "재무·회계"}, {"id": 25, "en": "rule of thumb", "ph": "룰 어브 썸", "mean": "경험칙", "chunk": "use a rule of thumb — 경험칙을 적용하다", "part": "일반 동사·표현"}, {"id": 26, "en": "order of magnitude", "ph": "오더 어브 매그니튜드", "mean": "자릿수 규모", "chunk": "an order of magnitude larger — 한 자릿수 규모 더 크다", "part": "고급 어휘·표현"}, {"id": 27, "en": "second-order effect", "ph": "세컨드 오더 이펙트", "mean": "2차 효과", "chunk": "consider second-order effects — 2차 효과까지 고려하다", "part": "고급 어휘·표현"}, {"id": 28, "en": "edge case", "ph": "엣지 케이스", "mean": "예외적 상황", "chunk": "handle an edge case — 예외적 상황을 처리하다", "part": "고급 어휘·표현"}, {"id": 29, "en": "blind spot", "ph": "블라인드 스팟", "mean": "사각지대", "chunk": "identify a blind spot — 사각지대를 찾다", "part": "고급 어휘·표현"}, {"id": 30, "en": "infer", "ph": "인퍼", "mean": "추론하다", "chunk": "infer the intent — 의도를 추론하다", "part": "고급 어휘·표현"}, {"id": 31, "en": "derive", "ph": "디라이브", "mean": "도출하다", "chunk": "d 획 가정", "chunk": "document planning assumptions — 계획 가정을 문서화하다", "part": "고급 어휘·표현"}, {"id": 3151, "en": "base assumption", "ph": "베이스 어섬프션", "mean": "기준 가정", "chunk": "set a base assumption — 기준 가정을 정하다", "part": "고급 어휘·표현"}, {"id": 3152, "en": "sensitivity case", "ph": "센시티비티 케이스", "mean": "민감도 시나리오", "chunk": "build a sensitivity case — 민감도 시나리오를 만들다", "part": "고급 어휘·표현"}, {"id": 3153, "en": "planning horizon", "ph": "플래닝 허아이전", "mean": "계획 기간", "chunk": "extend the planning horizon — 계획 기간을 늘리다", "part": "고급 어휘·표현"}, {"id": 3154, "en": "forecast horizon", "ph": "포어캐스트 허아이전", "mean": "예측 기간", "chunk": "set the forecast horizon — 예측 기간을 정하다", "part": "재무·회계"}, {"id": 3155, "en": "time horizon", "ph": "타임 허아이전", "mean": "기간 범위", "chunk": "use a longer time horizon — 더 긴 기간을 사용하다", "part": "고급 어휘·표현"}, {"id": 3156, "en": "short-term view", "ph": "쇼어트 텀 뷰", "mean": "단기 관점", "chunk": "take a short-term view — 단기 관점으로 보다", "part": "고급 어휘·표현"}, {"id": 3157, "en": "long-term view", "ph": "롱 텀 뷰", "mean": "장기 관점", "chunk": "take a long-term view — 장기 관점으로 보다", "part": "고급 어휘·표현"}, {"id": 3158, "en": "strategic priority", "ph": "스트러티직 프라이오러티", "mean": "전략 우선순위", "chunk": "set strategic priorities — 전략 우선순위를 정하다", "part": "전략·프레임워크"}, {"id": 3159, "en": "operational priority", "ph": "아퍼레이셔널 프라이오러티", "mean": "운영 우선순위", "chunk": "set operational priorities — 운영 우선순위를 정하다", "part": "오퍼레이션·공급망"}, {"id": 3160, "en": "competing priority", "ph": "컴피팅 프라이오러티", "mean": "상충하는 우선순위", "chunk": "balance competing priorities — 상충하는 우선순위를 조정하다", "part": "고급 어휘·표현"}, {"id": 3161, "en": "resource allocation", "ph": "리소스 앨러케이션", "mean": "자원 배분", "chunk": "improve resource allocation — 자원 배분을 개선하다", "part": "고급 어휘·표현"}, {"id": 3162, "en": "resource utilization", "ph": "리소스 유털러제이션", "mean": "자원 활용", "chunk": "improve resource utilization — 자원 활용을 개선하다", "part": "고급 어휘·표현"}, {"id": 3163, "en": "resource availability", "ph": "리소스 어베일러빌러티", "mean": "자원 가용성", "chunk": "check resource availability — 자원 가용성을 확인하다", "part": "고급 어휘·표현"}, {"id": 3164, "en": "resource gap", "ph": "리소스 갭", "mean": "자원 부족", "chunk": "identify a resource gap — 자원 부족을 파악하다", "part": "고급 어휘·표현"}, {"id": 3165, "en": "capacity gap", "ph": "커패서티 갭", "mean": "역량 부족", "chunk": "identify a capacity gap — 역량 부족을 파악하다", "part": "고급 어휘·표현"}, {"id": 3166, "en": "skill gap", "ph": "스킬 갭", "mean": "역량 격차", "chunk": "close the skill gap — 역량 격차를 줄이다", "part": "일반 동사·표현"}, {"id": 3167, "en": "capability gap", "ph": "케이퍼비러티 갭", "mean": "역량 격차", "chunk": "close the capability gap — 역량 격차를 줄이다", "part": "일반 동사·표현"}, {"id": 3168, "en": "knowledge gap", "ph": "날리지 갭", "mean": "지식 격차", "chunk": "close the knowledge gap — 지식 격차를 줄이다", "part": "일반 동사·표현"}, {"id": 3169, "en": "information gap", "ph": "인퍼메이션 갭", "mean": "정보 격차", "chunk": "close the information gap — 정보 격차를 줄이다", "part": "일반 동사·표현"}, {"id": 3170, "en": "expectation gap", "ph": "엑스펙테이션 갭", "mean": "기대 격차", "chunk": "close the expectation gap — 기대 격차를 줄이다", "part": "일반 동사·표현"}, {"id": 3171, "en": "communication gap", "ph": "커뮤너케이션 갭", "mean": "소통 격차", "chunk": "close the communication gap — 소통 격차를 줄이다", "part": "커뮤니케이션·프레젠테이션"}, {"id": 3172, "en": "execution gap", "ph": "엑서큐션 갭", "mean": "실행 격차", "chunk": "close the execution gap — 실행 격차를 줄이다", "part": "일반 동사·표현"}, {"id": 3173, "en": "strategy-execution gap", "ph": "스트래터지 엑서큐션 갭", "mean": "전략-실행 격차", "chunk": "close the strategy-execution gap — 전략-실행 격차를 줄이다", "part": "전략·프레임워크"}];
</script>
<script>
const DATA = window.VOCAB_DATA;
const PARTS = ["재무·회계", "일반 동사·표현", "데이터·분석·리서치", "마케팅·브랜딩", "오퍼레이션·공급망", "세일즈·영업", "프로덕트·테크 운영", "농업·소재과학", "법무·계약", "스타트업·투자", "협상·회의", "전략·프레임워크", "지속가능성·친환경", "HR·조직·리더십", "커뮤니케이션·프레젠테이션", "고객·CS", "이커머스·D2C", "고급 어휘·표현"];

let done = new Set(JSON.parse(localStorage.getItem("daon_vocab_done_v2")||"[]"));
let hl = new Set(JSON.parse(localStorage.getItem("daon_vocab_hl_v2")||"[]"));
function saveDone(){ localStorage.setItem("daon_vocab_done_v2", JSON.stringify([...done])); }
function saveHl(){ localStorage.setItem("daon_vocab_hl_v2", JSON.stringify([...hl])); }

const state = { q:"", part:null, status:"all", hlOnly:false, page:1 };
const PAGE_SIZE = 30;

const partFilters = document.getElementById("partFilters");
function renderPartChips(){
  partFilters.innerHTML = "";
  const allBtn = document.createElement("button");
  allBtn.className = "chip" + (state.part===null?" on":"");
  allBtn.textContent = "전체";
  allBtn.onclick = ()=>{ state.part=null; state.page=1; render(); };
  partFilters.appendChild(allBtn);
  PARTS.forEach(p=>{
    const n = DATA.filter(d=>d.part===p).length;
    const b = document.createElement("button");
    b.className = "chip" + (state.part===p?" on":"");
    b.innerHTML = p + ' <span class="n">'+n+'</span>';
    b.onclick = ()=>{ state.part=p; state.page=1; render(); };
    partFilters.appendChild(b);
  });
}

document.getElementById("allChip").onclick = ()=>{ state.status="all"; state.page=1; render(); };
document.getElementById("doneChip").onclick = ()=>{ state.status="done"; state.page=1; render(); };
document.getElementById("notdoneChip").onclick = ()=>{ state.status="notdone"; state.page=1; render(); };
document.getElementById("hlChip").onclick = ()=>{ state.hlOnly=!state.hlOnly; render(); };

function card(d){
  const el = document.createElement("div");
  el.className = "card" + (done.has(d.id)?" done":"") + (hl.has(d.id)?" hl":"");
  el.innerHTML = `
    <div class="rank">#${d.id}</div>
    <div class="part-tag">${d.part}</div>
    <span class="en">${d.en}</span><span class="ph">[${d.ph}]</span>
    <div class="mean">${d.mean}</div>
    <div class="chunk">${d.chunk}</div>
    <div class="btnrow">
      <button class="abtn ${done.has(d.id)?'done-on':''}" data-act="done">암기완료</button>
      <button class="abtn ${hl.has(d.id)?'hl-on':''}" data-act="hl">하이라이트</button>
    </div>
  `;
  el.querySelector('[data-act="done"]').onclick = ()=>{
    if(done.has(d.id)) done.delete(d.id); else done.add(d.id);
    saveDone(); render();
  };
  el.querySelector('[data-act="hl"]').onclick = ()=>{
    if(hl.has(d.id)) hl.delete(d.id); else hl.add(d.id);
    saveHl(); render();
  };
  return el;
}

function render(){
  renderPartChips();
  document.getElementById("allChip").classList.toggle("on", state.status==="all");
  document.getElementById("doneChip").classList.toggle("on", state.status==="done");
  document.getElementById("notdoneChip").classList.toggle("on", state.status==="notdone");
  document.getElementById("hlChip").classList.toggle("on", state.hlOnly);

  let hits = DATA.filter(d=>{
    if(state.part && d.part!==state.part) return false;
    if(state.status==="done" && !done.has(d.id)) return false;
    if(state.status==="notdone" && done.has(d.id)) return false;
    if(state.hlOnly && !hl.has(d.id)) return false;
    if(state.q){
      const q = state.q.toLowerCase();
      const hay = (d.en+" "+d.mean+" "+d.chunk+" "+d.ph).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  const totalPages = Math.max(1, Math.ceil(hits.length / PAGE_SIZE));
  if(state.page > totalPages) state.page = totalPages;
  const start = (state.page-1)*PAGE_SIZE;
  const pageItems = hits.slice(start, start+PAGE_SIZE);

  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  if(pageItems.length===0){
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "조건에 맞는 단어가 없습니다.";
    grid.appendChild(e);
  }
  pageItems.forEach(d => grid.appendChild(card(d)));

  const doneCount = DATA.filter(d=>done.has(d.id)).length;
  const pct = DATA.length ? Math.round(doneCount/DATA.length*100) : 0;
  document.getElementById("progText").textContent = `${doneCount}/${DATA.length} (${pct}%)`;
  document.getElementById("progFill").style.width = pct + "%";
  document.getElementById("hlCount").textContent = hl.size;
  document.getElementById("totalLabel").textContent = DATA.length + "개";

  const pager = document.getElementById("pager");
  pager.innerHTML = "";
  if(totalPages > 1){
    const mk = (label, page, disabled, on) => {
      const b = document.createElement("button");
      b.className = "pgbtn" + (on?" on":"");
      b.textContent = label; b.disabled = !!disabled;
      b.onclick = ()=>{ state.page = page; render(); window.scrollTo(0,0); };
      return b;
    };
    pager.appendChild(mk("‹ 이전", state.page-1, state.page<=1));
    const info = document.createElement("span");
    info.id = "pageInfo";
    info.textContent = `${state.page} / ${totalPages} 페이지  (총 ${hits.length}개)`;
    pager.appendChild(info);
    pager.appendChild(mk("다음 ›", state.page+1, state.page>=totalPages));
  }
}

document.getElementById("q").addEventListener("input", e=>{
  state.q = e.target.value.trim(); state.page = 1; render();
});
document.getElementById("resetBtn").onclick = ()=>{
  if(confirm("암기완료·하이라이트 기록을 전부 초기화할까요?")){
    done = new Set(); hl = new Set(); saveDone(); saveHl(); render();
  }
};
document.getElementById("exportBtn").onclick = ()=>{
  const payload = JSON.stringify({done:[...done], hl:[...hl], savedAt:new Date().toISOString()});
  const blob = new Blob([payload], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "daon_vocab_progress_backup.json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
};
document.getElementById("importBtn").onclick = ()=>{
  document.getElementById("importFile").click();
};
document.getElementById("importFile").addEventListener("change", (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const obj = JSON.parse(ev.target.result);
      const newDone = new Set(obj.done||[]);
      const newHl = new Set(obj.hl||[]);
      if(confirm(`백업 파일에서 암기완료 ${newDone.size}개, 하이라이트 ${newHl.size}개를 불러옵니다. 현재 기록을 덮어쓸까요?`)){
        done = newDone; hl = newHl; saveDone(); saveHl(); render();
        alert("복원 완료!");
      }
    }catch(err){
      alert("백업 파일을 읽지 못했습니다. 올바른 백업 파일인지 확인해주세요.");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

render();
</script>
</body></html>
