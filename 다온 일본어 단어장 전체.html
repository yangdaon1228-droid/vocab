<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>다온 일본어 단어장</title>
<style>
:root{
  --ink:#2b2530; --sub:#8a7f8c; --line:#f0dfe8; --bg:#fdf6fa; --card:#fff;
  --done:#c2668f; --done-bg:#fbeef3; --done-line:#eac3d5;
  --hl:#8570c4; --hl-bg:#f1eefa; --hl-line:#d8d0ee;
  --chip-on:#c2668f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;}
header{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:10px 12px 8px;}
h1{font-size:15px;margin:0 0 8px;font-weight:800;color:#c9457e;}
h1 small{color:var(--sub);font-weight:600;}
.searchrow{display:flex;gap:6px;}
#q{flex:1;padding:11px 13px;font-size:16px;border:1.5px solid var(--line);
  border-radius:12px;background:var(--card);outline:none;color:var(--ink);}
#q:focus{border-color:var(--hl);}
.toolrow{display:flex;gap:7px;margin-top:7px;}
#exportBtn,#importBtn,#resetBtn{flex:1;padding:9px 0;border-radius:12px;border:1.5px solid;
  font-size:12.5px;font-weight:700;background:var(--card);}
#exportBtn{color:#7a5c9e;border-color:#d8c7ec;background:#f8f5fc;}
#importBtn{color:#7a5c9e;border-color:#d8c7ec;background:#f8f5fc;}
#resetBtn{color:#d1467f;border-color:#f0b7c8;background:#fdf3f7;flex:0 0 auto;padding:9px 14px;}
.rowlabel{font-size:10.5px;color:var(--sub);font-weight:800;margin:8px 0 3px 2px;}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1.2px solid var(--line);
  background:var(--card);font-size:12.5px;font-weight:700;color:var(--sub);white-space:nowrap;}
.chip.on{background:var(--chip-on);color:#fff;border-color:var(--chip-on);}
.chip.hlchip.on{background:var(--hl);border-color:var(--hl);}
.chip .n{opacity:.75;font-weight:600;margin-left:3px;}
.progwrap{padding:8px 2px 0;}
.progtext{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;margin-bottom:4px;}
.progbar{height:7px;background:#ffe4ee;border-radius:5px;overflow:hidden;}
.progfill{height:100%;background:linear-gradient(90deg,#c2668f,#b98a9e);width:0%;transition:width .25s;}
main{padding:8px 10px 90px;max-width:1000px;margin:0 auto;}
.grid{display:grid;grid-template-columns:1fr;gap:9px;}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr;}}
@media(min-width:1020px){.grid{grid-template-columns:1fr 1fr 1fr;}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:12px 13px;position:relative;}
.card.done{background:var(--done-bg);border-color:var(--done-line);}
.card.hl{border-color:var(--hl);box-shadow:0 0 0 1.5px var(--hl) inset;background:var(--hl-bg);}
.card.done.hl{background:linear-gradient(135deg,var(--hl-bg),var(--done-bg));}
.rank{position:absolute;top:8px;right:10px;font-size:10.5px;color:var(--sub);font-weight:700;}
.part-tag{display:inline-block;font-size:9.5px;font-weight:800;color:#a15c8c;
  background:#ffe9f2;border-radius:6px;padding:1.5px 6px;margin-bottom:5px;}
.kr{font-size:22px;font-weight:900;line-height:1.25;margin-right:6px;color:#3a2e3e;}
.ro{font-size:12.5px;color:var(--sub);font-style:italic;}
.mean{margin-top:4px;font-size:14.5px;color:#4a3f47;}
.ex{margin-top:6px;font-size:12.8px;color:#8c7d92;line-height:1.5;
  border-left:2.5px solid var(--hl-line);padding-left:7px;}
.btnrow{display:flex;gap:6px;margin-top:9px;}
.abtn{flex:1;padding:7px 0;border-radius:10px;border:1.2px solid var(--line);
  background:#fff;font-size:12.5px;font-weight:700;color:var(--sub);}
.abtn.done-on{background:var(--done);border-color:var(--done);color:#fff;}
.abtn.hl-on{background:var(--hl);border-color:var(--hl);color:#fff;}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px;}
.pager{display:flex;justify-content:center;align-items:center;gap:10px;padding:16px 0 6px;flex-wrap:wrap;}
.pgbtn{padding:8px 14px;border-radius:10px;border:1.2px solid var(--line);
  background:#fff;font-size:13px;font-weight:700;color:var(--ink);}
.pgbtn:disabled{opacity:.35;}
.pgbtn.on{background:var(--chip-on);color:#fff;border-color:var(--chip-on);}
#pageInfo{font-size:12.5px;color:var(--sub);}
footer{text-align:center;padding:10px;font-size:11px;color:var(--sub);}

:root{
  --ink:#271f33; --sub:#857b94; --line:#e7e0f2; --bg:#f8f6fc; --card:#fff;
  --done:#9b2c6e; --done-bg:#f8eaf2; --done-line:#e6bfd6;
  --hl:#6a45c2; --hl-bg:#efeafb; --hl-line:#d3c6f1;
  --chip-on:#5b3a9e;
}
h1{color:#5b3a9e;}
#exportBtn,#importBtn{color:#5b3a9e;border-color:#d3c6f1;background:#f4f0fc;}
#resetBtn{color:#9b2c6e;border-color:#e6bfd6;background:#fbf1f6;}
.chip.hlchip.on{background:#9b2c6e;border-color:#9b2c6e;}
.progbar{background:#ece6f6;}
.progfill{background:linear-gradient(90deg,#5b3a9e,#9b2c6e);}
.part-tag{color:#5b3a9e;background:#eee8fa;}
.kr{color:#2a1f3d;}
.ex{border-left-color:var(--hl-line);}
.card.hl{border-color:#9b2c6e;box-shadow:0 0 0 1.5px #9b2c6e inset;background:#fbf2f7;}
.abtn.hl-on{background:#9b2c6e;border-color:#9b2c6e;}
.abtn.done-on{background:#5b3a9e;border-color:#5b3a9e;}
.card.done{background:#f3effb;border-color:#d3c6f1;}
.card.done.hl{background:linear-gradient(135deg,#fbf2f7,#f3effb);}
.pgbtn.on{background:#5b3a9e;border-color:#5b3a9e;}
.kj{font-size:15px;font-weight:700;color:#9b2c6e;margin-right:6px;}
*,*::before,*::after{border-radius:0 !important;}
.hun{margin-top:6px;font-size:12.8px;color:#8c7d92;line-height:1.5;
  border-left:2.5px solid var(--hl-line);padding-left:7px;}
</style>
</head>
<body>
<header>
  <h1>다온 일본어 단어장 <small id="totalLabel"></small></h1>
  <div class="searchrow"><input id="q" type="text" placeholder="뜻, 발음, 한자 검색..."></div>
  <div class="toolrow">
    <button id="exportBtn">백업 내보내기</button>
    <button id="importBtn">백업 불러오기</button>
    <button id="resetBtn">초기화</button>
  </div>
  <input type="file" id="importFile" accept="application/json" style="display:none">
  <div class="rowlabel">카테고리</div>
  <div class="filters" id="partFilters"></div>
  <div class="rowlabel">상태</div>
  <div class="filters">
    <button class="chip" id="allChip">전체</button>
    <button class="chip" id="doneChip">암기완료</button>
    <button class="chip" id="notdoneChip">미암기</button>
    <button class="chip hlchip" id="hlChip">하이라이트 <span class="n" id="hlCount">0</span></button>
  </div>
  <div class="progwrap">
    <div class="progtext"><span>진행률</span><span id="progText">0/0 (0%)</span></div>
    <div class="progbar"><div class="progfill" id="progFill"></div></div>
  </div>
</header>
<main><div class="grid" id="grid"></div><div class="pager" id="pager"></div></main>
<footer>다온 일본어 단어장 · 기록은 이 브라우저에 저장됩니다</footer>

function save(k,s){ try{ localStorage.setItem(k, JSON.stringify([...s])); }catch(e){} }
let done = load(KD), hl = load(KH);
const state = { q:"", part:null, status:"all", hlOnly:false, page:1 };
const PAGE_SIZE = 30;
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderPartChips(){
  const box = document.getElementById("partFilters"); box.innerHTML = "";
  const mk=(label,val,n)=>{ const b=document.createElement("button");
    b.className="chip"+(state.part===val?" on":"");
    b.innerHTML=esc(label)+(n!=null?' <span class="n">'+n+'</span>':'');
    b.onclick=()=>{state.part=val;state.page=1;render();}; box.appendChild(b); };
  mk("전체",null,null);
  PARTS.forEach(p=>{ const n=DATA.filter(d=>d.part===p).length; if(n) mk(p,p,n); });
}
document.getElementById("allChip").onclick=()=>{state.status="all";state.page=1;render();};
document.getElementById("doneChip").onclick=()=>{state.status="done";state.page=1;render();};
document.getElementById("notdoneChip").onclick=()=>{state.status="notdone";state.page=1;render();};
document.getElementById("hlChip").onclick=()=>{state.hlOnly=!state.hlOnly;state.page=1;render();};

function card(d){
  const el=document.createElement("div");
  el.className="card"+(done.has(d.id)?" done":"")+(hl.has(d.id)?" hl":"");
  el.innerHTML=`<div class="rank">#${d.id}</div>
    <div class="part-tag">${esc(d.part)}</div>
    <div><span class="kr">${esc(d.ph)}</span>${d.orig?`<span class="kj">${esc(d.orig)}</span>`:""}</div>
    <div class="mean">${esc(d.kr)}</div>
    ${d.hun?`<div class="hun">${esc(d.hun)}</div>`:""}
    <div class="btnrow">
      <button class="abtn ${done.has(d.id)?'done-on':''}" data-act="done">암기완료</button>
      <button class="abtn ${hl.has(d.id)?'hl-on':''}" data-act="hl">하이라이트</button>
    </div>`;
  el.querySelector('[data-act="done"]').onclick=()=>{done.has(d.id)?done.delete(d.id):done.add(d.id);save(KD,done);render();};
  el.querySelector('[data-act="hl"]').onclick=()=>{hl.has(d.id)?hl.delete(d.id):hl.add(d.id);save(KH,hl);render();};
  return el;
}

function render(){
  renderPartChips();
  document.getElementById("allChip").classList.toggle("on",state.status==="all");
  document.getElementById("doneChip").classList.toggle("on",state.status==="done");
  document.getElementById("notdoneChip").classList.toggle("on",state.status==="notdone");
  document.getElementById("hlChip").classList.toggle("on",state.hlOnly);
  const q=state.q.toLowerCase();
  const hits=DATA.filter(d=>{
    if(state.part&&d.part!==state.part) return false;
    if(state.status==="done"&&!done.has(d.id)) return false;
    if(state.status==="notdone"&&done.has(d.id)) return false;
    if(state.hlOnly&&!hl.has(d.id)) return false;
    if(q&&!(d.kr+" "+d.ph+" "+d.orig+" "+d.hun).toLowerCase().includes(q)) return false;
    return true;
  });
  const totalPages=Math.max(1,Math.ceil(hits.length/PAGE_SIZE));
  if(state.page>totalPages) state.page=totalPages;
  const items=hits.slice((state.page-1)*PAGE_SIZE,state.page*PAGE_SIZE);
  const grid=document.getElementById("grid"); grid.innerHTML="";
  if(!items.length){ const e=document.createElement("div"); e.className="empty"; e.textContent="조건에 맞는 단어가 없습니다."; grid.appendChild(e); }
  items.forEach(d=>grid.appendChild(card(d)));
  const dc=DATA.filter(d=>done.has(d.id)).length, pct=DATA.length?Math.round(dc/DATA.length*100):0;
  document.getElementById("progText").textContent=`${dc}/${DATA.length} (${pct}%)`;
  document.getElementById("progFill").style.width=pct+"%";
  document.getElementById("hlCount").textContent=DATA.filter(d=>hl.has(d.id)).length;
  document.getElementById("totalLabel").textContent=DATA.length+"개";
  const pager=document.getElementById("pager"); pager.innerHTML="";
  if(totalPages>1){
    const mk=(label,page,dis)=>{const b=document.createElement("button");b.className="pgbtn";b.textContent=label;b.disabled=!!dis;
      b.onclick=()=>{state.page=page;render();window.scrollTo(0,0);};return b;};
    pager.appendChild(mk("‹ 이전",state.page-1,state.page<=1));
    const info=document.createElement("span"); info.id="pageInfo";
    info.textContent=`${state.page} / ${totalPages} 페이지  (총 ${hits.length}개)`; pager.appendChild(info);
    pager.appendChild(mk("다음 ›",state.page+1,state.page>=totalPages));
  }
}
document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value.trim();state.page=1;render();});
document.getElementById("resetBtn").onclick=()=>{ if(confirm("암기완료·하이라이트 기록을 전부 초기화할까요?")){done=new Set();hl=new Set();save(KD,done);save(KH,hl);render();} };
document.getElementById("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify({done:[...done],hl:[...hl],savedAt:new Date().toISOString()})],{type:"application/json"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="daon_jp_lexicon_backup.json";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
};
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=ev=>{ try{ const o=JSON.parse(ev.target.result); const nd=new Set(o.done||[]), nh=new Set(o.hl||[]);
      if(confirm(`백업 파일에서 암기완료 ${nd.size}개, 하이라이트 ${nh.size}개를 불러옵니다. 현재 기록을 덮어쓸까요?`)){done=nd;hl=nh;save(KD,done);save(KH,hl);render();alert("복원 완료!");}
    }catch(err){ alert("백업 파일을 읽지 못했습니다. 올바른 백업 파일인지 확인해주세요."); } };
  r.readAsText(f); e.target.value="";
});
render();
</script>
</body></html>
